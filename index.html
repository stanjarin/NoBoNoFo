mile more warn't far for the raft to go, but he wished we was already there. Towards daybreak we tied up, and Jim was mighty particular about hiding the raft good. Then he worked all day fixing things in bundles, and getting all ready to quit rafting. That night about ten we hove in sight of the lights of a town away down in a left-hand bend. I went off in the canoe, to ask about it. Pretty soon I found a man out in the river with a skiff, setting a trot-line. I ranged up and says: \" Mister, is that town Cairo? \" \" Cairo? no. You must be a blame' fool.\" \"What town is it, mister?*' \" If you want to know, go and find out. If you stay here botherin' around me for about a half a minute longer, you'll get something you won't want.\" I paddled to the raft. Jim was awful disappointed, but I said never mind, Cairo would be the next place, I reckoned."],["We passed another town before daylight, and I was going No high out again; but it was high ground, so I didn't go. ground about Cairo, Jim said. We laid I had forgot it. up for the day, on a tow-head tolerable close to the left-hand bank. I begun to suspicion something. So did Jim. I says: \" Maybe we went by Cairo in the fog that night.\" He says: \" Doan' less' talk about it, Huck. Po' niggers can't have no luck. I awluz 'spected dat rattle-snake skin warn't done wid it's work.\" I do wish I'd ''I wish I'd never seen that snake-skin, Jim never laid eyes on it.\" \"It ain't yo' fault, Huck; you didn' know. Don't you blame yo'self 'bout it.\" When it was daylight, here was the clear Ohio water in shore, sure enough, and outside was the old regular Muddy! So it was all up with Cairo. We talked it all over. It wouldn't do to take to the shore; we couldn't take the raft up the stream, of course. There warn't no way but to wait for dark, and start back in the canoe and take the chances."],["So we slept all day amongst the cotton-wood thicket, so as to be fresh for the work, and when we went back to the raft about dark the canoe was gone! We didn't say a word for a good while. There warn't anything to say. We both knowed well enough it was some more work of the rattle-snake skin; so what was the use to talk about it? It would only look like we was finding fault, and that would be bound to fetch more bad luck and keep on fetching it, too, till we knowed enough to keep still. By-and-by we talked about what we better do, and found there warn't no way but just to go along down with the raft till we got a chance to buy a canoe to go back in. We warn't going to borrow it when there warn't anybody around, the way pap would do, for that might set people after us. So we shoved out, after dark, on the raft. Anybody that don't believe yet, that it's foolishness to handle a snake- skin, after all that that snake-skin done for us, will believe it now, if they read on and see what more it done for us."],["The place to buy canoes is off of rafts laying up at shore. But we didn't see no rafts laying up; so we went along during three hours and more. Well, the night got gray, and ruther thick, which is the next meanest thing to fog. You can't tell the shape of the river, and you can't see no distance. It got and then along comes a steamboat up the river. We lit the lantern, and judged she would see it. Up-stream boats didn't generly come close to us; they go out and follow the bars and hunt for easy water under the to be very late and still, reefs; l)ut nights like this they bull right up the channel against the whole river. We could hear her pounding along, but we didn't see her good till she was close. She aimed right for us. Often they do that and try to see how close they can come without touching; sometimes the wheel bites off a sweep, and then the pilot sticks his head out and laughs, and thinks he's mighty smart. Well, here she comes, and we said she was going to try and shave us; but she didn't seem to be sheering off a bit."],["She was a big one, and she was coming in a hurry, too, looking like a black cloud with rows of glow-worms around it; but all of a sudden she bulged out, big and scary, with a long row of wide-open furnace doors shining like red-hot teeth, and her monstrous bows and guards hanging right over us. There was a yell at us, and a jingling of bells to stop the engines, a pow-wow of cussing, and whistling of steam and as Jim went overboard on one side and I on the other, she come smashing straight through the raft. I dived and I aimed to find the bottom, too, for a thirtyfoot wheel had got to go over me, and I wanted it to have plenty of room. I could always stay under water a minute; this time I reckon I staid under water a minute and a half. Then I bounced for the top in a hurry, for I was nearly busting. I popped out to my arm-pits and blowed the water out of my nose, and puffed a bit. Of course there was a booming current; and of course that boat started her engines again ten seconds after she stopped them, for they never cared much for raftsmen; so now she was"],["churning along up the river, out of sight in the thick weather, though could hear her. I sung out for Jim about a dozen times, but I didn't get any answer, so I grabbed a plank that touched me while I was *' treading water,\" and struck out for shore, shoving it ahead of me. But I made out to see that the drift of the current was towards the left-hand shore, which meant that I was in a crossing; so I changed off and went that way. It was one of these long, slanting, two-mile crossings; so I was a good long time in getting over. I made a safe landing, and clum up the bank. I couldn't see but a little ways, but I went poking along over rough ground for a I quarter of a mile or more, and then I run across a big oldfashioned double log house before I noticed it. I was going to rush by and get away, but a lot of dogs jumped out and howling and barking at me, and better than to move another peg. went to I knowed Il6"]],"start":191},{"id":17,"title":"Chapter 17","pages":[["about a minute somebody spoke out of a window, IN out putting his head out, and says: \" Be done, boys! witli- Who's there? I says: It's me.\" ''Who's me?\" \"George Jackson, sir.\" *'What do you want?\" I only want to go along by, I don't want nothing, sir. but the dogs won't let me.*' \"What are you prowling around here this time of night, for— hey? I warn't prowling around, sir; I fell overboard off of the steamboat.\" Oh, you did, did you? Strike a light there, somebody. What did you say your name was? \" \" George Jackson, sir. I'm only a boy.\" \"Look here; if you're telling the truth, you needn't be nobody '11 hurt you. But don't try to budge; stand afraid Rouse out Bob and Tom, some of right where you are. George Jackson, is there anyyou, and fetch the guns. body with you? \"No, sir, nobody.\" I heard the and see a light. people stirring around The man sung out: in the house, now, Snatch that light away, Betsy, you old fool ain't you got any sense? Put it on the floor behind the front door. Bob, if you and Tom are ready, take your places.\" \" All ready.\" \" Now, George Jackson, do you know the Shepherdsons?"],["No, sir I never heard of them.\" \"Well, that may be so, and it mayn't. Now, all ready. Step forward, George Jackson. And mind, don't you hurry 11/ him anybody with you, —come mighty slow. keep back — he shows himself Come along, be enough now. Come slow; push the door open, yourself— squeeze you hear \" If there's let shot. he'll if just to in, d'? I didn't hurry, I couldn't if I'd a wanted to. I took one slow step at a time, and there warn't a sound, only I thought I could hear my heart. The dogs were as still as the humans, but they followed a little behind me. When I got to the three log door-steps, I heard them unlocking and unbarring and unbolting. I put my hand on the door and pushed it a little and a little more, till somebody said, \" There, that's enough put your head in.\" I done it, but I judged they would take it off. The candle was on the floor, and there they all was, looking at me, and me at them, for about a quarter of a minute. Three big men with guns pointed at me, which made me wince, I tell you; the oldest, gray and about sixty, the other"],["two thirty or more all of them fine and handsome and the sweetest old gray-headed lady, and back of her two young women which I couldn't see right well. The old gentleman says: \" There I reckon it's all right. Come in.\" As soon as I was in, the old gentleman he locked the door and barred it and bolted it, and told the young men to come in with their guns, and they all went in a big parlor that had a new rag carpet on the floor, and got together in a corner that was out of range of the front windows there warn't none on the side. They held the candle, and took a good look at me, and all said, ** Why he ain't a Shepherdson no, there ain't any Shepherdson about him.\" Then the old man said he hoped I wouldn't mind being searched for arms, because he didn't mean no harm by it it was only to make sure. So he didn't pry into my pockets, but only felt outside with his hands, and said it was all right. He told me to make myself easy and at home, and tell all about myself; but the old lady says: '* Why bless you, Saul, the poor thing's as wet"],["as he can be; and don't you reckon it may be he's hungry? True for you, Rachel I forgot.\" So the old lady says: '* Betsy \" (this was a nigger woman), '' you fly around and get him something to eat, as quick as you can, poor thing; Il8 and one of you girls go and wake up Buck and tell him Oh, Buck, take this little stranger and get the here he is himself. wet clothes off from him and dress him up in some of yours that's dry.\" Buck looked about as old as me thirteen or fourteen or along there, though he was a little bigger than me. He hadn't on anything but a shirt, and he was very frowsy-headed. He come in gaping and digging one fist into his eyes, and he was dragging a gun along with the other one. He says: *' Ain't they no Shepherdsons around?\" They said, no, 'twas a false alarm. \" Well,\" he says, \" if they'd a ben some, I reckon I'd a got one.'* They all laughed, and Bob says: \" Why, Buck, they might have scalped us all, you've been so slow in coming.\" \" Well, nobody come after me, and it ain't right."],["I'm always kep' down; I don't get no show.\" \"Nevermind, Buck, my boy,\" says the old man, ** you'll have show enough, all in good time, don't you fret about that. Go 'long with you now, and do as your mother told you.\" When we got up stairs to his room, he got me a coarse shirt and a round-about and pants of his, and I put them on. While I was at it he asked me what my name was, but before I could tell him, he started to telling me about a blue jay and a young rabbit he had catched in the woods day before yesterday, and he asked me where Moses was when the candle went out. I said I didn't know; I hadn't heard about it be- no way. fore, ''Well, guess,\" he says. How'm I going to guess,\" says I, *' when I never heard about it before? \" But you can guess, can't you? \" Which candle? \" I says. tell It's just as Why, any candle,\" he says. don't know where he was,\" says I; easy.\" where was he? \" \"Why he was in the dark! That's where he was!"],["\" \" Well, if you knowed where he was, what did you ask me I for? \" Why, blame Say, how it, it's a riddle, don't you see? long are you going to stay here? You got to stay always. We can just have booming times they don't have no school Do you own a dog? I've got a dog and he'll go in now. the river and bring out chips that you throw in. Do you like to comb up, Sundays, and all that kind of foolishness? You bet I don't, but ma she makes me. Confound these ole britches, I reckon I'd better put 'em on, but I'd ruther not, Are you all ready? All right come along, it's so warm. old hoss.\" Cold corn-pone, cold corn-beef, butter and butter-milk that is what they had for me down there, and there ain't nothBuck and his ma ing better that ever I've come across yet. and all of them smoked cob pipes, except the nigger woman, which was gone, and the two young women. They all smoked and talked, and I eat and talked. The young women had quilts around them, and their hair down their backs."],["They all asked me questions, and I told them how pap and me and all the family was living on a little farm down at the bottom of Arkansaw, and my sister Mary Ann run off and got married and never was heard of no more, and Bill went to hunt them and be warn't heard of no more, and Tom and Mort died, and then there warn't nobody but just me and pap left, and he was just trimmed down to nothing, on account of his troubles; so when he died I took what there was left, because the farm didn't belong to us, and started up the river, deck passage, and fell overboard; and that was how I come to be here. So they said I could have a home there as long as I wanted it. Then it was most daylight, and everybody went to bed, and I went to bed with Buck, and when I waked up in the morning, drat it all, I had forgot what my name was. So I laid there about an hour trying to think, and when Buck waked up, I says: \"Can you spell, Buck?\""],["\" Yes,\" he says. \"I bet you can't spell my name,\" says I. I bet you what you dare I can,\" says he. All right,\" says I, *'go ahead.\" G-o-r-g-e J-a-x-o-n there now,\" he says. \"Well,\" says I, \" you done it, but I didn't think you could. It ain't no slouch of a name to spell right off without studying.\" I set it down, private, because somebody might want me to and so I wanted to be handy with it and rattle it off like I was used to it. It was a mighty nice family, and a mighty nice house, too. I hadn't seen no house out in the country before that was so nice and had so much style. It didn't have an iron latch on the front door, nor a wooden one with a buckskin string, but a brass knob spell it, next, There warn't no bed in to turn, the same as houses in a town. the parlor, not a sign of a bed; but heaps of parlors in towns has beds in them. There was a big fireplace that was bricked on the bottom, and the bricks was kept clean and red by pouring water on them and scrubbing them with another brick; sometimes they washed them over with"],["red water-paint that They had they call Spanish-brown, same as they do in town. big brass dog-irons that could hold up a saw-log. There was a clock on the middle of the mantel-piece, with a picture of a town painted on the bottom half of the glass front, and a round place in the middle of it for the sun, and you could see the pendulum swing behind it. It was beautiful to hear that clock tick; and sometimes when one of these peddlers had been along and scoured her up and got her in good shape, she would start in and strike a hundred and fifty before she got tuckered out. They wouldn't took any money for her. Well, there was a big outlandish parrot on each side of the clock, made out of something like chalk, and painted up gaudy. By one of the parrots was a cat made of crockery, and a crockery dog by the other; and when you pressed down on them they squeaked, but didn't open their mouths nor look different nor interested. They squeaked through underneath. There was a couple of big wild-turkey-wing fans spread out behind those things."],["On the table in the middle of the room was a kind of a lovely crockery basket that had apples and oranges and peaches and grapes piled up in it which was much redder and yellower and prettier than real ones is, but they warn't real because you could see where pieces had got chipped off and showed the white chalk or whatever it was, underneath. This table had a cover made out of beautiful oil-cloth, with a red and blue spread-eagle painted on it, and a painted border all around. It come all the way from Philadelphia, they said. There was some books too, piled up perfectly exact, on each corner of the table. One was a big family Bible, full of pictures. One was \" Pilgrim's Progress,\" about a man that left his family now and then. it didn't say why. I read considerable in it The statements was interesting, but tough. Another was \" Friendship's Offering,\" full of beautiful stuff and poetry; but I didn't read the poetry. Another was Henry Clay's Speeches, and another was Dr. Gunn's Family Medicine, which told you all about what to do if a body was sick or dead."],["There was a Hymn Book, and a lot of other books. And there was nice split-bottom chairs, and perfectly sound, too not bagged down in the middle and busted, like an old basket. They had pictures hung on the walls mainly Washingtons and Lafayettes, and battles, and Highland Marys, and one There was some that they called \" Signing the Declaration.\" called crayons, which one of the daughters which was dead made her own self when she was only fifteen years old. They was different from any pictures I ever see before; blacker, One was a woman in a slim black mostly, than is common. dress, belted small under the arm-pits, with bulges like a cabbage in the middle of the sleeves, and a large black scoopshovel bonnet with a black veil, and white slim ankles crossed about with black tape, and very wee black slippers, like a chisel, and she was leaning pensive on a tombstone on her right elbow, under a weeping willow, and her other hand hanging down her side holding a white handkerchief and a reticule, and underneath the picture it said \" Shall I Never See Thee More Alas.\" Another one was a young lady with her hair all combed up straight to the top of her head, and knotted"],["there in front of a comb like a chair-back, and she was crying into a handkerchief and had a dead bird laying on its back in her other hand with its heels up, and underneath the picture it said \" I Shall Never Hear Thy Sweet Chirrup More Alas.\" There was one where a young lady was at a window looking up at the moon, and tears running down her cheeks; and she had an open letter in one hand with black sealing-wax showing on one edge of it, and she was mashing a locket with a chain to it against her mouth, and underneath the picture it said \" And Art Thou Gone Yes Thou Art Gone Alas.\" These was all nice pictures, I reckon, but I didn't somehow seem to take to them, because if ever I was down a little, they always give me the fan-tods. Everybody was sorry she died, because she had laid out a lot more of these pictures to do, and a body But I could see by what she had done what they had lost. reckoned, that with her disposition, she was having a better time in the grave-yard."],["She was at work on what they said was her greatest picture when she took sick, and every day and every night it was her prayer to be allowed to live till she got it done, but she never got the chance. It was a picture of a young woman in a long white gown, standing on the of a bridge all ready to jump off, with her hair all down her back, and looking up to the moon, wath the tears running down her face, and she had two arms folded across her breast, and two arms stretched out in front, and two more reaching up towards the moon and the idea was, to see which pair rail would look best and then scratch out all the other arms; but, as I was saying, she died before she got her mind made up, and now they kept this picture over the head of the bed in her room, and every time her birthday come they hung flowers on Other times it was hid with a little curtain. The young it. woman in the picture had a kind of a nice sweet face, but there was so many arms it made her look too spidery, seemed to me."],["This young girl kept a scrap-book when she was alive, and used to paste obituaries and accidents and cases of patient suffering in it out of the Presbyterian Observer^ and write poetry after them out of her own head. It was very good poetry. This is what she wrote about a boy by the name of Stephen Bowling Bots that fell down a well and was drownded: Ode to Stephen Dowling Bots, Dec'd. And did young Stephen sicken, And did young Stephen die? And did the sad hearts thicken, And did the mourners cry? No; such was not the fate of Young Stephen DowHng Bots; Though sad hearts round him thickened, 'Twas not from sickness' shots. No whooping-cough did rack his frame, Nor measles drear, with spots; Not these impaired the sacred name Of Stephen Dowling Bots. Despised love struck not with woe That head of curl)'^ knots. Nor stomach troubles laid him low. Young Stephen Dowling Bots. O no. Then list with tearful eye, Whilst I his fate do tell. His soul did from this cold world fly. By falling down a well. They got him out and emptied him; Alas it was too late; His spirit was gone for to sport aloft In the realms of the good and great."],["If Emmeline Grangerford could make poetry like that before she was fourteen, there ain't no telling what she could a done by-and-by. Buck said she could rattle off poetry like She didn't ever have to stop to think. He said nothing. she would slap down a line, and if she couldn't find anything to rhyme with it she would just scratch it out and slap down She warn't particular, she could another one, and go ahead. write about anything you choose to give her to write about, Every time a man died, or a woman just so it was sadful. died, or a child died, she would be on hand with her *' tribute \" before he was cold. She called them tributes. The neighbors said it was the doctor first, then Emmeline, then the undertaker the undertaker never got in ahead of Emmeline but once, and then she hung fire on a rhyme for the dead person's name, which was Whistler. She warn't ever the same, after that; she never complained, but she kind of pined away and did not live long. Poor thing, many's the time I made myself go up to the little room that used to be hers and get out her poor old scrap-book and read in it when her"],["pictures had been aggravating me and I had soured on her a little. I liked all that family, dead ones and all, and warn't Poor Emmeline let anything come between us. made poetry about all the dead people when she was alive, and it didn't seem right that there warn't nobody to make some about her, now she was gone; so I tried to sweat out a verse or two myself, but I couldn't seem to make it go, somehow. They kept Emmeline's room trim and nice and all the things fixed in it just the way she liked to have them when The old lady she was alive, and nobody ever slept there. took care of the room herself, though there was plenty of going to niggers, and she sewed there a good deal and read her Bible there, mostly. Well, as I was saying about the parlor, there was beautiful curtains on the windows: white, with pictures painted on them, of castles with vines all down the walls, and cattle coming down to drink. There was a little old piano, too, that had tin pans in it, I reckon, and nothing was ever so lovely as to hear the young ladies sing, *'The Last Link is Broken\" and The walls of all the"],["play \"The Battle of Prague\" on it. on the floors, and and carpets rooms was plastered, most had outside. the the whole house was whitewashed on It was a double house, and the big open place betwixt them was roofed and floored, and sometimes the table was set there in the middle of the day, and it was a cool, comfortable place. Nothing couldn't be better. And warn't the cooking good, and just bushels of it too! —•-..lix^NXV)^\"^"]],"start":208},{"id":18,"title":"Chapter 18","pages":[["was a gentleman, you see. COL.wasGRANGERFORD a gentleman over; and so was his family. all He He was well born, as the saying is, and that's worth as much in a man as it is in a horse, so the Widow Douglass said, and nobody ever denied that she was of the first aristocracy in our town; and pap he always said it, too, though he warn't no more quality than a mud-cat, himself. Col. Grangerford was very tall and very slim, and had a darkish-paly complexion, not a sign of red in it anywheres; he was clean-shaved every morning, all over his thin face, and he had the thinnest kind of lips, and the thinnest kind of nostrils, and a high nose, and heavy eyebrows, and the blackest kind of eyes, sunk so deep back that they seemed like they was looking out of cavHis forehead was high, and erns at you, as you may say. his hair was black and straight and hung to his shoulders. His hands was long and thin, and every day of his life he put on a clean shirt and a full suit from head to foot made out of linen so white it hurt your eyes to look at it; and on Sundays he wore a blue"],["tail-coat with brass buttons on it. He There carried a mahogany cane with a silver head to it. warn't no frivolishness about him, not a bit, and he warn't ever loud. He was as kind as he could be you could feel that, you know, and so you had confidence. Sometimes he smiled, and it was good to see; but when he straightened himself up like a liberty-pole, and the lightning begun to flicker out from under his eyebrows you wanted to climb a tree first, and find out what the matter was afterwards. He didn't ever have to tell anybody to mind their manners everybody was always good mannered where he was. Everybody loved to have him around, too; he was sunshine most always I mean he made it seem like good weather. When he turned into a cloud-bank it was awful dark for a half a minute and that was enough; there wouldn't nothing go wrong again for a week. When him and the old lady come down in the morning, all the family got up out of their chairs and give them good-day, and didn't set down again till they had set down."],["Then Tom and Bob went to the sideboard where the decanters was, and mixed a glass of bitters and handed it to him, and he held it in his hand and waited till Tom's and Bob's was mixed, and then they bowed and said \" Our duty to you, sir, and madam; and they bowed the least bit in the world and said thank you, and so they drank, all three, and Bob and Tom poured a spoonful of water on the sugar and the mite of whisky or apple brandy in the bottom of their tumblers, and give it to me and Bu^k:, and we drank to the old people too. Bob was the oldest, and Tom next. Tall, beautiful men with very broad shoulders and brown faces, and long black hair and black eyes. They dressed in white linen from head to foot, like the old gentleman, and wore broad Panama hats. Then there was Miss Charlotte, she was twenty-five, and tall and proud and grand, but as good as she could be, when she warn't stirred up; but when she was, she had a look that would make you wilt in your tracks, like her father."],["She was beautiful. So was her sister. Miss Sophia, but it was a different kind. She was gentle and sweet, like a dove, and she was only twenty. Each person had their own nigger to wait on them Buck, nigger had a monstrous easy time, because I warn't too. My used to having anybody do anything for me, but Buck's was on the iump most of the time. This was all there was of the family, now but there used and Emmeline they got killed to be more three sons;;; that died. The old gentleman owned a lot of farms, and over a hundred niggers. Sometimes a stack of people would come there, horseback, from ten or fifteen mile around, and stay five or six days, and have such junketings round about and on the river, and dances and picnics in the woods, day- times, and balls at the house, nights. These people was mostly kin-folks of the family. The men brought their guns with them. It was a handsome lot of quality, I tell you. There was another clan of aristocracy around there five or six families— mostly of the name of Shepherdson. They was as high-toned, and well born, and rich and grand, as the The Shepherdsons and Grangerfords used the same steamboat"],["landing, which was about two mile above our house so sometimes when I went up there with a lot of our folks I used to see a lot of the Shepherdsons there, on their fine horses. One day Buck and me was away out in the woods, hunting, and heard a horse coming. We was crossing the road. Buck tribe of Grangerfords.; says \" Quick: Jump for the woods!\"! We done it, and then peeped down the woods through the Pretty soon a splendid young man come galloping down the road, setting his horse easy and looking like a soldier. He had his gun across his pommel. I had seen leaves. him before. It was young Harney Shepherdson. I heard Buck's gun go off at my ear, and Harney's hat tumbled off from his head. He grabbed his gun and rode straight to But we didn't wait. We startthe place where we was hid. ed through the woods on a run. The woods warn't thick, so I looked over my shoulder, to dodge the bullet, and twice and then he rode I seen Harney cover Buck with his gun away the way he come to get his hat, I reckon, but I couldn't see."],["We never stopped running till we got home.; The old gentleman's eyes blazed a minute — 'twas pleasure, mainly, I judged then his face sort of smoothed down, and he says, kind of gentle I don't like that shooting from behind a bush. Why didn't you step into the road, my boy? \" The Shepherdsons don't, father. They always take ad: vantage.'* Miss Charlotte she held her head up like a queen while Buck was telling his tale, and her nostrils spread and her eyes snapped. The two young m^n looked dark, but never said nothing. Miss Sophia she turned pale, but the color come back when she found the man warn't hurt. Soon as I could get Buck down by the corn-cribs under the trees by ourselves, I says Did vou want to kill him, Buck? \" We;]*, J bet I did.\" \" What did h*- do to you?: Him? He never done nothing to me.\" Well, then, what did you want to kill him for? \" Why nothing only it's on account of the feud.\" \"What's a feud?\" \" Why, where was you raised? feud is? Don't you know what a Never heard of it before tell me about it.\" \"Well,\" says Buck, \"a feud is this way."],["A man has a quarrel with another man, and kills him then that other man's brother kills him j then the other brothers, on both then the cousins chip in and bysides, goes for one another and-by everybody's killed off, and there ain't no more feud. But it's kind of slow, and takes a long time.\" '* Has this one been going on long, Buck?;; <'Well I should reckoft! it started thirty year ago, or There was trouble 'bout something som'ers along there. lawsuit settle it and the suit went agin one to and then a and shot the man that won the suit of the men, and so he up which he would naturally do, of course. Anybody would.\" '< What was the trouble about, Buck?— land? '' I reckon maybe I don't know.\" \" Well, who done the shooting? was it a Grangerford or a; Shepherdson? \" Lav/s, how do / know? it was so long ago.\" Don't anybody know? \" Oh, yes, pa knows, I reckon, and some of the other old but they don't know, now, what the row was about people; in the first place.\" \" Has there been many killed."],["Yes — right smart chance of funerals. always kill. mind Buck? \" Pa's got a few buck-shot in him But they don't; but he don't much, anyway. Bob's been carved up some with a bowie, and Tom's been hurt once or it 'cuz he don't weigh twice.\" Has anybody been killed this year, Buck? \" *' Yes, we got one and they got one. 'Bout three months ago, my cousin Bud, fourteen year old, was riding through the woods, on t'other side of the river, and didn't have no weapon with him, which was blame' foolishness, and in a lonesome place he hears a horse a-coming behind ''him, and sees old Baldy Shepherdson a-linkin' after him with his gun in his hand and his white hair a-flying in the wind; and 'stead of jumping off and taking to the brush, Bud 'lowed he could outrun him so they had it, nip and tuck, for five mile or more, the old man a-gaining all the time so at last Bud seen it warn't any use, so he stopped and faced around so as to have the bullet holes in front, you know, and the old man he But he didn't git much chance rode up and shot him down."],["to enjoy his luck, for inside of a week our folks laid hhn;; out.\" I reckon that old man was a coward, Buck.\" \" I reckon he ivarnt a coward. Not by a blame' sight. There ain't a coward amongst them Shepherdsons not a one. And there ain't no cowards amongst the Grangerfords, Why, that old man kep' up his end in a fight one either. day, for a half an hour, against three Grangerfords, and come out winner. They was all a-horseback he lit off of his horse and got behind a little wood-pile, and kep' his horse before him to stop the bullets but the Grangerfords staid on their horses and capered around the old man, and pep*';; Him pered away at him, and he peppered away at them. and his horse both went home pretty leaky and crippled, but the Grangerfords had to h^ fetched \\\\oTi\\Q and one of 'em was dead, and another died the next day. No, sir, if a body's out hunting for cowards, he don't want to fool away any time amongst them Shepherdsons, becuz they don't breed any of that kind** Next Sunday we all went to church, about three mile, everybody a-horseback."],["The men took their guns along, so did Buck, and kept them between their knees or stood them handy against the wall. The Shepherdsons done the same. all about brotherly love, and It was pretty ornery preaching such-like tiresomeness but everybody said it was a good sermon, and they all talked it over going home, and had such a powerful lot to say about faith, and good works, and free grace, and preforeordestination, and I don't know what all, that it did seem to me to be one of the roughest Sundays I had run across yet. About an hour after dinner everybody was dozing around, some in their chairs and some in their rooms, and it got to be pretty dull. Buck and a dog was stretched out on the grass in the sun, sound asleep. I went up to our room, and judged I would take a nap myself. I found that sweet Miss; Sophia standing in her door, which was next to ours, and she took me in her room and shut the door very soft, and asked me if I liked her, and I said I did and she asked me if I would do something for her and not tell anybody, and I said Then she said she'd forgot her"],["Testament, and I would. left it in the seat at church, between two other books and would I slip out quiet and go there and fetch it to her, and I said I would. So I slid out not say nothing to nobody. and slipped off up the road, and there warn't anybody at the church, except maybe a hog or two, for there warn't any lock on the door, and hogs likes a puncheon floor in summer-time because it's cool. If you notice, most folks don't go to church only when they've got to but a hog is different. Says I to myself something's up it ain't natural for a girl to be in such a sweat about a Testament; so I give it a shake, and out drops a little piece of paper with *' Half-past two I ransacked it, but couldn't find wrote on it with a pencil. anything else. I couldn't make anything out of that, so I put the paper in the book again, and when I got home and up stairs, there was Miss Sophia in her door waiting for me. She pulled me in and shut the door then she looked in the Testament till she found the paper, and as soon as she read and before a"],["body could think, she grabit she looked glad bed me and give me a squeeze, and said I was the best boy in the world, and not to tell anybody. She was mighty red in the face, for a minute, and her eyes lighted up and it made her powerful pretty. I was a good deal astonished, but when my breath I asked her what the paper was about, and got I if had read she asked me I it, and I said no, and she asked if me I could read writing, and I told her '* no, only coarsehand,\" and then she said the paper warn't anything but a book-mark to keep her place, and I might go and play now. I went off down to the river, stud)nng over this thing, and pretty soon I noticed that my nigger was following along behind. When we was out of sight of the house, he looked back and around a second, and then comes a-running, and;;;; says \" Mars Jawge, if you'll come down into de swamp, I'll show you a whole stack o' water-moccasins.\" Thinks I, that's mighty curious he said that yesterday."],["Ho oughter know a body don't love water-moccasins enough:; What is he up to anyway? to go around hunting for them. So I says ''All right, trot ahead.\" followed a half a mile, then he struck out over the swamp and waded ankle deep as much as another half mile. I We come to a little flat piece of land which was dry and very thick with trees and bushes and vines, and he says ' You shove right in dah, jist a few steps, Mars Jawge, I's seed 'm befo', I don't k'yer to see dah's whah dey is. 'em no mo'.\" Then he slopped right along and went away, and pretty soon the trees hid him. I poked into the place a-ways and come to a little open patch as big as a bedroom, all hung around with vines, and found a man laying there asleep and by jings it was my old Jim I waked him up, and I reckoned it was going to be a grand surprise to him to see me again, but it warn't. He nearly cried, he was so glad, but he warn't surprised. Said he swum along behind me, that night, and heard me yell every time, but dasn't answer, because he didn't want nobody to pick"],["/«';;/ up, and take him into slavery again. Says he I got hurt a little, en couldn't swim fas', so I wuz a considable ways behine you, towards de las' when you landed I reck'ned I could ketch up wid you on de Ian' 'dout havin' to shout at you, but when I see dat house I begin to go slow. I 'uz off too fur to hear what dey say to you I wuz 'fraid but when it 'uz all quiet agin, I knowedyou's in o* de dogs de house, so I struck out for de woods to wait for day. Early in de mawnin' some er de niggers come along, gwyne to de fields, en dey tuck me en showed me dis place, whah de dogs can't track me on accounts o' de water, en dey brings me truck to eat every night, en tells me how you's a gitt'n!; along,\" Why didn't you tell my Jack to fetch me here sooner, Jim?\" Well, 'twarn't no use to 'sturb you, Huck, tell we could but we's all right, now. I ben a-buyin' pots en pans en vittles, as I got a chanst, en a patchin' up de raf, do sumfn nights, when \" What raft, Jim?"],["\" Our ole raf. ** \"You mean to say our old raft warn't smashed all to flinders? No, she warn't. She was tore up a good deal one en' of her was but dey warn't no great harm done, on'y our Ef we hadn' dive' so deep en swum traps was mos' all los'. so fur under water, en de night hadn' ben so dark, en we warn't so sk'yerd, en ben sich punkin-heads, as de sayin' is, But it's jis' as well we didn't, 'kase now we'd a seed de raf. she's all fixed up agin mos' as good as new, en we's got a new lot o' stuff, too, in de place o* what 'uz los'.\" *' Why, how did you get hold of the raft again, Jim did you catch her? \" How I gwyne to ketch her, en I out in de woods? No, some er de niggers foun' her ketched on a snag, along heah in de ben', en dey hid her in a crick, 'mongst de willows, en dey wuz so much jawin' 'bout which un 'um she b'long to de mos', dat I come to heah 'bout it pooty soon, so I ups en settles de trouble by tellin' 'um she don't b'long to none uv um, but"],["to you en me; en I ast'm if dey gwyne to grab a young white genlman's propaty, en git a hid'n for it? Den I gin 'm ten cents apiece, en dey 'uz mighty well satisfied, en wisht some mo' raf's 'ud come along en make 'm rich agin. Dey's mighty good to me, dese niggers is, en whatever I wants 'm Dat to do fur me, I doan' have to ast 'm twice, honey. Jack's a good nigger, en pooty smart.\" He ain't ever told me you was here; told *'Yes, he is. me to come, and he'd show me a lot of water-moccasins. If He can say he anything happens, he ain't mixed up in it. never seen us together, and it'll be the truth.\" I reckon I don't want to talk much about the next day. I waked up about dawn, and was I'll cut it pretty short. agoing to turn over and go to sleep again, when I noticed how still it was — didn't seem to anybody stirring. That Next I noticed that Buck was up and gone. warn't usual. Well, I gets up, a-wondering, and goes down stairs nobody around; everything as still as a mouse."],["Just the same outside; thinks I, what does it mean? Down by the wood-pile I comes across my Jack, and says: \" What's it all about? \" Says he: \" Don't you know, Mars Jawge? \" \"No,\" says I, '' I don't.\" ''Well, den, Miss Sophia's run off! 'deed she has. She run off in de night, sometime nobody don't know jis' when run off to git married to dat young Harney Shepherdson, De fambly foun' it out, leastways, so dey 'spec. maybe a little mo' en' I fe// you 'bout half an hour ago dey warn't no time los'. Sich another hurryin' up guns en bosses you never see De women folks has gone for to stir up de relations, en ole Mars Saul en de boys tuck dey guns en rode up de river road for to try to ketch dat young man en kill him 'fo'he kin git acrost de river wid Miss Sophia. I reck'n dey's gwyne to be mighty rough times.\" \" Buck went off 'thout waking me up.\" ^ \" Well I reck'n he did/ Dey warn't gwyne to mix you up in it. Mars Buck he loaded up his gun en 'lowed he's gwyne Well,dey'll be plenty to fetch home a Shepherdson or bust."],["un 'm dah, I reck'n, en you bet you he'll fetch one ef he gits a chanst.\" I took up the river road as hard as I could put. By-andby I begin to hear guns a good ways off. When 1 eome in sight of the log store and the wood-pile where the steamboats lands, I worked along under the trees and brush till I got to a good place, and then I dumb up into the forks of a cotton-wood that was out of reach, and watched. There was a wood-rank four foot high, a little ways in front of the tree, and first I was going to hide behind that; but maybe it was luckier I didn't. There was four or five men cavorting around on their horses in the open place before the log store, cussing and yelling, and trying to get at a couple of young chaps that was behind the wood-rank alongside of the steamboat landing but they couldn't come it. Every time one of them showed himself on the river side of the wood-pile he got shot at. The two boys was squatting back to back behind the pile, so they you know!"],["could watch both ways. By-and-by the men stopped cavorting around and yelling. They started riding towards the store; then up gets one of the boys, draws a steady bead over the wood-rank, and drops one of them out of his saddle. All the men jumped off of their horses and grabbed the hurt one and started to carry him to the store; and that minute the two boys started on the huckleb?:rry finn. They got half-way to the tree I was in before the men Then the men see them, and jumped on their They gained on the boys, horses and took out after them. run. noticed. but it didn't do no good, the boys had too good a start; they got to the wood-pile that was in front of my tree, and slipped in behind it, and so they had the bulge on the men again. One of the boys was Buck, and the other was a slim young chap about nineteen years old. The men ripped around awhile, and then rode away. As soon as they was out of sight, I sung out to Buck and told him. He didn't know what to make of my voice coming out of the tree, at first He was awful surprised."],["He told me to watch out sharp and let him know when the men come in sight again; said they was up to some devilment or other wouldn't be gone long. I wished I was out of that tree, but I dasn't come down. Buck begun to cry and rip, and 'lowed that him and his cousin Joe (that was the other young chap) would make up for this day, yet. He said his father and his two brothers was killed, and two or three of the enemy. Said the Shepherdsons laid for them, in ambush. Buck said his father and brothers ought to waited for their relations I asked him the Shepherdsons was too strong for them. what was become of young Harney and Miss Sophia. He said they'd got across the river and was safe. I was glad of that; but the way Buck did take on because he didn't manage to kill Harney that day he shot at him I hain't ever heard anything like it. All of a sudden, bang bang bang goes three or four guns the men had slipped around through the woods and come in from behind without their horses The boys jumped for the river both of them hurt and as they swum down the current the"],["men run along the bank shooting at them and singing out, *' Kill them, kill them \" It made me so sick I most fell out of the tree. I ain't agoing to tell all that happened it would make me sick again if I was to do that. I wished I hadn't ever come ashore that night, to see such things. I ain't ever going to get shut of them lots of times I dream about them.!!!!! the tree till it begun to get dark, afraid to come Sometimes I heard guns away off in the w^oods; and twice I seen little gangs of men gallop past the log store with guns; so I reckoned the trouble was still agoing on. I was mighty down-hearted; so I made up my mind I wouldn't ever go anear that house again, because I reckoned I was to blame, somehow. I judged that that piece of paper meant that Miss Sophia was to meet Harney somewheres at half-past two and run off; and I judged I ought to told her father about that paper and the curious way she acted, and then maybe he would a locked her up and this awful mess wouldn't ever I staid in down."],["happened. When I got down out of the tree, I crept along down the bank a piece, and found the two bodies laying in the edge of the water, and tugged at them till I got them ashore; then I covered up their faces, and got away as quick as I could. I cried a little when I was covering up Buck's face, for he was mighty good to me. It was just dark, now. I never went near the house, but struck through the woods and made for the swamp. Jim warn't on his island, so I tramped off in a hurry for the crick, and river crowded through the willows, red-hot to jump aboard and get out of that awful country the raft was gone My souls, but I was scared I couldn't get my breath for most a minute. Then I raised a yell. voice not twenty-five foot from me, says \" Good Ian' is dat you, honey? Doan' make no noise.\" It was Jim's voice nothing ever sounded so good before. I run along the bank a piece and got aboard, and Jim he grabbed me and hugged me, he was so glad to see me."],["He says \" Laws bless you, chile, I 'uz right down sho' you's dead agin. Jack's been heah, he say he reck'n you's ben shot, kase you didn' come home no mo'; so I's jes' dis minute a!! A! de raf down towards de mouf er de crick, so's to be ready for to shove out en leave soon as Jack comes agin en tells me for certain you is dead. Lawsy, I's mighty glad to git you back agin, honey.\" startin' all I says mighty good; they won't find me, and and floated down the river there's something up there that'll help them think so so don't you lose no time, Jim, but just shove off for the big water as fast as ever you can.\" I never felt easy till the raft was two mile below there and out in the middle of the Mississippi. Then we hung up our signal lantern, and judged that we was free and safe once more. I hadn't had a bite to eat since yesterday; so Jim he got out some corn-dodgers and butter milk, and pork and cabbage, and greens there ain't nothing in the world so good, when it's cooked right and whilst I eat my supper we talked, and had a good time."],["I was powerful glad to get away from the feuds, and so was Jim to get away from the swamp. We said there warn't no home like a raft, after all. Other places do seem so cramped up and smothery, but a raft don't. You feel mighty free and easy and comfortable on a raft. All right they'll think that's I've been killed, n8"]],"start":225},{"id":19,"title":"Chapter 19","pages":[["or three days and nights went by; I reckon I might say they swum by, they slid along so quiet and smooth and lovely. Here is the way we put in the time. It was a monstrous big river down there sometimes a mile and a half wide; we run nights, and laid up and hid day-times; soon as night was most gone, we stopped navigating and tied up nearly always in the dead water under a tow-head; and then cut young cotton-woods and willows and hid the raft with them. Then we set out the lines. Next we slid into the river and had a swim, so as to freshen up and cool off; then we set down on the sandy bottom where the water was about knee deep, and watched the daylight come. Not a sound, anywheres perfectly still just like the whole world was asleep, only sometimes the bull-frogs a-cluttering, maybe. The first thing to see, looking away over the water, was a kind of dull line that was the woods on t'other side you couldn't make nothing else out; then a pale place in the sky; then more paleness, spreading around; then the river softened up, away off, and warn't black any more, but gray you could see little dark spots"],["drifting along, ever so far away trading scows, and such things; and long black streaks rafts; sometimes you could hear a sweep screaking; or jumbled up voices, it was so still, and sounds come so far; and by-and-by you could see a streak on the water which you know by the look of the streak that there's a snag there in a swift current which breaks on it and makes that streak look that way; and you see the mist curl up off of the water, and the east reddens up, and the river, and you make out a log cabin in the edge of the woods, away on the bank on t'other side cf the river, being a woodyard, likely, and piled by them cheats so you can throw a dog through it anywheres; then the nice breeze springs up, and comes fanning you from over there, so cool and fresh, and sweet to smell, on account of the woods and the flowers; but; sometimes not that way, because they've left dead fish laying around, gars, and such, and they do get pretty rank; and next you've got the full day, and everything smiling in the sun, and the song-birds just going it!"],["A little smoke couldn't be noticed, now, so we would take some fish off of the lines, and cook up a hot breakfast. And afterwards we would watch the lonesomeness of the river, and kind of lazy along, and by-and-by lazy off to sleep. Wake up, by-and-by, and look to see what done it, and maybe see a steamboat, coughing along up stream, so far off towards the other side you couldn't tell nothing about her only whether she was a stern-wheel or side-wheel; then for about an hour there wouldn't be nothing to hear nor nothing to see just solid lonesomeness. Next you'd see a raft sliding by, away off yonder, and maybe a galoot on it chopping, because they're most always doing it on a raft; you'd see the ax flash, and come down you don't hear nothing; you see that ax go up again, and by the time it's above the man's head, then you hear the k' chunk! it had took all that time to come over the water. So we would put in the day, lazying around, listening to the stillness. Once there was a thick fog, and the rafts and things that went by was beating tin pans so the steamboats wouldn't run over them."],["A scow or a raft went by so close we could hear them talking and cussing and laughing heard them plain; but we couldn't see no sign of them; it made you feel crawly, it was like spirits carrying on that way in the air. Jim said he believed it was spirits; but I says: ** No, dern the dern fog.'\" spirits wouldn't say, Soon as it was night, out we shoved; when we got her out to about the middle, we let her alone, and let her float wherever the current wanted her to; then we lit the pipes, and dangled our legs in the water and talked about all kinds of things we was always naked, day and night, whenever the mosquitoes would let us the new clothes Buck's folks made for me was too good to be comfortable, and besides I didn't go much on clothes, nohow. Sometimes we'd have that whole river all to ourselves for the longest time. Yonder was the banks and the islands, across the water; and maybe a spark which was a candle in a cabin window and sometimes on the water you could see a spark or two on a raft or a scow, you know; and maybe you could hear a fiddle or a song"],["coming over from one of them crafts. It's lovely to live on a raft. We had the sky, up there, all speckled with stars, and we used to lay on our backs and look up at them, and discuss about whether they was made, or only just happened J mi he allowed they was madC; but I allowed they happened; I judged it would have took too long to make so many. Jim said the moon could a /aid them; well, that looked kind of reasonable, so I didn't say nothing against it, because I've seen a frog lay most as many, so of course it could be done. We used to watch the stars that fell, too, and see them streak down. Jim allowed they'd got spoiled and was hove out of the nest. Once or twice of a night we would see a steamboat slipping along in the dark, and now and then she would belch a whole world of sparks up out of her chimbleys, and they would rain down in the river and look awful pretty; then she would turn a corner and her lights would wink out and her pow-wow shut off and leave the river still again; and by-and-by her waves would get to us, a long time after"],["she was gone, and joggle the raft a bit, and after that you wouldn't hear nothing for you couldn't tell how long, except maybe frogs or something. After midnight the people on shore went to bed, and then no more sparks for two or three hours the shores was black These sparks was our clock the first in the cabin windows. one that showed again meant morning was coming, so we hunted a place to hide and tie up, right away. One morning about day-break, I found a canoe and crossed over a chute to the main shore it was only two hundred yards and paddled about a mile up a crick amongst the cypress woods, to see if I couldn't get some berries. Just as I was passing a place where a kind of a cow-path crossed the crick, here comes a couple of men tearing up the path as tight as they could foot it. I thought I was a goner, for whenever anybody u find 'em, says I This that's my motto. ain't no bad thing that we've struck here plenty grub and an easy life come, give us your hand, Duke, and less all be it friends.\" it. The duke done it, and Jim and me was pretty glad to see It took away all the uncomfortableness and we felt mighty good over it, because it would a been a miserable business to have any unfriendliness on the raft; for what you want, above all things, on a raft, is for everybody to be satisfied, and feel right and kind towards the others. It didn't take me long to make up my mind that these liars warn't no kings nor dukes, at all, but just low-down humbugs and frauds. But I never said nothing, never let on; kept it to myself; it's the best way; then you don't have no quarrels, and don't get into no trouble. If they wanted us to call them kings and dukes, I hadn't no objections, 'long as it would keep peace in the family; and it warn't no use to tell Jim, so I didn*t tell him."],["If I never learnt nothing else out of pap, kind of people I learnt that the best way to get along with his is to let them have their own way."]],"start":249},{"id":20,"title":"Chapter 20","pages":[["many asked up covered what we know questions; wanted to the raft that way for, and was Jim a runlaid by in the day-time instead of running! nigger Says away? Goodness sakes, would a runaway nigger run soiithV No, they allowed he wouldn't. I had to account for things some way, so I says: folks was living in Pike County, in Missouri, where I was born, and they all died off but me and pa and my brother Pa, he 'lowed he'd break up and go down and live with Ike. Uncle Ben, who's got a little one-horse place on the river, forty-four mile below Orleans. Pa was pretty poor, and had some debts; so when he'd squared up there warn't nothing left That warn't enough but sixteen dollars and our nigger, Jim. to take us fourteen hundred mile, deck passage nor no other Well, when the river rose, pa had a streak of luck one way. day; he ketc ning so high, now. come up again, though, and Jim was going to call me, but he changed his mind because he reckoned they warn't high enough yet to do any harm; but he was mistaken about that, for pretty soon all of a sudden along comes a regular ripper, and washed me overboard. It most killed Jim a-laughing. He was the easiest nigger to laugh that ever was, anyway. I took the watch, and Jim he laid down and snored away; and by-and-by the storm let up for good and all and the first cabin-light that showed, I rousted him out and we slid the rip comes another flash and another sockdolager.; raft into hiding-quarters for the day."],["The king got out an old ratty deck of cards, after breakfast, and him and the duke played seven-up a while, five cents a game. Then they got tired of it, and allowed they would 'May out a campaign,\" as they called it. The duke went down into his carpet-bag and fetched up a lot of little printed bills, and read them out loud. One bill said *' The celebrated Dr. Armand de Montalban of Paris,\" would \" lecture on the Science of Phrenology \" at such and such a place, on the blank day of blank, at ten cents admission, and '' furnish charts of character at twenty-five cents apiece.\" The duke said that was him. In another bill he was the <* world renowned Shaksperean tragedian, Garrick the Younger, of Drury Lane, London.\" In other bills he had a lot of other names and done other wonderful things, like finding water and gold with a '' divining rod,\" '' dissipating witch-spells,\" and so on. By-and-by he says \" But the histrionic muse is the darling. Have you ever trod the boards, Royalty? \" No,\" says the king. *'You shall, then, before you're three days older, Fallen Grandeur,\" says the duke."],["'^ The first good town we come to, we'll hire a hall and do the sword-fight in Richard III. and the balcony scene in Romeo and Juliet. How does that strike you? \"I'm in, up to the hub, for anything that will pay. Bilgewater, but you see I don't g louder and louder and towards the end, some begun to groan, and some begun to shout."],["Then the preacher begun to preach and begun in earnest, too and went weaving first to one side of the platform and then the other, and then a leaning down over the front of it, with his arms and his body going all the time, and shouting his words out with all his might and every now and then he would hold up his Bible and spread it open, and kind of pass it around this way and that, shouting, \"It's the brazen serpent in the wilderness Look upon it and live \" And peo<* ple would shout out, Glory h-2,-men!\" And so he;;;;;!!! went on, and the people groaning and crying and saying amen: \" Oh, come to the mourners' {avicn!) come, sick and sore bench come, black with (amen f) come, lame and {amen /) come, pore and needy, sunk in halt, and blind shame {a-a-menf) come all that's worn, and soiled, and suffering! come with a broken spirit! come with a contrite heart! come in your rags and sin and dirt! the waters that cleanse is free, the door of heaven stands open oh, enter in and be at rest! \" {a-a-nien I glory, glory hallelujah!^ And so on."],["You couldn't make out what the preacher said, any more, on account of the shouting and crying. Folks got up, everywheres in the crowd, and worked their way, just by main strength, to the mourners' bench, with the tears running down their faces; and when all the mourners had got up there to the front benches in a crowd, they sung, and shouted, and fiung themselves down on the straw, just crazy and wild. Well, the first I knowed, the king got agoing; and you could hear him over everybody; and next he went a-charging up on to the platform and the preacher he begged him to speak to the people, and he done it. He told them he was a pirate been a pirate for thirty years, out in the Indian Ocean, and his crew was thinned out considerable, last spring, in a fight, and he was home now, to take out some fresh men, and thanks to goodness he'd been robbed last night, and put ashore off of a steamboat without a cent, and he was glad of it, it was the blessedest thing that ever happened to him, because he was a changed man now, and happy for the first time in his life; and poor as he was, he was going"],["to start right off and work his way back to the Indian Ocean and put in sin!!!!! the rest of his life trying to turn the pirates into the true path; for he could do it better than anybody else, being acquainted with all pirate crews in that ocean; and though it would take him a long time to get there, without money, he would get there anyway, and every time he convinced a pirate he would say to him, '' Don't you thank me, don't you give me no credit, it all belongs to them dear people in Pokeville campmeeting, natural brothers and benefactors of the race and that dear preacher there, the truest friend a pirate ever had! And then he busted into tears, and so did everybody. I Then somebody sings out, *' Take up a collection for him, Well, a half a dozen made a jump to take up a collection! \" do it, but somebody sings out, \" Let him pass the hat Then everybody said it, the preacher too. around! \" So the king went all through the crowd with his hat, swabbing his eyes, and blessing the people and praising them and thanking them for being so good to the poor pirates away off there; and every little"],["while the prettiest kind of girls, with the tears running down their cheeks, would up and ask him would he let them kiss him, for to remember him by; and he always done it; and some of them he hugged and kissed as many as five or six times and he was invited to stay a week; and everybody wanted him to live in their houses, and said they'd think it was an honor; but he said as this was the last day of the camp-meeting he couldn't do no good, and besides he was in a sweat to get to the Indian Ocean right off and go to work on the pirates. When we got back to the raft and he come to count up, he found he had collected e  excited, it was perfectly lovely the way he would rip and tear and rair up behind when he was getting it off."],["The first chance we got, the duke he had some show bills printed; and after that, for two or three days as we floated along, the raft was a most uncommon lively place, for there warn't nothing but sword-fighting and rehearsing as the duke called it going on all the time. One morning, when we was pretty well down the State of Arkansaw, we come in sight of a little one-horse town in a big bend; so we tied up about three-quarters of a mile above it, in the mouth of a crick which was shut in like a tunnel by the cypress trees, and all of us but Jim took the canoe and went down there to see if there was any chance in that place for our show. struck it mighty lucky; there was going to be a circus there that afternoon, and the country people was already beginning to come in, in all kinds of old shackly wagons, and on horses. The circus would leave before night, so our show would have a pretty good chance. The duke he hired the court house, and we went around and stuck up our bills."],["We They read like this: Shaksperean Revival Wonderful Attraction! For One Night Only! The world renowned tragedians, David Garrick the younger, of Drury Lane Theatre, London, and Edmund Kean the elder, of the Royal Haymarket Theatre, Whitechapel, Pudding Lane, Piccadilly, London, and the Royal Continental Theatres, in their sublime Shaksperean Spectacle entitled The Balcony Scene!!! in Romeo and Juliet Romeo Juliet!!! Mr. Garrick Mr. Kean l6l Assisted by the whole strength of the company! New costumes, new scenery, new appointments! Also: The thrilling, masterly, and blood-curdling Broad-sword conflict In Richard III. I I! Richard III Mr. Garrick. Mr. Kean. Richmond also: (by special request,) Hamlet's Immortal Soliloquy!! By the Illustrious Kean! Done by him 300 consecutiv-e nights in Paris! For One Night Only, On account of imperative European engagements! Admission 25 cents; children and servants, 10 cents. Then we went loafing around town. The stores and houses was most all old shackly dried-up frame concerns that hadn't ever been painted; they was set up three or four foot above ground on stilts, so as to be out of reach of the water when the river was overflowed. The houses had little gardens around them, but they didn't seem to raise hardly anything in them but jimpson weeds, and sunflowers, and ash-piles, and old curled-up boots"],["and shoes, and pieces of bottles, and rags, and played-out tin-ware. The fences was made of different kinds of boards, nailed on at different times; and they leaned every which-way, and had gates that didn't generly have but one hinge a leather one. Some of the fences had been whitewashed, some time or another, but the duke said it was in Clumbus's time, like enough. There was generly hogs in the garden, and people driving them out. All the stores was along one street. They had white-domestic awnings in front, and the country people hitched their horses to the awning-posts. There was empty dry-goods boxes under the awnings, and loafers roosting on them all day long, whittling them with their Barlow knives; and chawing tobacco, and gaping and yawning and stretching a mighty ornery lot. They generly had on yellow straw hats most as wide as an umbrella, but didn't wear no coats nor waistcoats; they called one another Bill, and Buck, and Hank, and Joe, and Andy, and talked lazy and drawly, and used considerable many cuss words. There was as many as one loafer leaning up against every awning-post, and he most always had his hands in his britches pockets, except when he fetched them What a body was out to lend a"],["chaw of tobacco or scratch. time was hearing amongst them, all the Gimme a chaw 'v tobacker, Hank.\" \" Cain't— I hain't got but one chaw left. Ask Bill.\" Maybe Bill he gives him a chaw; maybe he lies and says he ain't got none. Some of them kinds of loafers never has a cent in the world, nor a chaw of tobacco of their own. They get all their chawing by borrowing they say to a fellow, \" I wisht you'd len' me a chaw, Jack, I jist this minute which is a lie, give Ben Thompson the last chaw I had \" pretty much every time; it don't fool nobody but a stranger; but Jack ain't no stranger, so he says '^ You give him a chaw, did you? so did your sister's cat's grandmother. You pay me back the chaws you've awready borry'd off' n me, Lafe Buckner, then I'll loan you one or two ton of it, and won't charge you no back intrust, nuther.\" '* Well, I did pay you back some of it wunst.\" You borry'd store \"Yes, you did 'bout six chaws. tobacker and paid back nigger-head.\" Store tobacco is flat black plug, but these fellows mostly chaws the natural leaf twisted."],["When they borrow a chaw, they don't generly cut it off with a knife, but they set the plug in between their teeth, and gnaw with their teeth and tug at the plug with their hands till they get it in two then sometimes the one that owns the tobacco looks mournful at it when it's handed back, and says, sarcastic \"Here, gimme the chaw, and you take the////^.\" All the streets and lanes was just mud, they warn't nothing else but mud mud as black as tar, and nigh about a foot deep in some places; and two or three inches deep in all the places. The hogs loafed and grunted around, everywheres. You'd see a muddy sow and a litter of pigs come lazying along the street and whollop herself right down in the way, where folks had to walk around her, and she'd stretch out, and shut her eyes, and wave her ears, whilst the pigs was milking her, and look as happy as if she was on salary. And pretty soon you'd hear a loafer sing out, \" Hi! so boy! sick him, Tige! \" and away the sow would go, squealing most horrible, with a dog or two swinging to each ear, and three or four dozen more a-coming; and"],["then you would see all the loafers get up and watch the thing out of sight, and laugh at the fun and look grateful for the noise. Then they'd settle back again till there was a dog-fight. There couldn't anything wake them up all over, and make them happy all over, like a dog-fight unless it might be putting turpentine on a stray dog and setting fire to him, or tying a tin-pan to his tail and see him run himself to death. On the river front some of the houses was sticking out over the bank, and they was bowed and bent, and about ready to tumble in. The people had moved out of them. The bank was caved away under one corner of some others, and that corner was hanging over. People lived in them yet, but it was dangersome, because sometimes a strip of land as wide as a house caves in at a time. Sometimes a belt of land a quarter of a mile deep will start in and cave along and cave along till it all caves into the river in one summer. Such a town as that has to be always moving back, and back, and back, because the river's always gnawing at it."],["The nearer it got to noon that day, the thicker and thicker was the wagons and horses in the streets, and more coming all the time. Families fetched their dinners with them, from There was conthe country, and eat them in the wagons. siderable whiskey drinking going on, and I seen three fights. By-and-by somebody sings out Here comes old Boggs! in from the country for his little old monthly drunk here he comes, boys! All the loafers looked glad I reckoned they was used to having fun out of Boggs. One of them says Wonder who he's a gwyne to chaw up this time. If he'd a chawed up all the men he's ben a gwyne to chaw up in the last twenty year, he'd have considerable ruputation, now.\" Another one says, *'I wisht old Boggs 'd threaten me, 'cuz then I'd know I warn't gwyne to die for a thousan' year.\" Boggs comes a-tearing along on his horse, whooping and yelling like an Injun, and singing out \" Cler the track, than I'm on the waw-path, and the price uv cofiins is a gwyne to raise.\" He was drunk, and weaving about in his saddle; he was Everybody over fifty year old, and had a very red face."],["yelled at him, and laughed at him, and sassed him, and he sassed back, and said he'd attend to them and lay them out in their regular turns, but he couldn't wait now, because he'd come to town to kill old Colonel Sherburn, and his motto was, meat first, and spoon vittles to top off on.\" He see me, and rode up and says Whar'd you come f'm, boy? You prepared to die? Then he rode on. I was scared; but a man says \" He don't mean nothing; he's always a carryin' on like He's the best-naturedest old fool in that, when he's drunk. Arkansaw never hurt nobody, drunk nor sober.\" Boggs rode up before the biggest store in town and bent his head down so he could see under the curtain of the awn- ing, and yells \" Come out here, Sherburn! Come out and meet the man you've swindled. You're the houn' I'm after, and I'm a g^vyne to have you, too! And so he went on, calling Sherburn everything he could lay his tongue to, and the whole street packed with people listening and laughing and going on. By-and-by a proudlooking man about fifty-five and he was a heap the best dressed man in that town, too steps out of the"],["store, and the crowd drops back on each side to let him come. He says to Boggs, mighty ca'm and slow he says: \"I'm tired of this; but I'll endure it till one o'clock. Till one o'clock, mind no longer. If you open your mouth against me only once, after that time, you can't travel so far but I will find you.\" Then he turns and goes in. The crowd looked mighty sober; nobody stirred, and there warn't no more laughing. Boggs rode off blackguarding Sherburn as loud as he could yell, all down the street; and pretty soon back he comes and stops before the store, still keeping it up. Some men crowded around him and tried to get him to shut up, but he wouldn't; they told him it would be one o'clock in about fifteen minutes, and so he must go home he must go right away. But it didn't do no good. He cussed away, with all his might, and throwed his hat down in the mud and rode over it, and pretty soon away he went a-raging down the street again, with his gray hair a-fiying. Everybody that could get a chance at him tried their best to coax him off of his horse so they could lock him up"],["and get him sober; but it warn't no use up the street he would tear again, and give Sherburn another cussing. By-and-by somebody says Go for his daughter! times he'll listen to her. can.\" go daughter; some— quick, anybody can persuade him, she for his If So somebody started on a run. I walked down street a ways, and stopped. In about five or ten minutes, here comes Boggs again but not on his horse. He was a-reeling across the street towards me, bareheaded, with a friend on both sides of him aholt of his arms and hurrying him along. He was quiet, and looked uneasy; and he warn't hanging back any, but was doing some of the hurrying himself. Somebody sings out Boggs!\" looked over there to see who said it, and it was that Colonel Sherburn. He was standing perfectly still, in the not aiming street, and had a pistol raised in his right hand it, but holding it out with the barrel tilted up towards the sky. The same second I see a young girl coming on the run, and two men with her. Boggs and the men turned round, to see who called him, and when they see the pistol the men jumped to one side, and the pistol barrel come"],["down slow and steady to a level both barrels cocked. Boggs throws up both of his hands, and says, *'0 Lord, don't shoot!\" Bang! goes the first shot, and he staggers back clawing at the air bang! goes the second one, and he tumbles backwards onto the ground, heavy and solid, with his arms spread out. I That young girl screamed out, and comes rushing, and down she throws herself on her father, crying, and saying, \" Oh, he's killed him, he's killed him!\" The crowd closed up around them, and shouldered and jammed one another, with their necks stretched, trying to see, and people on the inside trying to nd stooping a little and resting their hands on their thighs to watch him mark the places on the ground with his cane; and then he stood up straight and stiff where Sherburn had stood, frowning and having his hat-brim down over his eyes, and sung out, \" Boggs!\" and then fetched his cane down slow to a level, and says \" Bang! \" staggered backwards, The says \"Bang!\" again, and fell down flat on his back. people that had seen the thing said he done it perfect; said it was just exactly the way it all happened. Then as much as a dozen people got out their bottles and treated him. Well, by-and-by somebody said Sherburn ought to be lynched. In about a minute everybody was saying it; so away they went, mad and yelling, and snatching down every clothes-line they come to, to do the hanging with."],["maybe there was going to be trouble."]],"start":284},{"id":22,"title":"Chapter 22","pages":[["swarmed up a-whooping and raging the street towards Sherburn's house, like Injuns, and everything had to clear the way or get run over and tromped to mush, and it was awful to see. Children was heeling it ahead of the mob, screaming and trying to get out of the way; and every window along the road was full of women's heads, and there was nigger boys in every tree, and bucks and wenches looking over every fence; and as soon as the mob would get nearly to them they would break and skaddle back out of reach. Lots of the women and girls was crying and taking on, scared most to death. They swarmed up in front of Sherburn's palings as thick as they could jam together, and you couldn't hear yourself Some It was a little twenty-foot yard. think for the noise. sung out ''Tear down the fence! tear down the fence!\" Then there was a racket of ripping and tearing and smashing, and down she goes, and the front wall of the crowd begins to roll in like a wave. Just then Sherburn steps out on to the roof of his little front porch, with a double-barrel gun in his hand, and takes his stand, perfectly r stirrups, and resting their hands on their thighs, easy and comfortable there must a' been twenty of them and every lady with a lovely complexion, and perfectly beautiful, and looking just like a gang of real sure-enough queens, and dressed in clothes that cost millions of dollars, and just littered with diamonds."],["It was a powerful fine sight; I never see anything so lovely. And then one by one they got up and stood, and went a-weaving aground the ring so gentle and wavy and graceful, the men looking ever so tall and airy and straight, with their heads bobbing and skimming along, away up there under the tentroof, and every lady's rose-leafy dress flapping soft and silky around her hips, and she looking like the most loveliest parasol. And then faster and faster they went, all of them dancing, first one foot stuck out in the air and then the other, the horses leaning more and more, and the ring-master going round and round the centre-pole, cracking his whip and shouting \"hi! hi!\" and the clown cracking jokes behind him; and by-and-by all hands dropped the reins, and every lady put her knuckles on her hips and every gentleman folded his arms, and then how the horses did lean over and hump themselves! And so, one after the other they all skipped off into the ring, and made the sweetest bow I ever see, and then I/O scampered out, and everyl)ody clapped their hands and went jnst about wild."],["Well, all through the circus they done the most astonishing things: and all the time that clown carried on so it most The ring-master couldn't ever say a word killed the people. to him but he was back at him quick as a wink with the funniest things a body ever said; and how he ever could think of so many of them, and so sudden couldn't noway understand. them in a year. into the ring and so pat, was what I Why, I couldn't a thought of And by-and-by a drunk man tried to get — said he wanted to ride; said he could ride as well as anybody that ever was. They argued and tried t hing pan out this time, Duke? \" He hadn't been up town at all. We never showed a light till we was about ten mile below that village. Then we lit up and had a supper, and the king and the duke fairly laughed their bones loose over the way they'd served them people. The duke says: *' Greenhorns, flatheads! / knew the first house would keep and let the rest of the town get roped in; and I knew they'd lay for us the third night, and consider it was their turn now. Well, it is their turn, and I'd give something to know how much they'd take for it. I would just like to know how they're putting in their opportunity. They can turn it into a picnic, if they want to they brought plenty provisions.\" Them rapscallions took in four hundred and sixty- five dollars in that three nights. I never see money hauled in by the wagon-load like that, before."],["By-and-by, when they was asleep and snoring, Jim says: *^ Don't it 'sprise you, de way dem kings carries on, Huck? ''No,\" I says, ''it don't.\" mum \"Why don't it, Huck?\" \" Well, it don't, because it's in the breed. all I reckon they're alike.\" \"But, Huck^ dese kings o' ourn is regular rapscallions; dat's jist what dey is; dey's reglar rapscallions.\" \"Well, that's what I'm a-saying; all king's is mostly rapscallions, as fur as I can make out.\" \"Is dat so?\" \"You read about them once — you'll see. Look at Henry the Eight; this 'n 's a Sunday-School Superintendent to hi/n. And look at Charles Second, and Louis Fourteen, and Louis Fifteen, and James Second, and Edward Second, and Richard Third, and forty more; besides all them Saxon heptarchies that used to rip around so in old times and raise Cain, My, you ought to seen old Henry the Eight when he was in bloom. He ^t'^zj- a blossom. He used to marry a new wife every day, and chop off her head next morning. And he would do it 'Fetch up just as indifferent as if he was ordering up eggs. 1/6 Gwynn/ he says."],["They fetch her up. And they chop it off. Chop off her head! Ne
