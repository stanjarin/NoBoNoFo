s WELL, the now. had been school most it into winter, I to well all the time, and could spell, and read, and write just a little, and could say the multiplication table up to six times seven is thirty-five, and I don't reckon I could ever get any further than that if I was to live forever. I don't take no stock in mathematics, anyway. At first I hated the school, but by-and-by I got so I could stand it. Whenever I got uncommon tired I played hookey, and the hiding I got next day done me good and cheered me up. So the longer I went to school the easier it got to be. I was getting sort of used to the widow's ways, too, and they warn't so raspy on me. Living in a house, and sleeping in a bed, pulled on me pretty tight, mostly, but before the cold weather I used to slide out and sleep in the woods, sometimes, and so that was a rest to me. I liked the old ways best, but I was getting so I liked the new ones, too, a little bit."],["The widow said I was coming along slow but sure, and She said she warn't ashamed of me. morning One I happened to turn over the salt-cellar at breakfast. I reached for some of it as quick as I could, to throw over my left shoulder and keep off the bad luck, but Miss Watson was in ahead of me, and crossed me off. She says, \" Take your hands away. Huckleberry what a mess you are always making.\" The widow put in a good word for me, but that warn't going to keep off the bad luck, I knowed doing very satisfactory. that well enough. I started out, after breakfast, feeling worried and shaky, and wondering where it was going to fall on There is ways to keep off me, and what it was going to be. some kinds of bad luck, but this wasn't one of them kind; so I never tried to do anything, but just poked along low-spirited and on the watch-out. I went down the front garden and dumb over the stile, where you go through the high board fence. There was an inch of new snow on the ground, and I seen somebody's tracks."],["They had come up from the quarry and stood around the stile a while, and then went on around the garden fence. It was funny they hadn't come in, after standing around so. I couldn't make it out. It was very curious, somehow. I was going to follow around, but I stooped down to look at the I tracks first. I I I I I didn't notice anything at first, but next I did. There was a cross in the left boot-heel made with big nails, to keep off the devil. I looked I was up in a second and shinning down the hill. over my shoulder every now and then, but I didn't see nobody. I was at Judge Thatcher's as quick as I could get there. He said: Why, my boy, you are all out of breath. ^' Did you come for your interest? *' No sir,\" I says; there some for me? Oh, yes, a half-yearly is in, last night. Over a hundred and fifty dollars. Quite a fortune for you. You better let me invest it along with your six thousand, because if you take is it you'll spend it.\" it at all it; No sir,\" I says, — nor the six I don't want to spend it."],["I don't want thousand, nuther. I want you to take want to give it to you I — the six thousand and all.\" He looked surprised. He couldn't seem to make it out. He says: Why, what can you mean, my boy? \" I says, *' Don't you ask me no questions about it, please. You'll take it— won't you? He says: \" Well I'm puzzled. Is something the matter? \" Please take it,\" says I, \" and don't ask me nothing then I won't have to tell no lies.\" He studied a while, and then he says: \" Oho-o. I think I see. You want to seZ/aW your property That's the correct idea.\" to me not give it. Then he wrote something on a paper and read it over, and says: \" There I — you see it says for a consideration. have bought it of you and paid you for it. That means Here's a dollar Now, you sign it.\" So I signed it, and left. Miss Watson's nigger, Jim, had a hair-ball as big as your fist, which had been took out of the fourth stomach of an ox, and he used to do magic with it."],["He said there was a spirit inside of it, and e a-looking at me, with his chair tilted back a little. I I set the candle down. noticed the window was up; so he had dumb in by the shed. He kept a-looking me all over. By-and-by he says: Starchy clothes very. You think you're a good deal of a big-bug, dofit you?\" \" Maybe I am, maybe I ain't,\" I says. Don't you give me none o' your lip,\" says he. \" You've put on considerable many frills since I been away. I'll take you down a peg before I get done with you. You're educated, too, they say; can read and write. You think you're /'// better'n your father, now, don't you, because he can't? take it out of you. Who told you you might meddle with such hifalut'n foolishness, hey?— who told you you could?\" The widow. She told me.\" \" The widow, hey?— and who told the widow she could put in her shovel about a thing that ain't none of her business? \" \" Nobody never told her.\" '' Well, I'll learn her how to meddle."],["And looky here— you drop that school, you hear? I'll learn people to bring up a boy to put on airs over his own father and let on to be You lemme catch you fooling around better'n what he is. Your mother couldn't read, that school again, you hear? and she couldn't write, nuther, before she died. None of the family couldn't, before they died. / can't; and here you're a- swelling yourself up like this. I ain't the man to stand it —you hear? Say — lemme hear you read.\" I I took up a book and begun something about General Washington and the wars. When I'd read about a half a minute, he fetched the book a whack with his hand and knocked it across the house. He says: I had my doubts when you told me. Now looky here; you stop that putting on frills. I I'll lay for you, my smarty; and if I catch won't have it. you about that school I'll tan you good. First you know you'll get religion, too. I never see such a son.\" He took up a little blue and yaller picture of some cows '* It's You can do it."],["so. and a bo}^, and says: '^ What's this? \" *' It's something  take me away from him and let one of them be my guardian; but it was a new judge that had just come, and he didn't know the old man; so he said courts mustn't interfere and separate families if they could help it; said he'd druther not take a child away from its father. So Judge Thatcher and the widow had to quit on the business. That pleased the old man till he couldn't rest. He said he'd cowhide me till I was black and blue if I didn't raise some money for him. I borrowed three dollars from Judge Thatcher, and pap took it and got drunk and went a-blowing around and cussing and whooping and carrying on; and he kept it up all over town, with a tin pan, till most midnight; then they jailed him, and next day they had him before But he said he was court, and jailed him again for a week. satisfied; said he was boss of his son, and he'd make it warm for him. When he got out' the new judge said he was agoing to make a man of him."],["So he took him to his own house, and dressed him up clean and nice, and had him to breakfast and dinner and supper with the family, and was just old pie to him, so to speak. And after supper he talked to him about temperance and such things till the old man cried, and said he'd been a fool, and fooled away his life; but now he was agoing to turn over a new leaf and be a man nobody wouldn't be ashamed of, and he hoped the judge would help him and not The judge said he could hug him for look down on him. them words; so he cried, and his wife she cried again; pap said he'd been a man that had always been misunderstood be- fore, and the judge said he beheved it. The old man said that what a man wanted that was down, was sympathy; and the judge said it was so; so they cried again. And when it was bedtime, the old man rose up and held out his hand, and says: ''Look at it gentlemen, and ladies all; take ahold of it; shake it. There's a hand that was the hand of a hog; but it ain't so no more; it's the hand of a man"],["that's started in on a new life, and '11 die before he'll go back. You mark them words don't forget I said them. It's a clean hand now; shake it don't be afeard.\" So they shook it, one after the other, all around, and cried. The judge's wife she kissed it. Then the old man he signed a pledge made his mark. The judge said it was the holiest time on record, or something like that. Then they tucked the old man into a beautiful room, which was the spare room, and in the night sometime he got powerful thirsty and dumb out onto the porch-roof and slid down a stanchion and traded his new coat for a jug of forty-rod, and dumb back again and had a good old time; and towards daylight he crawled out again, drunk as a fiddler, and rolled off the porch and broke his left arm in two places and was most froze to death when somebody found him after sun-up. And when they come to look at that spare room, they had to take soundings before they could navigate it. The judge he felt kind of sore. He said he reckoned a body could reform the ole man with a shot-gun, maybe, but he didn't know no other"],["way."]],"start":53},{"id":6,"title":"Chapter 6","pages":[["soon the old man was up and around and then he went the courts Judge Thatcher pretty again, for in to make him give up that money, and he went for me, too, for not stopping school. He catched me a couple of times and thrashed me, but I went to school just the same, and dodged him or out-run him most of the time. I didn't want to go to school much, before, but I reckoned I'd go now to spite pap. That law trial was a slow business; appeared like they warn't ever going to get started on it; so every now and then I'd borrow two or three dollars off of the judge for him, to keep from getting a cowhiding. Every time he got money he got drunk; and every time he got drunk he raised Cain around town; and every time he raised Cain he got jailed. He was just suited this kind of thing was right in his line. He got to hanging around the widow's too much, and so she told him at last, that if he didn't quit using around there she would make trouble for him."],["Well, was7i't he mad? He said he would show who was Huck Finn's boss. So he watched out for me one day in the spring, and catched me, and took me up the river about three mile, in a skiff, and crossed over to the Illinois shore where it was woody and there warn't no houses but an old log hut in a place where the timber was so thick you couldn't find it if you didn't know where it was. He kept me with him all the time, and I never got a chance to run off. We lived in that old cabin, and he always locked the door and put the key under his head, nights. He had a gun which he had stole, I reckon, and we fished and hunted, and that was what we lived on. Every little while he locked me in and went down to the store, three miles, to the ferry, and traded fish and game for whisky and fetched it home and The widow got drunk and had a good time, and licked me. she found out where I was, by-and-by, and she sent a man over to try to get hold of me, but pap drove him off with the gun, and it warn't long after"],["that till I was used to being where I was, and liked it, all but the cowhide part. It was kind of lazy and jolly, laying off comfortable all day, smoking and fishing, and no books nor study. Two months or more run along, and my clothes got to be all rags and dirt, and I didn't see how I'd ever got to like it so well at the widow's, where you had to wash, and eat on a plate, and comb up, and go to bed and get up regular, and be forever bothering over a book and have old Miss Watson pecking at you all the time. I didn't want to go back no more. I had stopped cussing, because the widow didn't like it; but now I took to it again because pap hadn't no objections. It was pretty good times up in the woods there, take it all around. But by-and-by pap got too handy with his hick'ry, and I couldn't stand it. I was all over welts. He got to going away so much, too, and locking me in. Once he locked me in and was gone three days. It was dreadful lonesome."],["I judged he had got drowned and I wasn't ever going to get out any more. I was scared. I made up my mind I would fix up some way to leave there. I had tried to get out of that cabin many a time, but I couldn't find no way. There warn't a window to it big enough for a dog to get through. I couldn't get up the chimbly, it was too narrow. The door was thick solid oak slabs. Pap was pretty careful not to leave a knife or anything in the cabin when he was away; I reckon I had hunted the place over as much as a hundred times; well, I was 'most all the time at it, because it was about the only way to put in the time. But this time I found something at last; I found an old rusty wood-saw without any handle; it was laid in between a rafter and the clapboards of the roof. I greased it up and went to work. There was an old horseblanket nailed against the logs at the far end of the cabin behind the table, to keep the wind from blowing through the chinks and putting the candle out."],["I got under the table and raised the blanket and went to work to saw a section of the Well, it big bottom log out, big enough to let me through. was a good long job, but I was getting towards the end of it when I heard pap's gun in the woods. I got rid of the signs of my work, and dropped the blanket and hid my saw, and pretty soon pap come in. Pap warn't in a good humor — so he was his natural self. He said he was down to town, and everything was going wrong. His lawyer said he reckoned he would win his lawsuit and get the money, if they ever got started on the trial but then there was ways to put it off a long time, and Judge Thatcher knowed how to do it. And he said people allowed there'd be another trial to get me away from him and give me to the widow for my guardian, and they guessed it would win, this time. This shook me up considerable, because I didn't want to go back to the widow's any more and be so cramped up and sivilized, as they called it."],["Then the old man got to cussing, and cussed everything and everybody he could think of, and then cussed them all over again to make sure he hadn't skipped any, and after that he polished off with a kind of a general cuss all round, including a considerable parcel of people which he didn't know the names of, and so called them what's-his-name, when he got to them, and went right along with his cussing. He said he would like to see the widow get me. He said; he would watch out, and if they tried to come any such game on him he knowed of a place six or seven mile off, to stow me in, where they might hunt till they dropped and they couldn't find me. That made me pretty uneasy again, but only for a minute; I reckoned I wouldn't stay on hand till he got that chance. The old man made me go to the skiff and fetch the things he had got. There was a fifty-pound sack of corn meal, and a side of bacon, ammunition, and a four-gallon jug of whisky, and an old book and two newspapers for wadding, besides some tow."],["I toted up a load, and went back and set down on the bow of the skiff to rest. I thought it all over, and I reckoned I would w^alk off with the gun and some lines, and take to the woods when I run away. I guessed I wouldn't stay in one place, but just tramp right across the country, mostly night times, and hunt and fish to keep alive, and so get so far away that the old man nor the widow couldn't ever find me any more. I judged I would saw out and leave that night if pap got drunk enough, and I reckoned he would. I got so full of it I didn't notice how long I was staying, till the old man hollered and asked me whether I was asleep or drownded. I got the things all up to the cabin, and then it was about While I was cooking supper the old man took a swig dark. or two and got sort of warmed up, and went to ripping again. He had been drunk over in town, and laid in the gutter all body would a thought night, and he was a sight to look at."],[" es, and I see a bunch of smoke laying on the water a long ways up about abreast the ferry. And there was the ferry-boat full of people, floating along down."],["I knowed what was the matter, now. \"Boom!\" I see the white smoke squirt out of the ferry-boat's side. You see, they was firing cannon over the water, trying to make my carcass come to the top. I was pretty hungry, but it warn't going to do for me to start a fire, because they might see the smoke. So I set there and watched the cannon-smoke and listened to the boom. The river was a mile wide, there, and it always looks pretty on a summer morning so I was having a good enough time seeing them hunt for my remainders, if I only had a bite to eat. Well, then I happened to think how they always put quicksilver in loaves of bread and float them off because they always go right to the drownded carcass and stop there. So says I, I'll keep a lookout, and if any of them's floating around after me, I'll give them a show. I changed to the could have, and warn't disappointed. A big double loaf come along, and I most got it, with a long stick, but my foot slipped and she floated out further."],["Of course I was where the current set in the closest to the shore I knowed enough for that. But by-and-by along comes another one, and this time I won. I took out the plug and shook out the little dab of quicksilver, and set my teeth in. It was \"baker's bread\" what the quality eat none of your low-down corn-pone. I got a good place amongst the leaves, and set there on a log, munching the bread and watching the ferry-boat, and very well satisfied. And then something struck me. I says, now I reckon the widow or the parson or somebody prayed that this bread would find me, and here it has gone and done it. So there ain't no doubt but there is something in that thing. That is, there's something in it when a body like the widow or the parson prays, but it don't work for me, and I reckon it don't work for only just the right kind. I lit a pipe and had a good long smoke and went on watching. The ferry-boat was floating with the current, and I allowed I'd have a chance to see who was aboard when she come along, because she would come in close, where the bread did."],["When she'd got pretty well along down towards me, I put out my pipe and went to where I fished out the bread, and laid down behind a log on the back in a little open place. Where the log forked I could peep through. By-and-by she come along, and she drifted in so close that Most they could a run out a plank and walked ashore. everybody was on the boat. Pap, and Judge Thatcher, and Bessie Thatcher, and Jo Harper, and Tom Sawyer, an^l- his Everyold Aunt Polly, and Sid and Mary, and plenty more. body was talking about the murder, but the captain broke in Illinois edge of the island to see what luck I I and says: \"Look sharp, now; the current sets in the closest here, and maybe he's washed ashore and got tangled amongst the brush at the water's edge. I hope so, anyway.\" They all crowded up and leaned over I didn't hope so. the rails, nearly in my face, and kept still, watching with all I could see them first-rate, but they couldn't their might. Then the captain sung out: Stand away! \" and the cannon let off such a blast right see me."],["before me that it made me deef with the noise and pretty near blind with the smoke, and I judged I was gone. If they'd a had some bullets in, I reckon they'd a got the corpse they was after. Well, I see I warn't hurt, thanks to goodness. The boat floated on and went out of sight around the shoulder of I could hear the booming, now and then, further the island. and further off, and by-and-by after an hour, I didn't hear it no more. The island was three mile long. I judged they had But they didn't yet a got to the foot, and was giving it up. around the foot of the island and startThey turned while. under steam, and Missouri side, ed up the channel on the booming once in a while as they went. I crossed over to When they got abreast the that side and watched them. head of the island they quit shooting and dropped over to the Missouri shore and went home to the town. Nobody else would come I knowed I was all right now. a-hunting after me. I got my traps out of the canoe and made me a nice camp in the thick woods."],["I made a kind of a tent out of my blankets to put my things under so the rain couldn't get at them. I catched a cat-fish and haggled him open with my saw, and towards sundown I started my camp fire and had supper. Then I set out a line to catch some fish for breakfast. When it was dark I set by my camp-fire smoking, and feeling pretty satisfied; but by-and-by it got sort of lonesome, and so I went and set on the bank and listened to the currents washing along, and counted the stars and drift-logs and rafts that come down, and then went to bed; there ain't no better way to put in time when you are lonesome; you can't stay so, you soon get over it. And so for three days and nights. No difference just the same thing. But the next day I went exploring around down through the island. I was boss of it; it all belonged to me, so to sa}^, and I wanted to know all about it; but mainly I wanted to put in the time. I found plenty strawberries, ripe and prime; and green summer-grapes, and green razberries; and the green blackberries was just beginning to show."],["They would all come handy by-and-by, I judged. Well, I went fooling along in the deep woods till I judged I warn't far from the foot of the island. I had my gun along, but I hadn't shot nothing; it was for protection; thought I 5/ would kill some game nigh home. About this time I mightynear stepped on a good sized snake, and it went sliding off through the grass and flowers, and I after it, trying to get a shot at it. I clipped along, and all of a sudden I bounded right on to the ashes of a camp fire that was still smoking. My heart jumped up amongst my lungs. I never waited for to look further, but uncocked my gun and went sneaking back on my tip-toes as fast as ever I could. Every now and then I stopped a second, amongst the thick leaves, and listened; but my breath come so hard I couldn't hear nothing else. I slunk along another piece further, then listened again; and so on, and so on; if I see a stump, I took it for a man; if I trod on a stick and broke it, it made me feel like a person had cut one of my breaths in two and I"],["only got half, and the short half, too. When I got to camp I warn't feeling very brash, there warn't much sand in my craw; but I says, this ain't no time So I got all my traps into my canoe to be fooling around. again so as to have them out of sight, and I put out the fire and scattered the ashes around to look like an old last year's camp, and then dumb a tree. I reckon I was up in the tree two hours; but I didn't see nothing, I didn't hear nothing I only thought I heard and Well, I couldn't stay up seen as much as a thousand things. there forever; so at last I got down, but I kept in the thick woods and on the lookout all the time. All I could get to eat was berries and what was left over from breakfast. By the time it was night I was pretty hungry. So when it was good and dark, I slid out from shore before moonrise and paddled over to the Illinois bank about a quarter of a mile. I went out in the woods and cooked a supper, and I had about made up my mind I would stay there all night, when I"],["hear a plunkety-plunk^ plunkety-phmk, and says to myself, horses coming; and next I hear people's voices. I got everything into the canoe as quick as I could, and then went creeping through the woods to see what I could find out. I hadn't got far when I hear a man say: \"We better camp here, if we can find a good place; the horses is about beat out. Let's look around.\" I didn't wait, but shoved out and paddled away easy. I tied up in the old place, and reckoned I would sleep in the canoe. didn't sleep much, I couldn't, somehow, for thinking. And every time I waked up I thought somebody had me by So the sleep didn't do me no good. By-and-by I the neck. says to myself, I can't live this way; I'm agoing to find out who it is that's here on the island with me; I'll find it out or bust. Well, I felt better, right off. So I took my paddle and slid out from shore just a step or two, and then let the canoe drop along down amongst the shadows. The moon was shining, and outside of the shadows I poked along well onto an it made it most as light as day."],["Well by hour, everything still as rocks and sound asleep. this time I was most down to the foot of the island. A little ripply, cool breeze begun to blow, and that was as good as saying the night was about done. I give her a turn with the paddle and brung her nose to shore; then I got my gun and slipped out and into the edge of the woods. I set down there on a log and looked out though the leaves. I see the moon go off watch and the darkness begin to blanket the river. But in a little while I see a pale streak over the tree-tops, and knowed the day was coming. So I took my gun and slipped off towards where I had run across that camp fire, stopping every minute or two to listen. But I hadn't no luck, somehow; I couldn't seem to find the place. But by-and-by, sure enough, I catched a glimpse of fire, away through the trees. I went for it, cautious and slow. By-and-by I was close enough to have a look, and there laid a man on the ground. It most give me the fan-tods."],["He had a blanket around his head, and his head was nearly in the fire. I set there behind a clump of bushes, in about six foot of him, and kept my eyes on him steady. It was getting gray daylight, now. Pretty soon he gapped, and stretched himself, and hove off the blanket, and it was Miss Watson's Jim! I bet I was glad to see him. I says: \" Hello, Jim! \" and skipped out. He bounced up and stared at me wild. Then he drops down on his knees, and puts his hands together and says: '* Doan' hurt me don't! I hain't ever done no harm to a awluz liked dead people, en done all I could for 'em. You go en git in de river agin, whah you b'longs, en doan' do nuffn to Ole Jim, 'at 'uz awluz yo' fren'.\" Well, I warn't long making him understand I warn't dead. ghos'. I I I warn't lonesome, now. I was ever so glad to see Jim. told him I warn't afraid of him telling the people where I was. I talked along, but he only set there and looked at me; never said nothing."],["Then I says: Make up your ''It's good daylight. Le's get breakfast. camp fire good.\" \" What's de use er makin' up de camp fire to cook strawbries en sich truck? But you got a gun, hain't you? Den we kin git sumfn better den strawbries.\" >r;:'^ \" Strawberries and such truck,\" I says. live on? '*I couldn' git nuffn else,\" Is that what you he says. \"Why, how long you been on the island, Jim?\" \" I come heah de night arter you's killed.\" \"What, all that time?\" \" Yes-indeedy.\" \"And ain't you had nothing but that kind of rubbage to eat? 6o \"No, sah nuffn else.\" \" Well, you must be most starved, ain't you?\" \" I reck'n I could eat a boss. I think I could. How long you ben on de islan'? Since the night I got killed.\" No! W'y, what has you lived on? But you got a gun. Oh, yes, you got a gun. Dat's good. Now you kill sumfn en I'll make up de fire.\" So we went over to where the canoe was, and while he built a fire in a grassy open place amongst the trees, I fetched meal and bacon and coffee, and coffee-pot and frying-pan, and sugar and tin cups, and the nigger was"],["set back considerable, because he reckoned it was all done with witchcraft. I catched a good big cat-fish, too, and Jim cleaned him with his knife, and fried him. When breakfast was ready, we lolled on the grass and eat it smoking hot. Jim laid it in with all his might, for he was most about starved. Then when we had got pretty well stuffed, we laid off and lazied. By-and-by Jim says: \"But looky here, Huck, who wuz it dat 'uz killed in dat shanty, ef it warn't you? Then I told him the whole thing, and he said it was smart. He said Tom Sawyer couldn't get up no better plan than what I had. Then I says: ^' How do you come to be here, Jim, and how'd you get here? He looked pretty uneasy, and didn't say nothing for a minute. Then he says: ''Maybe I better not tell.\" '*Why, Jim?\" Well, dey's reasons. But you wouldn' tell on me ef I 'uz to tell you, would you, Huck? \" Blamed if I would, Jim.\" '' Well, I b'lieve you, Huck. I— I run of.\" ''Jim!\" \" But mind, you said you wouldn't tell you know you said you wouldn't tell, Huck.\" \"Well I did."],["I said I wouldn't, and I'll stick to it. Honest mjun I will. People would call me a low down Ablitionist and despise me for keeping mum but that don't 6l make no difference. I ain't agoing to tell, and I ain't agoing back there anyways. So now, le's know all about it.\" ''Well, you see, it 'uz dis way. Ole Missus dat's Miss Watson she pecks en me all de time, en treats me pooty rough, but she awluz said she wouldn' sell me down to OrBut I noticed dey wuz a nigger trader roun' de place leans. considable, lately, en I begin to git oneasy. Well, one night I creeps to de do', pooty late, en de do' warn't quite shet, en I hear ole missus tell de widder she gwyne to sell me down to Orleans, but she didn' want to, but she could git eight hund'd dollars for me, en it 'uz sich a big stack o' money she couldn' resis'. De widder she try to git her to say she wouldn' do it, but I never waited to hear de res'. I lit out mighty quick, I tell you. \"I tuck out en shin down de hill en 'spec to steal a skift 'long de sho' som'ers 'bove de town,"],["but dey wuz people a-stirrin' yit, so I hid in de ole tumble-down cooper shop on de bank to wait for everybody to go 'way. Well, I wuz dah all night. Dey wuz somebody roun' all de time. 'Long 'bout six in de mawnin', skifts begin to go by, en 'bout eight er nine every skift dat went 'long wuz talkin' 'bout how yo' pap come over to de town en say you's killed. Dese las' skifts wuz full o' ladies en genlmen agoin* over for to see de place. Sometimes dey'd pull up at de sho' en take a res' b'fo' dey started acrost, so by de talk I got to know all 'bout de killin'. I 'uz powerful sorry you's killed, Huck, but I ain't no mo', now. \" I laid dah under de shavins all day. I 'uz hungry, but I warn't afeared; bekase I knowed ole missus en de widder wuz goin' to start to de camp-meetn' right arter breakfas' en be gone all day, en dey knows I goes off wid de cattle 'bout daylight, so dey wouldn' 'spec to see me roun' de place, en De so dey wouldn' miss me tell arter dark in de evenin'."],["yuther servants wouldn' miss me, kase dey'd shin out en take holiday, soon as de ole folks 'uz out'n de way. '' Well, when it come dark I tuck out up de river road, en went 'bout two mile er more to whah dey warn't no houses. I'd made up my mine 'bout what I's agwyne to do. You see ef I kep' on tryin' to git away afoot, de dogs 'ud track me; ef I stole a skift to cross over, dey'd miss dat skift, you see, en dey'd know 'bout whah I'd Ian' on de yuther side en whah up my track. So I sa3^s, a raff is what I's arter; it doan' make no track. \" I see a light a-comin' roun' de p'int, bymeby, so I wade' in en shove' a log ahead o' me en swum more'n half-way acrost de river, en got in 'mongst de drift-wood, en kep' my head down low, en kinder swum agin de current tell de raff come to pick along. Den I swum to de stern uv it, en tuck aholt. It clouded up en 'uz pooty dark for a little while. So I dumb up en laid down on de planks."],["De men 'uz all 'way yonder De river wuz arisin en in de middle, whah de lantern wuz. dey wuz a good current; so I reck'n'd 'at by fo' in de mawnin' I'd be twenty-five mile down de river, en den I'd slip in, jis b'fo' daylight, en swim asho' en take to de woods on de Illinois side. \" But I didn' have no luck. When we 'uz mos' down to de head er de islan', a man begin to come aft wid de lantern. I see it warn't no use fer to wait, so I slid overboard, en struck out fer de islan'. Well, I had a notion I could Ian' mos' anywhers, but I couldn't bank too bluff. I 'uz mos' to de foot er de islan' b'fo' I foun' a good place. I went into de woods en jedged I wouldn' fool wid raffs no mo', long as dey move de lantern roun' so. I had my pipe en a plug er dog-leg, en some matches in my cap, en dey warn't wet, so I 'uz all right.\" \" And so you ain't had no meat nor bread to eat all this time?"],["didn't you get mud-turkles? Why How you gwyne to git'm? You can't slip up on um en grab um; en how's a body gwyne to hit um wid a rock How could a body do it in de night? en I warn't gwyne to? show mysef on de bank in de daytime.\" \"Well, that's so. You've had to keep in the woods all the time, of course. Did you hear 'em shooting the cannon? \"Oh, yes. I knowed dey was arter you. I see um go by heah; watched um thoo de bushes.\" Some young birds come along, flying a yard or two at a time and lighting. Jim said it was a sign it was going to rain. He said it was a sign when young chickens flew that way, and so he reckoned it was the same way when young birds done it. I was going to catch some of them, but Jim wouldn't let me. He said it was death. He said his father laid mighty sick once, and some of them catched a bird, and his old granny said his father would die, and he did. And Jim said you musn't count the things you are going The same if you shook the table-cloth after sundown."],["And he said if a man owned a bee-hive, and that man died, the bees must be told about it before sun-up next morning, or else the bees would all weaken down and quit work and die. Jim said to cook for dinner, because that would bring bad luck. bees wouldn't sting idiots; but I didn't believe that, because I had tried them lots of times myself, and they wouldn't sting me. I had heard about some of these things before, but not all of them. Jim knowed all kinds of signs. He said he knowed most everything. I said it looked to me like all the signs was about bad luck, and so I asked him if there warn't any good-luck signs. He says: \" Mighty few an' dey ain't no use to a body. What you want to know when good luck's a-comin' for? want to keep it off?\" And he said: \" Ef you's got hairy arms en a hairy breas', it's a sign dat you's agwyne to be rich. Well, dey's some use in a sign like dat, 'kase it's so fur ahead. You see, maybe you's got to be po' a long time fust, en so you might git discourage' en kill yo'sef 'f you didn' know by de sign"],["dat you gwyne to be rich bymeby.\" \" Have you got hairy arms and a hairy breast, Jim? \"What's de use to ax dat question? don' you see I has?\" \" Well, are you rich? \" \" No, but I ben rich wunst, and Wunst I had gwyne to be rich agin. foteen dollars, but I tuck to specalat'n', en got busted out.\" \" What did you speculate in, Jim? \" *' Well, fust I tackled stock.\" \" What kind of stock? \" \" Why, live stock. Cattle, you know. I put ten dollars But I ain' gwyne to resk no mo' money in stock. De cow up 'n' died on my ban's.\" \" So you lost the ten dollars.\" *' No, I didn't I I on'y los' 'bout nine of it. lose it all. sole de hide en taller for a dollar en ten cents.\" You had five dollars and ten cents left. Did you spec\" ulate any more? in a cow. \"Yes. You know dat one-laigged nigger dat b'longsto o\\6 Misto Bradish? well, he sot up a bank, en say anybody dat put in a dollar would git fo' dollars mo' at de en' er de year."],["Well, all de niggers went in, but dey didn't have much. I wuz de on'y one dat had much. So I stuck out for mo' dan fo' dollars, en I said 'f I didn' git it I'd start a bank mysef. Well o' course dat nigger want' to keep me out er de business, bekase he say dey warn't business 'nough for two banks, so he say I could put in my five dollars en he pay me thirtyfive at de en' er de year. \" So I done it. Den I reck'n'd I'd inves' de thirty-five dollars right off en keep things a-movin'. Dey wuz a nigger name' Bob, dat had ketched a wood-flat, en his marster didn' know it; en I bought it off'n him en told him to take de thirty-five dollars when de en' er de year come; but somebody stole de wood-flat dat night, en nex' day de one-laigged nigger say de bank 's busted. So dey didn' none uv us gitno money.\" \" What did you do with the ten cents, Jim?\" \" Well, I 'uz gwyne to spen' it, but I had a dream, en de dream tole me to give it to a nigger name' Balum Balum's Ass dey call him for short, he's one er dem"],["chuckle-heads, you know. But he's lucky, dey say, en I see I warn't lucky. De dream say let Balum inves' de ten cents en he'd make a raise for me. Well, Balum he tuck de money, en when he wuz in church he hear de preacher say dat whoever give to de po' len' to de Lord, en bound' to git his money back a hund'd times. So Balum he tuck en give de ten cents to de po', en laid low to see what wuz gwyne to come of it.\" \" Well, what did come of it, Jim?\" \" Nuffn' never come of it. I couldn' manage to k'leck dat money no way; en Balum he couldn'. I ain' gwyne to len' no mo' money 'dout I see de security. Bonn' to git yo' money back a hund'd times, de preacher says! Ef I could de ten cenfs back, I'd call it squah, en be glad er de chanst.\" \" Well, it's all right, anyway, Jim, long as you're going to be rich again some time or other.\" ''Yes en I's rich now, come to look at it. I owns myI wisht I had de sef, en I's wuth eight hund'd dollars."],["money, I wouldn' want no mo'.\" git"]],"start":91},{"id":9,"title":"Chapter 9","pages":[["WANTED to go and look at a place right about the I middle of the island, that I'd found when I was explorwas ing; so we started and soon got to it, because the island only three miles long and a quarter of a mile wide. This place was a tolerable long steep hill or ridge, about had a rough time getting to the top, the forty foot high. and the bushes so thick. tramped and so steep sides was and all over it, by-and-by found a good big around dumb the towards most up to top on the side cavern in the rock, big as as or three rooms bunchThe cavern was two Illinois. We We It was ed together, and Jim could stand up straight in it. cool in there. Jim was for putting our traps in there, right away, but I said we didn't want to beclimbing up and down there all the time. Jim said if we had the canoe hid in a good place, and had all the traps in the cavern, we could rush there if anybody was to come to the island, and they would never find us without dogs."],["And besides, he said them little birds had said it was going to rain, and did I want the things to get wet? So we went back and got the canoe and paddled up abreast Then we the cavern, and lugged all the traps up there. hunted up a place close by to hide the canoe in, amongst the thick willows. took some fish off of the lines and set them again, and begun to get ready for dinner. The door of the cavern was big enough to roll a hogshead in, and on one side of the door the floor stuck out a little bit and was flat and a good place to build a fire on. So we built it there and cooked dinner. spread the blankets inside for a carpet, and eat our dinner in there. put all the other things handy at the back of the cavern. Pretty soon it darkened up and begun to thunder and lighten; so the birds was right about it. Directly it begun to rain, and it rained like all fury, too, and I never We We We It was one of these regular summer see the wind bldw so."],["It would get so dark that it looked all blue-black storms. outside, and lovely; and the rain would thrash along by so thick that the trees off a little ways looked dim and spiderwebby; and here would come a blast of wind that would bend the trees down and turn up the pale underside of the leaves; and then a perfect ripper of a gust would follow along and set the branches to tossing their arms as if they was just wild; and next, when it was just about the bluest and blackest fst! it was as bright as glory and you'd have a little glimpse of tree-tops a-plunging about, away off yonder in the storm, hundreds of yards further than you could see before; dark as sin again in a second, and now you'd hear the thunder let go with an awful crash and then go rumbling, grumbling, tumbling down the sky towards the under side of the world, like rolling empty barrels down stairs, where it's long stairs and they bounce a good deal, you know. \" I wouldn't want to be nonice,\" I says. where else but here. Pass me along another hunk of fish and Jim, this is some hot corn-bread.\" '' Well, you wouldn't a ben here 'f it hadn't"],["a ben for Jim. You'd a ben down dah in de woods widout any dinner, en gittn' mos' drownded, too, dat you would, honey. Chickens knows when it's gwyne to rain, en so do de birds, chile.\" The river went on raising and raising for ten or twelve days, till at last it was over the banks. The water was three or four foot deep on the island in the low places and on the Illinois bottom. On that side it was a good many miles wide; but on the Missouri side it was the same old distance across a half a mile because the Missouri shore was just a wall of high bluffs. Daytimes we paddled all over the island in the canoe. It was mighty cool and shady in the deep woods even if the sun was blazing outside. We went winding in and out amongst the trees; and sometimes the vines hung so thick we had to back away and go some other way. Well, on every old broken-down tree^ you could see rabbits, and snakes, and such things; and when the island had been overflowed a day or two, they got so tame, on account of being hungry, that you could paddle right up and put your hand on them if"],["you wanted to; but not the snakes and turtles they would slide off in the The ridge our cavern was in, was full of them. We water. could a had pets enough if we'd wanted them. One night we catched a little section of a lumber raft It was twelve foot wide and about fifteen nice pine planks. or sixteen foot long, and the top stood above water six or We could see saw-logs go seven inches, a solid level floor. by in the daylight, sometimes, but we let them go; we didn't show ourselves in daylight. Another night, when we was up at the head of the island, just before daylight, here comes a frame house down, on the She was a two-story, and tilted over, considerwest side. We paddled out and got aboard dumb in at an upable. But it was too dark to see yet, so we made stairs window. the canoe fast and set in her to wait for daylight. The light begun to come before we got to the foot of the Then we looked in at the window. We could make island. out a bed, and a table, and two old chairs, and lots of things around about on the floor; and there was clothes hanging There was something"],["laying on the floor against the wall. So Jim says: in the far corner that looked like a man. \"Hello, you!\" But it didn't budge. So I hollered again, and then Jim says: \"De man ain't asleep he's dead. You hold still I'll go en see.\" He went and bent down and looked, and says: \" It's a dead man. He's ben Yes, indeedy; naked, too. I reck'n he's ben dead two er three days. shot in de back. Come in, Huck, but doan' look at his face it's too gashly.\" Jim throwed some old rags I didn't look at him at all. over him, but he needn't done it; I didn't want to see him. There was heaps of old greasy cards scattered around over the floor, and old whisky bottles, and a couple of masks made out of black cloth; and all over the walls was the ignorantest There was kind of words and pictures, made with charcoal. two old dirty calico dresses, and a sun-bonnet, and some women's underclothes, hanging against the wall, and some men's clothing, too. We put the lot into the canoe; it might come good. There was a boy's old speckled straw hat on And there was a bottle that had the floor; I took that too."],["had milk in it; and it had a rag stopper for a baby to suck. We would a took the bottle, but it was broke. There was a seedy old chest, and an old hair trunk with the hinges broke. They stood open, but there warn't nothing left in them that was any account. The way things v/as scattered about, we reckoned the people left in a hurry and warn't fixed so as to carry off most of their stuff. We got an old tin lantern, and a butcher knife without any handle, and a bran-new Barlow knife worth two bits in any store, and a lot of tallow candles, and a tin candlestick, and a gourd, and a tin cup, and a ratty old bed-quilt off the bed, and a reticule with needles and pins and beeswax and buttons and thread and all such truck in it, and a hatchet and some nails, and a fish-line as thick as my little finger, with some monstrous hooks on it, and a roll of buckskin, and a leather dog-collar, and a horse-shoe, and some vials of medicine that didn't have no label on them; and just as we was leaving I found a tolerable good curry-comb, and Jim he found a ratty The straps was broke"],["off old fiddle-bow, and a wooden leg. of it, but barring that, it was a good enough leg, though it was too long for me and not long enough for Jim, and we couldn't find the other one, though we hunted all around. And so, take it all around, we made a good haul. When we was ready to shove off, we was a quarter of a mile below the island, and it was pretty broad day; so I made Jim lay down in the canoe and cover up with the quilt, because if he set up, people could tell he was a nigger a good ways off. I paddled over to the Illinois shore, and drifted down most a I crept up the dead water under the half a mile doing it. bank, and hadn't no accidents and didn't see nobody. We got home all safe."]],"start":114},{"id":10,"title":"Chapter 10","pages":[["breakfast wanted talk about the dead man and guess out how he come be but I to to killed, Jim He said it would fetch bad luck; and besides, he said, he might come and ha'nt us; he said a man didn't want to. that warn't buried was more likely to go a-ha'nting around than one that was planted and comfortable. That sounded pretty reasonable, so I didn't say no more; but I couldn't keep from studying over it and wishing I knowed who shot the man, and what they done it for. We rummaged the clothes we'd got, and found eight dollars in silver sewed up in the lining of an old blanket overcoat. Jim said he reckoned the people in that house stole the coat, because if they'd a knowed the money was there they wouldn't a left it. I said I reckoned they killed him, too; but Jim didn't want to talk about that. I says: \" Now you think it's bad luck; but what did you say when I fetched in the snake-skin that I found on the top of the ridge day before yesterday? You said it was the worst bad luck in the world to touch a snake-skin with my hands."],["Well, here's your bad luck! We've raked in all this truck and eight dollars besides. I wish we could have some bad luck like this every day, Jim.\" ''Never you mind, honey, never you mind. Don't you git too peart. It's a-comin'. Mind I tell you, it's a-comin'.\" It did come, too. It was a Tuesday that we had that talk. Well, after dinner Friday, we was laying around in the grass at the upper end of the ridge, and got out of tobacco. I went to the cavern to get some, and found a rattlesnake in there. I killed him, and curled him up on the foot of Jim's blanket, ever so natural, thinking there'd be some fun when Jim found him there. Well, by night I forgot all about the snake, and when Jim flung himself down on the blanket while I struck a light, the snake's mate was there, and bit him. He jumped up yelling, and the first thing the light showed was the varmint curled up and ready for another spring. I laid him out in a second with a stick, and Jim grabbed pap's whisky jug and begun to pour it down."],["He was barefooted, and the snake bit him right on the heel. That all comes of my being such a fool as to not remember that wherever you leave a dead snake its mate always comes there and curls around it. Jim told me to chop off the snake's head and throw it away, and then skin the body and roast a piece of it. I don*e it, and he eat it and said it would help cure him. He made me take off the rattles and tie them around his wrist, too. He said that that would help. Then I slid out quiet and throwed the snakes clear away amongst the bushes; for I warn't going to let Jim find out it was all my fault, not if I could help it. Jim sucked and sucked at the jug, and now and then he got out of his head and pitched around and yelled; but every time he come to himself he went to sucking at the jug again. His foot swelled up pretty big, and so did his leg; but byand-by the drunk begun to come, and so I judged he was all right; but I'd druther been bit with a snake than pap's whisky."],["Jim was laid up for four days and nights. Then the swelling was all gone and he was around again. I made up my mind I wouldn't ever take aholt of a snake-skin again with m.y hands, now that I see what had come of it. Jim said he him next would believe time. reckoned I And he said that snake-skin was such handling a awful bad luck that maybe we hadn't got to the end of it yet. He said he druther see the new moon over his left shoulder as much as a thousand times than take up a snake-skin in his hand. Well, I was getting to feel that way myself, though I've always reckoned that looking at the new moon over your left shoulder is one of the carelessest and foolishest things a body can do. Old Hank Bunker done it once, and bragged about it; and in less than two years he got drunk and fell off of the shot tower and spread himself out so that he was just a kind of a layer, as you may say; and they slid him edgeways between two barn doors for a coffin, and buried him so, so they say, but I didn't see it."],["Pap told me. But anyway, it all come of looking at the moon that way, like a fool. Well, the days went along, and the river went down between its banks again; and about the first thing we done was to bait one of the big hooks with a skinned rabbit and set it and catch a cat-fish that was as big as a man, being six foot two inches long, and weighed over two hundred pounds. We couldn't handle him, of course; he would a flung us into Illinois. We just set there and watched him rip and tear till he drownded. We found a brass button in his stomach, and a round ball, and lots of rubbage. We split around the ball open with the hatchet, and there was a spool in it. Jim said he'd had it fhere a long time, to coat it over so and make a ball of it. It was as big a fish as was ever catched in the Mississippi, I reckon. Jim said he hadn't ever seen a bigger one. He would a been worth a good deal over at the village. They peddle out such a fish as that by the pound in the market house there; everybody buys some of him; his meat's as"],["white as snow and makes a good fry. Next morning I said it was getting slow and dull, and I wanted to get a stirring up, some way. I said I reckoned I would slip over the river and find out what was going on. Jim liked that notion; but he said I must go in the dark and look sharp. Then he studied it over and said, couldn't I put on some of them old things and dress up like a girl? That was a good notion, too. So we shortened up one of the calico gowns and I turned up my trowser-Iegs to my knees and got into it. Jim hitched it behind with the hooks, and it was a fair fit. I put on the sun-bonnet and tied it under my chin, and then for a body to look in and see my face was like looking down a joint of stove-pipe. Jim said nobody would know me, even in the daytime, hardly. I practiced around all day to get the hang of the things, and by-and-by I could do pretty well in them, only Jim said I didn't walk like a girl; and he said I must quit pulling up my gown to get at my britches pocket."],["I took notice, and done better. I started up the Illinois shore in the canoe just after dark. I started across to the town from a little below the ferry landing, and the drift of the current fetched me in at the bottom of the town. I tied up and started along the bank. There was a light burning in a little shanty that hadn't been lived in for a long time, and I wondered who had took up quarters there. I slipped up and peeped in at the window. There was a woman about forty year old in there, knitting by I didn't know her face; a candle that was on a pine table. start a face in that town she was a stranger, for you couldn't Now this was lucky, because I was that I didn't know. weakening I was getting afraid I had come people might know my voice and find me out. But if this woman had been in such a little town two days she could tell me all I wanted to know; so I knocked at the door, and made up my mind I wouldn't forget I was a girl.;;"]],"start":122},{"id":11,"title":"Chapter 11","pages":[["/^\"^OME in,\" says the woman, and I did. She says: ''Take a cheer.\" She looked me all over with her little shiny I done it. eyes, and says: \"What might your name be?\" Sarah Williams.\" \" Where 'bouts do you live? In this neighborhood? \" \"No'm. In Hookerville, seven mile below. I've walked all the way and I'm all tired out.\" \" Hungry, too, I reckon. I'll find you something.\" \" No'm, I ain't hungry. I was so hungry I had to stop two mile below here at a farm; so I ain't hungry no more. It's what makes me so late. My mother's down sick, and out of money and everything, and I come to tell my uncle Abner Moore. He lives at the upper end of the town, she says. I hain't ever been here before. Do you know him? \" \" No; but I don't know everybody yet. I haven't lived It's a considerable ways to the upper here quite two weeks. end of the town. You better stay here all night. Take off your bonnet.\" \"No,\" I says, \" I'll rest a while, I reckon, and go on. I ain't afeard of the dark.\" She said she wouldn't let me go by myself, but her husband would be in by-and-by, maybe"],["in a hour and a half, and she'd send him along with me. Then she got to talking about her husband, and about her relations up the river, and her relations down the river, and about how much better off they used to was, and how they didn't know but they'd made a mistake coming to our town, instead of letting well alone and so on and so on, till I was afeard /had made a mistake coming to her to find out what was going on in the town; but by-and-by she dropped onto pap and the murder, and then I was pretty She told about me and willing to let her clatter right along. Tom Sawyer finding the six thousand dollars (only she got it and all about pap and what a hard lot he was, and what a hard lot I was, and at last she got down to where I was murdered. I says: \" Who done it? We've heard considerable about these goings on, down in Hookerville, but we don't know who 'twas that killed Huck Finn.\" \" Well I reckon there's a right smart chance of people here Some think old Finn that'd like to know who killed him."],["done it himself.\" ten) No— is that so? Most everybody thought it at first. He'll never know how nigh he come to getting lynched. But before night they changed around and judged it was done by a runaway nigger named Jim.\" ^'Why//^ She run on, and I stopped. I reckoned I better keep still. never noticed I had put in at all. \" The nigger run off the very night Huck Finn was killed. So there's a reward out for him three hundred dollars. And there's a reward out for old Finn too two hundred dollars. You see, he come to town the morning after the murder, and told about it, and was out with 'em on the ferry-boat hunt, and right away after he up and left. Before night they wanted Well, next day they to lynch him, but he was gone, you see. found out the nigger was gone; they found out he hadn't ben So seen sence ten o'clock the night the murder was done. then they put it on him, you see, and while they was full of it, next day back comes old Finn and went boo-hooing to Judge Thatcher to get money to hunt for the nigger all over Illinois with."],["The judge give him some, and that evening he got drunk and was around till after midnight with a couple of mighty hard looking strangers, and then went off with them. Well, he hain't come back sence, and they ain't looking for him back till this thing blows over a little, for people thinks now that he killed his boy and fixed things so folks would think robbers done it, and then he'd get Huck's money withPeople do out having to bother a long time with a lawsuit. say he warn't any too good to do it. Oh, he's sly, I reckon. If he don't come back for a year, he'll be all right. You can't prove anything on him, you know; everything will be quieted down then, and he'll walk in Huck's money as easy as nothing.\" I don't see nothing in the way of I reckon so, 'm. Has everybody quit thinking the nigger done it? \" \" Oh, no, not everybody. A good many thinks he done it. But they'll get the nigger pretty soon, now, and maybe they ''Yes, it. can scare it out of him.\" \"Why, are they after him yet?\""],["''Well, you're innocent, ain't you! Does three hundred dollars lay round every day for people to pick up? Some I'm one of them folks thinks the nigger ain't far^from here. A few days ago I was talking but I hain't talked it around. with an old couple that lives next door in the log shanty, and they happened to say hardly anybody ever goes to that island over yonder that they call Jackson's Island. Don't anybody live there? says I. No, nobody, says they. I didn't say any more, but I done some thinking. I was pretty near certain I'd seen smoke over there, about the head of the island, a day or two before that, so I says to myself, like as not that nigger's hiding over there; anyway, says I, it's worth the I hain't seen any smoke trouble to give the place a hunt. sence, so I reckon maybe he's gone, if it was him; but husHe was band's going over to see him and another man. gone up the river; but he got back to-day and I told him as soon as he got here two hours ago.\" I had to do someI had got so uneasy I couldn't set still."],["thing with my hands; so I took up a needle off of the table and went to threading it. My hands shook, and I was makWhen the woman stopped talking, I ing a bad job of it. looked up, and she was looking at me pretty curious, and smiling a little. I put down the needle and thread and let on and I was, too and says: to be interested \" Three hundred dollars is a power of money. I wish my mother could get it. Is your husband going over there to\" night? \" Oh, yes. He went up town with the man I was telling you of, to get a boat and see if they could borrow another They'll go over after midnight.\" gun. Couldn't they see better if they was to wait till daytime? And couldn't the nigger see better, too? After Yes. midnight he'll likely be asleep, and they can slip around through the woods and hunt up his camp fire all the better for the dark, if he's got one.\" \"I didn't think of that.\" The woman kept looking at me pretty curious, and I didn't feel a bit comfortable."],["Pretty soon she says: What did you say your name was, honey? Mary Williams.\" Somehow it didn't seem to me that I said it was Mary be** fore, so I didn't look up; seemed to me I said it was Sarah; so I felt sort of cornered, and was afeared maybe I was lookI wished the woman would say something more; ing it, too. But now she the longer she set still, the uneasier I was. says: \"Honey, I thought you said it was Sarah when you first come in? \" Oh, yes'm, I did. Sarah Mary Williams. Sarah's my first name. Some calls me Sarah, some calls me Mary.\" Oh, that's the way of it? \"Yes'm.\" was feeling better, then, but I wished I was out of there, anyway. I couldn't look up yet. I Well, the woman fell to talking about how hard times was, and how poor they had to live, and how the rats was as free as if they owned the place, and so forth, and so on, and then She was right about the rats. You'd see I got easy again. one stick his nose out of a hole in the corner every little She said she had to have things handy to throw at while."],["them when she was alone, or they wouldn't give her no peace. She showed me a bar of lead, twisted up into a knot, and said she was a good shot with it generly, but she'd wrenched her arm a day or two ago, and didn't know whether she could throw true, now. But she watched for a chance, and directly she banged away at a rat, but she missed him wide, and said \" Ouch! \" it hurt her arm so. Then she told me to try for the next one. I wanted to be getting away before the old man got back, but of course I didn't let on. I got the thing, and the first rat that showed his nose I let drive, and if he'd a stayed where he was he'd a been a tolerable sick rat. She said that was first-rate, and she reckoned I would hive the next one. She went and got the lump of lead and fetched it back and brought along a hank of yarn, which she wanted me to ^8 I held up my two hands and she put the hank help her with. over them and went on talking about her and her husband's But she broke off to say: matters."],["\" Keep your eye on the rats. You better have the lead in your lap, handy.\" So she dropped the lump into my lap, just at that moment, and I clapped my legs together on it and she went on talking. But only about a minute. Then she took off the hank and looked me straight in the face, and very pleasant, and says: Come, now what's your real name? Wh-what, mum? \" \" What's your real name? or Is it Bill, or Tom, or Bob? what is it? I reckon I shook like a leaf, and I didn't know hardly what to do. But I says: \" Please to don't poke fun at a poor girl like me, mum. If I'm in the way, here, I'll \" No, you won't. I Set down and stay where you are. ain't going to hurt you, and I ain't going to tell on you, nuther. You just tell me your secret, and trust me. I'll keep it and what's more, I'll help you. So'll my old man, if you want him to. You see, you're a runaway 'prentice that's all. It ain't anything. There ain't any harm in it."],["You've been treated bad, and you made up your mind to cut. Bless you, child, I wouldn't tell on you. Tell me all about it, now that's a good boy.\" So I said it wouldn't be no use to try to play it any longer, and I would just make a clean breast and tell her everything, but she mustn't go back on her promise. Then I told her my father and mother was dead, and the law had bound me out to a mean old farmer in the country thirty mile back from the river, and he treated me so bad I couldn't stand it no longer he went away to be gone a couple of days, and so I took my chance and stole some of his daughter's old clothes, and cleared out, and I had been three nights coming the thirty miles I traveled nights, and hid day-times and slept, and the bag of bread and meat I carried from home lasted me all the' way and I had a plenty. I said I believed my uncle Abner Moore would take care of me, and so that was why I struck out for this town of Goshen.\";;; \" Goshen, child?"],["This ain't Goshen. This is St. Peters- Goshen's ten mile farther up the river. burg. Who told you this was Goshen?\" \" Why, a man I met at day-break this morning, just as I was going to turn into the woods for my regular sleep. He told me when the roads forked I must take the right hand, and five mile would fetch me to Goshen.\" He was drunk I reckon. He told you just exactly wrong. \" Well, he did act like he was drunk, but it ain't no matter now. I got to be moving along. I'll fetch Goshen before day-light.\" Hold on a minute. I'll put you up a snack to eat. You might want it.\" So she put me up a snack, and says Say when a cow's laying down, which end of her gets up first? Answer up prompt, now don't stop to study over it. Which end gets up first? \" ''The hind end, mum.\" \" Well, then, a horse?\": The for'rard end, mum.\" Which side of a tree does the most moss grow on? North side.\" cows If fifteen is browsing on a hillside, how many of them eats with their heads pointed the same direction?\""],["\" The whole fifteen, mum.\" \" Well, I reckon you have lived in the country. I thought What's your real maybe you was trying to hocus me again. name, now?\" ''George Peters, mum.\" Don't forget and tell \"Well, try to remember it, George. me it's Elexander before you go, and then get out by saying And don't go it's George-Elexander when I catch you. about women in that old calico. You do a girl tolerable Bless you, child, poor, but you might fool men, maybe. when you set out to thread a needle, don't hold the thread hold the needle still and still and fetch the needle up to it poke the thread at it that's the way a woman most always And when you does but a man always does 'tother way. throw at a rat or anything, hitch yourself up a tip-toe and fetch your hand up over your head as awkward as you can, and miss your rat about six or seven foot. Throw stiff-;; Bo armed from the shoulder, like there was a pivot there for it to turn on like a girl not from the wrist and elbow, with your arm out to one side, like a boy."],["And mind you, when a girl; she throws her knees apart she don't clap them together, the way you did when you catched the lump of lead. Why, I spotted you for a boy when you was threading the needle and I contrived the other things just to make certain. Now trot along to your tries to catch anything in her lap,;; uncle, Sarah Mary Williams George Elexander Peters, and if you get into trouble you send word to Mrs. Judith Loftus, which is me, and I'll do what I can to get you out of it. Keep the river road, all the way, and next time you tramp, take shoes and socks with you. The river road's a rocky one, and your feet '11 be in a condition when you get to Goshen, I reckon.\" I on went up the bank about fifty yards, and then I doubled my tracks and slipped back to where my canoe was, a 8l good piece below the house. I jumped in and was off in a hurry. I went up stream far enough to make the head of the I took off the sun-bonnet, island, and then started across."],["When I was about for I didn't want no blinders on, then. so I stops and the middle, I hear the clock begin to strike the sound come faint over the water, but clear listens eleven. When I struck the head of the island I never waited to blow, though I was most winded, but I shoved right into the timber where my old camp used to be, and started a good fire there on a high-and-dry spot. Then I jumped in the canoe and dug out for our place a mile and a half below, as hard as I could go. I landed, and slopped through the timber and up the ridge and into the cavern. There Jim laid, sound asleep on the ground. I roused him out and says Git up and hump yourself, Jim There ain't a minute;;:! They're after us never asked no questions, he never said a word but Jim the way he worked for the next half an hour showed about how he was scared. By that time everything we had in the world was on' our raft and she was ready to be shoved out from the willow cove where she was hid."],["We put out the camp fire at the cavern the first thing, and didn't show a candle to lose.!; outside after that. I took the canoe out from shore a little piece and took a look, but if there was a boat around I couldn't see it, for stars and shadows ain't good to see by. Then we got out the raft and slipped along down in the shade, past the foot of the island dead still, never saying a word."]],"start":129},{"id":12,"title":"Chapter 12","pages":[["must a been close onto one o'clock when we got below IT the island at and the raft did seem to go mightylast, If a boat was to come along, we was going to take and break for the Illinois shore and it was well a boat didn't come, for we hadn't ever thought to put the gun into the canoe, or a fishing-line or anything to eat. W-: was in ruther too much of a sweat to think of so many thir.j^::. It warn't good judgment to put evei-ythiiig on the slow. to the canoe; raft. If the men went to the island, I just expect they found the camp fire I built, and watched it all night for Jim to come. Anyways, they stayed away from us, and if my building the fire never fooled them it warn't no fault of mine. I played it as low-down on them as I could. When the first streak of day begun to show, we tied up to a tow-head in a big bend on the Illinois side, and hacked off cotton- wood branches with the hat- -.et and covered up the raft with them so she looked like there had been a cavein in the bank there."],["tow-head is a sand-bar that has cotton-woods on it as thick as harrow-teeth. We had mountains on the Missouri shore and heavy timber on the Illinois side, and the channel was down the Missouri shore at that place, so we warn't afraid of anybody running across us. We laid there all day and watched the rafts and steamboats spin down the Missouri shore, and upbound steamboats fight the big river in the middle. I told Jim all about the time I had jabbering with that woman; and Jim said she was a smart one, and if she was to start after no, us herself she wouldn't set down and watch a camp fire sir, she'd fetch a dog. Well, then, I said, why couldn't she tell her husband to fetch a dog? Jim said he bet she did think of it by the time the men was ready to start, and he believed they must a gone up town to get a dog and so they A lost all that time, or else we wouldn't be here on a tow-head sixteen or seventeen mile below the village no, indeedy, we would be in that same old town again."],["So I said I didn't care what was the reason they didn't get us, as long as they didn't. When it was beginning to come on dark, we poked our heads out of the cottonwood thicket and looked up, and nothing in sight so Jim took up some down, and across of the top planks of the raft and built a snug wigwam to get under in blazing weather and rainy, and to keep the things;; dry. Jim made a floor for the wigwam, and raised it a foot or more above the level of the raft, so now the blankets and all the traps was out of the reach of steamboat waves. Right in the middle of the wigwam we made a layer of dirt about five or six inches deep with a frame around it for to hold it this was to build a fire on in sloppy weathe^^or to its place chilly We the wigwam would keep it from being seen. made an extra steering oar, too, because one of the others might get broke, on a snag or something. fixed up a short forked stick to hang the old lantern on because we must always light the lantern whenever we see a steamboat coming down stream, to keep from getting run"],["over but we wouldn't have to light it for up-stream boats unless we see we was in what they call a \" crossing \" for the river was pretty high yet, very low banks being still a little under water so up-bound boats didn't always run the channel, but hunted easy water. This second night we run between seven and eight hours, We with a current that was making over four mile an hour. catched fish, and talked, and we took a swim now and then to keep off sleepiness. It was kind of solemn, drifting down the big still river, laying on our backs looking up at the stars, and we didn't ever feel like talking loud, and it warn't often We that we laughed, only a little kind of a low chuckle. had mighty good weather, as a general thing, and nothing ever happened to us at all, that night, nor the next, nor the;; We;;;; next. Every night we passed towns, some of them away up on black hillsides, nothing but just a shiny bed of lights, not a house could you see. The fifth night we passed St. Louis, and it was like the whole world lit up."],["In St. Petersburg they used to say there was twenty or thirty thousand people in St. Louis, but I never believed it till I see that wonderful spread of lights at two o'clock that still night. There warn't a sound there; everybody was asleep. Every night, i-kdw, I used to slip ashore, towards ten o'clock, at some little village, and buy ten or fifteen cents' worth of y \\ meal or bacon or other stuff to eat; and sometimes I lifted a chicken that warn't roosting comfortable, and took him along. Pap always said, take a chicken when you get a chance, because if you don't want him yourself you can easy find somebody that does, and a good deed ain't ever forgot. I never see pap when he didn't want the chicken himself, but that is what he used to say, anyway. Mornings, before daylight, I slipped into corn fields and borrowed a watermelon, or a mushmelon, or a punkin, or some new corn, or things of that kind. Pap always said it warn't no harm to borrow things, if you was meaning to pay them back, sometime; but the widow said it warn't anything but a soft name for stealing, and no decent body would do it."],["Jim said he reckoned the widow was partly right and pap was partly right; so the best way would be for us to pick out two or three things from, the list and say we wouldn't borrow them any more then he reckoned it wouldn't be no harm to borrow the others. So we talked it over all one night, drifting along down the river, trying to make up our minds whether to drop the watermelons, or the cantelopes, or the mushmelons or what. But towards daylight we got it all settled satisfactory, and concluded to drop crabapples and p'simmons. We warn't feeling just right, before that, but it was all comfortable now. I was glad the way it come out, too, because crabapples ain't ever good, and the p'simmons wouldn't be ripe for two or three months yet. We shot a water- fowl, now and then, that got up too early in the morning or didn't go to bed early enough in the even- Take it all around, we lived pretty high. The fifth night below St. Louis we had a big storm after ing. midnight, with a power of thunder and lightning, and the rain poured down in a solid sheet."],["We stayed in the wigwam and let the raft take care of itself. When the lightning glared out we could see a big straight river ahead, and high rocky bluffs on both sides. By-and-by says I, ^' Hel-/^, Jim, looky yonder! \" It was a steamboat that had killed herself on a rock. We was drifting straight down for her. The lightning showed her very distinct. She was leaning over, with part of her upper deck above water, and you could see every little chimblyguy clean and clear, and a chair by the big bell, with an old slouch hat hano-'no; on the back of it when the flashes come. Well, it being away in the night, and stormy, and all so mysterious-like, I felt just the way any other boy would a felt when I see that wreck laying there so mournful and lonesome in the middle of the river. I wanted to get aboard of her and slink around a little, and see what there was there. So I says: ''Le's land on her, Jim.\" But Jim was dead against it, at first. He says: \" I doan' want to go fool'n 'long er no wrack."],["We's doin* blame' well, en we better let blame' well alone, as de good book says. Like as not dey's a watchman on dat wrack.\" ''Watchman your grandmother,\" I says; ''there ain't nothing to watch but the texas and the pilot-house; and do you reckon anybody's going to resk his life for a texas and a pilot-house such a night as this, when it's likely to break up and wash off down the river any minute?\" Jim couldn't say \" And besides,\" I says, nothing to that, so he didn't try. ** we might borrow something worth having, out of the cap- tain's stateroom. Seegars, / bet you and cost five cents apiece, solid cash. Steamboat captains is always rich, and get sixty dollars a month, and they don't care a cent what a thing costs, you know, long as they want it. Stick a candle in your pocket; I can't rest, Jim, till we give her a rummaging. Do you reckon Tom Sawyer would ever go by this thing? Not for pie, he wouldn't. He'd call it an adventure that's what he'd call it; and he'd land on that wreck- if it was his last act."],["And wouldn't he throw style into it? wouldn't he spread himself, nor nothing? Why, you'd think it was Christopher C'lumbus discovering Kindgom-Come. I wish Tom Sawye
