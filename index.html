 I shoved on by; but the front door was locked, and the key wasn't there. Just then I heard somebody coming down the stairs, back behind me. I run in the parlor, and took a swift look around, and the only place I see to hide the bag was in the coffin. The lid was shoved along about a foot, showing the dead man's face down in there, with a wet cloth over it, and his shroud on. I tucked the money-bag in under the lid, just down beyond where his hands was crossed, which made me creep, they was so cold, and then I run back across the room and in behind the door."],["The person coming was Mary Jane. She went to the coffin, very soft, and kneeled down and looked in; then she put up her handkerchief and I see she begun to cry, though I couldn't hear her, and her back was to me. I slid out, and as I passed the dining-room I thought I'd make sure them watchers hadn't seen me; so I looked through the crack and everything was all right. They hadn't stirred. I slipped up to bed, feeling ruther blue, on accounts of the thing playing out that way after I had took so miuch trouble and run so much resk about it. Says I, if it could stay where it is, all right because when we get down the river a hundred mile or two, I could write back to Mary Jane, and she could dig him up again and get it but that ain't the thing that's going to happen the thing that's going to happen is, the money '11 be found when they come to screw on the lid. I;;; Then the king '11 get it again, and it '11 be a long day before he gives anybody another chance to smouch it from him."],["Of course I wafited to slide down and get it out of there, but I dasn't try it. Every minute it was getting earlier, now, and pretty soon some of them watchers would begin to stir, and I might get catched catched with six thousand dollars in my hands that nobody hadn't hired me to take care of. I don't wish to be mixed up in no such business as that, I says to myself. When I got down stairs in the morning, the parlor was shut up, ay in and get a look, and the way I lit out and shinned for the road in the dark, there ain't nobody can tell. I had the road all to myself, and I fairly flew leastways I had it all to myself except the solid dark, and the now-andthen glares, and the buzzing of the rain, and the thrashing of the wind, and the splitting of the thunder; and sure as you are born I did clip it along! When I struck the town, I see there warn't nobody out in the storm, so I never hunted for no back streets, but humped it straight through the main one; and when I begun to get towards our house"],["I aimed my eye and set it. No light there; the house all dark which made me feel sorry and disappointed, I didn't know why. But at last, just as I was sailing hy^ flash comes the light in Mary Jane's window! and my heart swelled up sudden, like to bust; and the same second the house and all was behind me in the dark, and wasn't ever going to be before me no more in this world. She was the best girl I ever see, and had the most sand. The minute I was far enough above the town to see I could make the tow-head, I begun to look sharp for a boat to borrow; and the first time the lightning showed me one that It was a canoe. wasn't chained, I snatched it and shoved. and warn't fastened with nothing but a rope. The towhead was a rattling big distance off, away out there in the middle of the river, but I didn't lose no time; and when I struck the raft at last, I w^as so fagged I would a just laid down to blow and gasp if I could afforded it."],["But I didn't. As I sprung aboard I sung out: \" Out with you Jim, and set her loose! Glory be to good\" ness, we're shut of them! Jim lit out, and was a coming for me with both arms spread, he was so full of joy; but when I glimpsed him in the lightning, my heart shot up in my mouth, and I went overboard backwards; for I forgot he was old King Lear and a drownded A-rab all in one, and it most scared the livers and lights out of me. But Jim fished me out, and was going to hug me and bless me, and so on, he was so glad I was back and we was shut of the king and the duke, but I says: *' Not now have it for breakfast, have it for breakfast! Cut loose and let her slide! So, in two seconds, away we went, a sliding down the river, and it did seem so good to be free again and all by ourselves on the big river and nobody to bother us. I had to skip around a bit, and jump up and crack my heels a few times, I couldn't help it; but about the third crack, I noticed a sound that I knowed"],["mighty well and held my breath and listened and waited and sure enough, when the next flash busted out over the water, here they come! and just a laying to their oars and making their skiff hum! It was the king and the duke. So I wilted right down onto the planks, then, and give up; and it was all I could do to keep from crying."]],"start":396},{"id":30,"title":"Chapter 30","pages":[["they got aboard, the king went for me, and shook me by the collar, and says: \" Try in' to give us the slip, was ye, you pup! Tired of our company hey? \" I says: No, your majesty, we warn't please don't, your majesty! \"Quick, then, and tell us what li^as your idea, or I'll shake the insides out o' you! \" Honest, I'll tell you everything, just as it happened, your majesty. The man that had aholt of me was very good to me, and kept saying he had a boy about as big as me that died last year, and he was sorry to see a boy in such a dangerous fix; and when they was all took by surprise by finding the gold, and made a rush for the coffin, he lets go of me and whispers, 'Heel it, now, or they'll hang ye, sure!' and I lit out. It didn't seem no good for vie to stay / couldn't do nothing, and I didn't want to be hung if I could get away. So I never stopped running till I found the canoe; and when or they'd catch me and hang me yet, and said I was afeard you and the duke wasn't alive, I got here I told Jim"],["to hurry, now, and I was awful sorry, and so was Jim, and was awful lid good cussing and made them skip out. They tackled missionarying, and mesmerizing, and doctoring, and telling fortunes, and a little of everything; but they couldn't seem to have no luck."],["So at last they got just about dead broke, and laid around the raft, as she floated along, thinking, and thinking, and never saying nothing, by the half a day at a time, and dreadful blue and desperate. And at last they took a change, and begun to lay their heads together in the wigwam and talk low and confidential two or three hours at a time. Jim and me got uneasy. We didn't like the look of it. We judged they was studying up some kind of worse deviltry than ever. We turned it over and over, and at last we made up our minds they was going to break into somebody's house or store, or was going into the counterfeit-money business, or something. So then we was pretty scared, and made up an agreement that we wouldn't have nothing in the world to do with such actions, and if we ever got the least show we would give them the cold shake.; and clear out and leave them behind. Well, early one morning we hid the raft in a good safe place about two mile below a little bit of a shabby village, named Pikesville, and the kmg he went ashore, and told us all to stay hid whilst he went up to"],["town and smelt around to see if anybody had got any wind (\" House to rob, you of the Royal Nonesuch there yet. 7nean,'' says I to myself; \"and when you get through robbing come back here and wonder what's become of me it you'll and Jim and the raft and you'll have to take it out in wondering.\") And he said if he warn't back by midday, the duke and me would know it was all right, and we was to come along. So we staid where we was. The duke he fretted and sweated He scolded us for around, and was in a mighty sour way. everything, and we couldn't seem to do nothing right; he found fault with every little thing. Something was a-brewing, sure. I was good and glad when midday come and no king; we could have a change, anyway and maybe a chance for So me and the duke went up to the the change, on top of it. village, and hunted around there for the king, and by-and-by we found him in the back room of a little low doggery, very tight, and a lot of loafers bullyragging him for sport, and he a cussing and threatening with all' his might, and so tight he couldn't walk, and"],["couldn't do nothing to them. The duke he begun to abuse him for an old fool, and the king begun to sass back; and the minute they was fairly at it, I lit out, and shook the reefs out of my hind legs, and spun down the river road like a deer for I see our chance; and I made up my mind that it would be a long day before they ever see me and Jim again. I got down there all out of breath but loaded up with joy, and sung out ''Set her loose, Jim, we're all right, now!\" But there warn't no answer, and nobody come out of the wigwam. Jim was gone! I set up a shout and then another and then another one; and run this way and that in the woods, whooping and screeching; but it warn't no use old Jim was gone. Then I set down and cried; I couldn't help it. But I couldn't set still long. Pretty soon I went out on the road, trying to think what I better do, and I run across a boy walking, and asked him if he'd seen a strange nigger, dressed so and so, and he says: ''Yes.\" Wherebouts?\""],["says I. \" Down to Silas Phelps's place, two mile below here. He's a runawaynigger, and they've got him. Was you looking for him?\" '' You bet I ain't! I run across him in the woods about an hour or two ago, and he said if I hollered he'd cut my livers out and told me to lay down and stay where I was; and I done it. Been there ever since; afeard to come out.\" ''Well,\" he says, \"you needn't be afeard no more, becuz they've got him. He run off f'm down South, som'ers.\" *'It's a good job they got him.\" '' Well, I reckon! There's two hunderd dollars reward on him. It's like picking up money out'n the road.\" and /could a had  was full of trouble, full as I could be; and didn't At last I had an idea; and I says, I'll go and write the letter and thtn see if I can pray. Why, it was know what to do. astonishing, the way I felt as light as a feather, right straight off, and my troubles all gone. So I got a piece of paper and a pencil, all glad and excited, and set down and wrote: Miss Watson, your runaway nigger Jim is down here two mile below Pikesville and Mr. Phelps has got him and he will give him up Huck Finn."],["for the reward if you send. I felt good and all washed clean of sin for the first time had ever felt so in my life, and I knowed I could pray now. But I didn't do it straight off, but laid the paper down and set there thinking thinking how good it was all this happened so, and how near I come to being lost and going to hell. And went on thinking. And got to thinking over our trip down the river; and I see Jim before me, all the time, in the day, and in the night-time, sometimes moonlight, sometimes storms, and we a floating along, talking, and singing, and laughing. But somehow I couldn't seem to strike no places to harden me against him, but only the other kind. I'd see him standing my watch on top of his'n, stead of calling me, so I could go on sleeping and see him how glad he was when I come back out of the fog and when I come to him again in the swamp, up there where the feud was; and such-like times; and would always call me honey, and pet me, and do everything he could think of for me, and how good he always was; and at last I"],["struck the time I saved him by telling the men we had small-pox aboard, and he was so grateful, and said I was the best friend old Jim ever had in the world, and the only one he's got now; and then I happened to look around, and see that paper. It was a close place. I took it up, and held it in my hand. I was a trembling, because I'd got to decide, forever, betwixt two things, and I knowed it. I studied a minute, sort of holding my breath, and then says to myself '' All right, and tore it up. then, I'll go to hell \" and awful It was awful thoughts, words, but they was said. And I let them stay said and never thought no more about reforming. I shoved the whole thing out of my head; and said I would take upwickedaess again, which was in my line, I;;; being brnng up to it, and the other warn't. And for a starter, would go to work and steal Jim out of slavery again; and that, too; if I could think up anything worse, I would do because as long as I was in, and in for good, I might as well go the whole hog."],["Then I set to thinking over how to get at it, and turned over considerable many ways in my mind; and at last fixed up a plan that suited me. So then I took the bearings of a woody island that was down the river a piece, and as soon as it was fairly dark I crept out with my raft and went for it, and hid it there, and then turned in. I slept the night through, and got up before it was light, and had my breakfast, and put on my store clothes, and tied up some others and one thing or another in a bundle, and took the canoe and cleared for shore. I landed below where I judged was Phelps's place, and hid my bundle in the woods, and then filled up the canoe with water, and loaded rocks into her and sunk her where I could find her again when I wanted her, about a quarter of a mile below a little steam sawmill that was on the bank. Then I struck up the road, and when I passed the mill I see a sign on it, \" Phelps's Sawmill,\" and when I come to the farm-houses, two or three hundred yards further along, I kept my eyes peeled, but"],["didn't see nobody around, though it was good daylight, now. But I didn't mind, because I didn't want to see nobody just yet I only wanted to get the lay of the land. According to my plan, I was going to turn up there from the village, not from below. So I just took a look, and shoved along, straight for town. Well, the very first man I see, when I got there, was the duke. He was I sticking up a bill for the Royal Nonesuch three-night performance like that other time. They had the cheek, them frauds I was right on him, before I could shirk. He looked astonished, and says *' Hel-/^ Where'd you come from?\" Then he says, kind of glad and eager, \" Where's the raft? got her in a good place?!:./ I says: \" Why, that's just what I was agoing to ask your grace.\" Then he didn't look so joyful and says: \" What was your idea for asking me.?\" he says. \"Well,\" I says, \"when I see the king in that doggery yesterday, I says to myself, we can't get him home for hours, till he's soberer; so I went a loafing around town to put in man up and offered me ten cents to the time,"],["and wait. help him pull a skiff over the river and back to fetch a sheep, and so I went along but when we was dragging him to the boat, and the man left me aholt of the rope and went behind him to shove him along, he was too strong for me, and jerked loose and run, and we after him. We didn't have no dog, and so we had to chase him all over the country till we tired him out. never got him till dark, then we fetched him over, and I started down for the raft. When I got there and see it was gone, I says to myself, they've got into trouble and had to leave and they've took my nigger, which is the only nigger I've got in the world, and now I'm in a strange country, and ain't got no property no more, nor nothing, and no way to make my living; so I set down and cried. I slept in the woods all night. But what did become of the raft then? and Jim, poor Jim \" Blamed if / know that is, what's become of the raft."],["That old fool had made a trade and got forty dollars, and when we found him in the doggery the loafers had matched half dollars with him and got every cent but what he'd spent for whisky; and when I got him home late last That little rasnight and found the raft gone, we said, cal has stole our raft and shook us, and run off down the A; We;! river.' I \" I wouldn't shake my nigg o furnish them, and you had to contrive them ail out of your own head. Now look at just that one thing of the lantern. When you come down to the cold facts, we simply got to let on that a lantern's resky. Why, we could work with a torchlight procession if we wanted to, /believe. Now, whilst I think of it, we got to hunt up something to make a saw out of, the first chance we get.\" \" What do we want of a saw? \" \" What do we want of it?"],["Hain't we got to saw the leg of Jim's bed off, so as to get the chain loose? \"Why, you just said a body could lift up the bedstead and slip the chain off.\" ''Well, if that ain't just like you, Huck Finn. You ca7i get up the infant-schooliest ways of going at a thing. Why, hain't you ever read any books at all? Baron Trenck, nor Casanova, nor Benvenuto Chelleeny, nor Henri IV., nor none of them heroes? Whoever heard of getting a prisoner loose in such an old-maidy way as that? No; the way all the best authorities does, is to saw the bed-leg in two, and leave it just so, and swallow the sawdust, so it can't be found, and put some dirt and grease around the sawed place so the very keenest seneskal can't see no sign of its being sawed, and thinks the bed-leg is perfectly sound. Then, the night you're ready, fetch the leg a kick, down she goes; slip off Nothing to do but hitch your chain, and there you are. your rope-ladder to the battlements, shin down it, break your because a rope-ladder is nineteen foot too leg in the moat and there's your horses and your trusty short, you know vassles, and they scoop you up"],["and fling you across a saddle and away you go, to your native Langudoc, or Navarre, It's gaudy, Huck. I wish there was a or wherever it is. moat to this cabin. If we get time, the night of the escape, we'll dig one.\" I says: \" What do we want of a moat, when we're going to snake him out from under the cabin? But he never heard me. He had forgot me and everything else. He had his chin in his hand, thinking. Pretty soon, 'd a wanted it to hide a knife in, and smuggle it to Jim to kill the the seneskal with, it would a been all right. So I let it go at that, though I couldn't see no advantage in my representing a prisoner, if I got to set down and chaw over a lot of gold-leaf distinctions like that, every time I see a chance to hog a watermelon. Well, as I was saying, we waited that morning till everybody was settled down to business, and nobody in sight around the yard; then Tom he carried the sack into the lean-to whilst I stood off a piece to keep watch. By-and-by he come out, and we went and set down on the wood-pile to talk. He says: \"Everything's all right, now, except tools; and that's easy fixed.\" \" Tools? \" I says. ''Yes.\" \"Tools for what?\" \"Why,to dig with. We ain't agoing iogna7v him out, are we?\" \"Ain't them old crippled picks and things in there good enough to dig a nigger out with?"],["\" I says. He turns on me looking pitying enough to make a body cry, and says: 26/ Huck Finn, did you ever hear of a prisoner having picks and shovels, and all the modern conveniences in his wardrobe if you got to dig himself out with? Now I want to ask you any reasonableness in you at all what kind of a show would that give him to be a hero? Why, they might as well lend him the key, and done with it. Picks and shovels why they wouldn't furnish 'em to a king.\" ''Well, then,\" I says, \"if we don't want the picks and shovels, what do we want? \" A couple of case-knives.\" \" To dig the foundations out from under that cabin with?\" \"Yes.\" ''Confound it, it's foolish, Tom.\" \" It don't make no difference how foolish it is, it's the 7-ight way and it's the regular way. And there ain't no other way, that ever / heard of, and I've read all the books that gives any information about these things. They always dig out with a case-knife and not through dirt, mind you; generly it's through solid rock."],["And it takes them weeks and weeks and weeks, and for ever and ever. Why, look at oral, and I only just the one way; we got to dig him out with the picks, and let on it's case-knives.\" tell wouldn't you. like it It ain't right, to get out and it —but there ain't ain't *' your head gets leveler \"Picks is says. I time, Tom Sawyer,\" the and leveler the thing, moral or no moral; and as for me, I don't care shucks for the morality of it, nohow."],["When I start in to steal a nigger, or a watermelon, or a Sunday-school book, I ain't no ways particular how it's done so it's done. What I want is my nigger; or what I want is my watermelon; or what I want is my Sunday-school book; and if a pick's the handiest thing, that's the thing I'm agoing to dig that nigger or that watermelon or that Sunday-school book out with; and I don't give a dead rat what the authorities thinks about it nuther.\" Well,\" he says, \" there's excuse for picks and letting-on in a case like this; if itwarn't so, I wouldn't approve of it, nor I wouldn't stand by and see the rules broke because right is right, and wrong is wrong, and a body ain't got no business doing wrong when he ain't ignorant and knows better. It might answer {ox you to dig Jim out with a pick, without any letting-on, because you don't know no better; but it wouldn't for me, because I do know better. Gimme a case-knife.\" He had his own by him, but I handed him mine. He flung it down, and says: \" Gimme a case-knifed I didn't know just what to do but then I thought."],["I scratched around amongst the old tools, and got a pick-ax and give it to him, and he took it and went to work, and never said a word. He was always just that particular. Full of principle. So then I got a shovel, and then we picked and shoveled, turn about, and made the fur fly. stuck to it about a half an hour, which was as long as we could stand up; but we had a good deal of a hole to show for it. When I got up stairs, I looked out at the window and see Tom doing his level best with the lightning-rod, but he couldn't come it, his hands was so sore. At last he says: '' It ain't no use, it can't be done. What you reckon I better do? Can't you think up no way? \" ^'- Noiv you're talking!'' I says; all We \"Yes,\" I says, \"but I reckon it ain't regular. Come up the stairs, and let on it's a lightning-rod.\" So he done it. Next day Tom stole a pewter spoon and a brass candlestick in the house, for to make some pens for Jim out of, and six 2/1 tallow candles; and I hung around the nigger cabins, and laid Tom said it"],["wasn't for a chance, and stole three tin plates. enough; but I said nobody wouldn't ever see the plates that Jim throwed out, because they'd fall in the dog-fennel and jimpson weeds under the window-hole then we could tote them back and he could use them over again. So Tom was satisfied. Then he says: \" Now, the thing to study out is, how to get the things to Jim.\" \"Take them in through the hole,\" I says, ''when we get done.\" He only just looked scornful, and said something about nobody ever heard of such an idiotic idea, and then he went By-and-by he said he had ciphered out two or to studying. three ways, but there warn't no need to decide on any of them yet. Said we'd got to post Jim first. it That night we went down the lightning-rod a little after ten, and took one of the candles along, and listened under the window-hole, and heard Jim snoring; so we pitched it in, and it didn't wake him. Then we whirled in with the pick and shovel, and in about two hours and a half the job was done. We crept in under Jim's bed and into the cabin, and pawed around and found the candle and lit it, and"],["stood over Jim a while, and found him looking hearty and healthy, and then we woke him up gentle and gradual. He was so glad to see us he most cried; and called us honey, and all the pet names he could think of; and was for having us hunt up a cold chisel to cut the chain off of his leg with, right away, and clearing out without losing any time. But Tom he showed him how unregular it would be, and set down and told him all about our plans, and how we could alter them in a minute any time there was an alarm; and not to be the least afraid, because we would see he got away, sure. So Jim he said it was all right, and we set there and talked over old times a while, and then Tom asked a lot of questions, and when Jim told him Uncle Silas come in every day or two to pray with him, and Aunt Sally come in to see if he was comfortable and had plenty to eat, and both of them was kind as they could be, Tom says: We'll send you some things \"A^7£/ I know how to fix it."],["by them.\" I said, \"Don't do nothing of the kind; it's one of the most jackass ideas I ever struck;\" but he never paid no attention went right on. It was his way when he'd got his plans to me; set. So he told Jim how we'd have to smuggle in the rope-ladder and other large things, by Nat, the nigger that fed him, and he must be on the lookout, and not be surprised, and not let Nat see him open them; and we would put small things in uncle's coat pockets and he must steal them out; and we would tie things to aunt's apron strings or put them in her apron pocket, if we got a chance; and told him what they would be and what they was for. And told him how to keep a journal on the shirt with his blood, and all that. He told him everything. Jim he couldn't see no sense in the most of it, but he allowed we was white folks and knowed better than him; so he was satisfied, and said he would do it all just pie, as Tom said. Jim had plenty corn-cob pipes and tobacco; so we had a right down good sociable time; then we crawled out through the hole,"],["and so home to bed, with hands that looked like they'd been chawed. Tom was in high spirits. He said it was the best fun he ever had in his life, and the most intellectural; and said if he only could see his way to it we would keep it up all the rest of our lives and leave Jim to our children to get out; for he believed Jim would come to like it better and better the more he got used to it. He said that in that w^ay it could be strung out to as much as eighty year, and would be the best time on record. And he said it would make us all celebrated that had a hand in it. In the morning we went out to the wood-pile and chopped up the brass candle-stick into handy sizes, and Tom put them and the pewter spoon in his pocket. Then we went to the nigger cabins, and while I got Nat's notice off, Tom shoved a piece of candlestick into the middle of a corn-pone that was Jim's pan, and we went along with Nat to see how it would work, and it just worked noble; when Jim bit into it it most mashed all his teeth out; and there"],["warn't ever anything could a worked better. Tom said so himself. Jim he never let on but what it was only just a piece of rock or something like that that's always getting into bread, you know; but after that he never bit into nothing but what he jabbed his fork into it in three or four places, first. And whilst we was a standing there in the dimmish light, here comes a couple of the hounds bulging in, from under Jim's bed; and they kept on piling in till there was eleven of them, and there warn't hardly room in there to get your breath. By jings, we forgot to fasten that lean-to door. The nigger Nat he only just hollered '' witches! \" once, and keeled over onto the floor amongst the dogs, and begun to groan Tom jerked the door open and flung out like he was dying. a slab of Jim's meat, and the dogs went for it, and in two seconds he was out himself and back again and shut the door, 2/4 and I knowed he'd fixed the other door too. Then he went to work on the nigger, coaxing him and petting him, and asking him if he'd been imagining he saw something again."],["He raised up, and bUnked his eyes around, and says: \"Mars Sid, you'll say I's a fool, but if I didn't b'lieve I see most a million dogs, er devils, er some'n, I wisht I may Mars Sid, I did, mos' sholy. die right heah in dese tracks. Dad fetch \\felt um, sah; dey was all over me. \\felt um wisht I could git my han's on one er dem witches jis' But mos'ly I wisht it's all /'d ast. jis' wunst dey'd lemme 'lone, I does.\" I jis' it, wunst —on'y Tom says: \" Well, I tell you what / think. What makes them come here just at this runaway nigger's breakfast-time? It's because they're hungry; that's the reason. You make them a witch pie; that's the thing {ox you to do.\" '' But my Ian', Mars Sid, how's I gwyne to make 'm a witch I hain't ever hearn er pie? I doan' know how to make it. sich a thing b'fo'. \" Well, then, I'll have to make it myself.\" will you? I'll wusshup de groun' ''Will you do it, honey? und'yo' foot, I will! \"All right, I'll do it, seeing it's you, and you've been good But you got to be to us and showed us the runaway nigger."],["mighty careful. When we come around, you turn your back; and then whatever we've put in the pan, don't you let on you see it at all. And don't you look, when Jim unloads the pan something might happen, I don't know what. And above all, don't you hafidle the witch-things.\" \" Han7iel 'm Mars Sid? What is you a talkin' 'bout? I wouldn' lay de weight er my finger on um, notf'r ten hund'd thous'n* billion dollars, I wouldn't.\""]],"start":489},{"id":37,"title":"Chapter 37","pages":[["THAT was all fixed. So then we went away and went to the rubbage-pile in the back yard where they keep the old boots, and rags, and pieces of bottles, and wore-out tin things, and all such truck, and scratched around and found an old tin wash-pan and stopped up the holes as well as we could, to bake the pie in, and took it down cellar and stole it full of flour, and started for breakfast and found a couple of shingle-nails that Tom said would be handy for a prisoner to scrabble his name and sorrows on the dungeon walls with, and dropped one of them in Aunt Sally's apron pocket which was hanging on a chair, and t'other we stuck in the band of Uncle Silas's hat, which was on the bureau, because we heard the children say their pa and ma was going to the runaway nigger's house this morning, and then went to breakfast, and Tom dropped the pewter spoon in Uncle Silas's coat pocket, and Aunt Sally w^asn't come yet, so we had to wait a little while. And when she come she was hot, and red, and cross, and couldn't hardly wait for the blessing; and then she went to sluicing out coffee with one hand and cracking"],["the handiest child's head with her thimble with the other, and says: \"I've hunted high, and I've hunted low, and it does beat all, what has become of your other shirt.\" My heart fell down amongst my lungs and livers and things, and a hard piece of corn-crust started down my throat after it and got met on the road with a cough and was shot across the table and took one of the children in the eye and curled him up like a fishing-worm, and let a cry out of him the size of a war-whoop, and Tom he turned kinder blue around the gills, and it all amounted to a considerable state of things for about a quarter of a minute or as much as that, and I would a sold out for half price if there was a bidder. But after that we was all right again it was the sudden surprise Uncle Silas he says: of it that knocked us so kind of cold. 2/6 \" It's most uncommon curious, I can't understand know perfectly well I took it off, because \" Because man!: you hain't got but one 071. it."],["I Just listen at the /know you took it off, and know it by a better way than your wool-gethering memory, too, because it was on the But it's gone I see it there myself. long and the short of it, and you'll just have to change to a red flann'l one till I can get time to make a new one. And it' 11 be the third I've made in two years; itjustkeeps a body on the jump to keep you in shirts; and whatever you do manage to do with 'm all, is more'n / can make out. A body'd think you 7voiild learn to take some sort of care of 'em, at your time of life.\" \" I know it, Sally, and I do try all I can. But it oughtn't you know I don't see them to be altogether my fault, because they're on me; except when nor have nothing to do with them ^^of them me.\" and I don't believe I've ever lost one of Silas you'd a ''Well, it ain't your fault if you haven't, done it if you could, I reckon. And the shirt ain't all that's gone, nuther."],["Ther's a spoon gone; and that ain't all. There was ten, and now ther's only nine. The calf got the shirt I reckon, but the calf never took the spoon, that's certain.\" \"Why, what else is gone, Sally?\" \" Ther's six candles gone that's what. The rats could a got the candles, and I reckon they did; I wonder they don't walk off with the whole place, the way you're always going to stop their holes and don't do it; and if they warn't fools they'd sleep in your hair, Silas you'd never find it out; but you clo'es-line yesterday that's the can't lay the spoon on the rats, and that I know.'' \"Well, Sally, I'm in fault, and I acknowledge it; I've been remiss; but I won't let to-morrow go by without stopping up them holes. '^ \" Oh, I wouldn't hurry, next year'll do. Matilda Angelina Araminta Phelps I \" Whack comes the thimble, and the child snatches her claws out of the sugar-bowl without fooling around any. Just then, the nigger woman steps onto the passage, and says \" Missus, dey's a sheet gone.'' \" A sheet gone! Well, for the land's sake!"],["\" I'll stop up them holes to-day,\" says Uncle Silas, looking sorrowful. s 2^7 it \"Oh, do shet up! spose the rats took the sheet 1 Where' gone, Lize? \" Clah to goodness I hain't no notion. Miss Sally. She wuz on de clo's-line yistiddy, but she done gone; she ain' dah no mo', now.'' \" I reckon the world is coming to an end. I never see the beat of it, in all my born days. A shirt, and a sheet, and a spoon, and six can \"Missus,\" comes a young yaller wench, '' dey's a brass cannelstick miss'n.\" Cler out from here, you hussy, er I'll take a skillet to ye! Well, she was just a biling. I begun to lay for a chance; I reckoned I would sneak out and go for the woods till the weather moderated. She kept a raging right along, running her insurrection all by herself, and everybody else mighty meek and quiet; and at last Uncle Silas, looking kind of foolish, fishes up that spoon out of his pocket. She stopped, with her mouth open and her hands up; and as for me, I wished I was in Jeruslem or somewheres."],["But not long; because she says: \" \\\\!'=, just as I expected. So you had it in your pocket all the time; and like as not you've got the other things there, How'd it get there? too. \" I reely don't know, Sally,\" he says, kind of apologizing, \" or you know I would tell. I was a-studying over my text in Acts Seventeen, before breakfast, and I reckon I put it in there, not noticing, meaning to put my Testament in, and it must be so, because my Testament ain't in, but I'll go and see, and if the Testament is where I had it, I'll know I didn't put it in, and that will show that I laid the Testament down and took up the spoon, and \" Oh, for the land's sake! Give a body a rest! Go 'long now, the whole kit and biling of ye; and don't come nigh me again till Tve got back my peace of mind.\" I'd a heard her, if she'd a said it to herself, let alone speaking it out; and I'd a got up and obeyed her, if I'd a been dead. As we was passing through the setting-room, the old man he took up his hat, and the shingle-nail fell out on the"],["floor, and he just merely picked it up and laid it on the mantel-shelf, and never said nothing, and went out. Tom see him do it, and remembered about the spoon, and says: 2^8 Well, it ain't no use to send things by him no more, he Then he says: \" But he done us a good turn with the spoon, anyway, without knowing it, and so we'll go and do him one without him knowing it stop up his rat'' ain't reliable.\" holes.\" There was a noble good lot of them, down cellar, and it took us a whole hour, but we done the job tight and good, and ship-shape. Then we heard steps on the stairs, and blowed out our light, and hid; and here comes the old man, with a candle in one hand and a bundle of stuff in t'other, looking as absent-minded as year before last. He went a mooning around, first to one rat-hole and then another, till he'd been to them all. Then he stood about five minutes, picking tallow-drip off of his candle and thinking. Then he turns off slow and dreamy towards the stairs, saying: \" Well, for the life of me I can't remember when I done it."],["could show her now that I warn't to blame on account of But never mind let it go. I reckon it wouldn't do no good.\" And so he went on a mumbling up stairs, and then we left. He was a mighty nice old man. And always is. Tom was a good deal bothered about what to do for a spoon, but he said we'd got to have it so he took a think. When he had ciphered it out, he told me how we was to do; then we went and waited around the spoon-basket till we see Aunt Sally coming, and then Tom went to counting the spoons and laying them out to one side, and I slid one of I the rats.; them up my sleeve, and Tom says: '' Why, Aunt Sally, there aint but nine spoons, yety She says: \" Go 'long to your play, and don't bother me. I know better, I counted 'm myself.\" '' Well, I've counted them twice, Aunty, and /can't make but nine.\" She looked out of all patience, but of course she come to count anybody would. *<I declare to gracious ther' «/;// but nine!\""],["she says. \" Why, what in the world plague take the things, I'll count 'm again.\" So I slipped back the one I had, and when she got done counting, she says: 2/9 \"Hang the troublesome rubbage, ther's ten^ now!\" and But Tom says: she looked huffy and bothered both. '' Why, Aunty, /don't think there's ten,\" \" You numskull, didn't you see me count 'm? \" I know, but '' Well, I'll count 'm again:' So I smouched one, and they come out nine same as the other time. Well, she was in a tearing way just a trembling over, she was so mad. But she counted and counted, till she got that addled she'd start to count-in the basket for a spoon, sometimes; and so, three times they come out right, and three times they come out wrong. Then she grabbed up the basket and slammed it across the house and knocked the cat galley-west; and she said cle'r out and let her have some peace, and if we come bothering around her again be- all 28o twixt that and dinner, she'd skin us. So we had the odd spoon; and dropped it in her apron pocket whilst she was a giving us our sailing-orders, and Jim got it all right, along We"],["was very well satiswith her shingle-nail, before noon. fied with this business, and Tom allowed it was worth twice the trouble it took, because he said now she couldn't ever count them spoons twice alike again to save her life; and wouldn't believe she'd counted them right, if she did; and said that after she'd about counted her head off, for the next three days, he judged she'd give it up and offer to kill anybody that wanted her to ever count them any more. So we put the sheet back on the line, that night, and stole one out of her closet; and kept on putting it back and stealing it again, for a couple of days, till she didn't know how many sheets she had, any more, and said she didn't care^ and warn^t agoing to bullyrag the rest of her soul out about it, and wouldn't count them again not to save her life, she druther die first. So we was all right now, as to the shirt and the sheet and the spoon and the candles, by the help of the calf and the rats and the mixed-up counting; and as to the candlestick, it warn't no consequence, it would blow over by-and-by."],["But that pie was a job; we had no end of trouble with that pie. We fixed it up away down in the woods, and cooked it there; and we got it done at last, and very satisfactory, too; but not all in one day; and we had to use up three wash-pans full of flour, before we got through, and we got burnt pretty much all over, in^places, and eyes put out with the smoke; because, you see, we didn't want nothing but a crust, and we couldn't prop it up right, and she would always cave in. But of course we thought of the right way at last; which was to cook the ladder, too, in the pie. So then we laid in with Jim, the second night, and tore up the sheet all in little strings, and twisted them together, and long before daylight we had a lovely rope, that you could a hung a person with. We let on it took nine months to make it. And in the forenoon we took it down to the woods, but it wouldn't go into the pie. Being made of a whole sheet, that way, there was rope enough for forty pies, if we'd a wanted them, and plenty left over for soup, or"],["sausage, or anything you choose. We could a had a whole dinner. 28l But we didn't need it. All we needed was just enough for didn't cook the pie, and so we throwed the rest away. none of the pies in the wash-pan, afraid the solder would melt; but Uncle Silas he had a noble brass warming-pan which he thought considerable of, because it belonged to one of his ancesters with a long wooden handle that come over from England with William the Conqueror in the Mayfloweior one of them early ships and was hid away up garret with a lot of other old pots and things that was valuable, not on account of being any account because they warn't, but on account of them being relicts, you know, and we snaked her out, private, and took her down there, but she failed on the first pies, because we didn't know how, but she come up smiling on the last one. took and lined her with dough, and set her in the coals, and loaded her up with rag-rope, and put on a dough roof, and shut down the lid, and put hot embers on top, and stood off five foot, with the long handle, cool and comfortable, and in fifteen minutes she turned out"],["a pie that was a satisfaction to look at. But the person that et it would want to fetch a couple of kags of toothpicks along, for if that rope-ladder wouldn't cramp him down to business, I don't know nothing what I'm talking about, and lay him in enough stomach-ache to last him till next time, We We too. Nat didn't look, when we put the witch-pie in Jim's pan; and we put the three tin plates in the bottom of the pan under the vittles; and so Jim got everything all right, and as soon as he was by himself he busted into the pie and hid the ropeladder inside of his straw tick, and scratched some marks on a tin plate and throwed it out of the window-hole."]],"start":500},{"id":38,"title":"Chapter 38","pages":[["and so them pens was a distressid-tough was the saw; and Jim allowed the inscription was job, going to be the toughest of all. That's the one which the But he had to have it; prisoner has to scrabble on the wall. warn't no case of a state pristhere Tom said he'd go^ to; behind, and his to leave inscription his oner not scrabbling coat of arms. \"Look at Lady Jane Grey,\" he says; \"look at Gilford Dudley; look at old Northumberland! Why, Huck, spose what you going to do? how you it is considerble trouble? going to get around it? Jim's gof to do his inscription and coat of arms. They all do.\" Jim says: \"Why, Mars Tom, I no coat o' arm; I hain't got nuffn but dish-yer ole shirt, en you knows I got to keep de journal on dat.\" *'Oh, you don't understand, Jim; a coat of arms is very hain't got different.\" \" Well,\" I says, \" Jim's right, anyway, when he says he hain't got no coat of arms, because he hain't.\" I reckon / knowed that,\" Tom says, <' but you bet he'll have one before he goes out of this because he's going out rig/ifj and there ain't going to be no flaws in his record.\" So"],["whilst me and Jim filed away at the pens on a brickbat apiece, Jim a making his'n out of the brass and I making mine out of the spoon, Tom set to work to think out the coat By-and-by he said he'd struck so many good ones of arms. he didn't hardly know which to take, but there was one which he reckoned he'd decide on. He says: \" On the scutcheon we'll have a bend or in the d and rude to her at times, but he was also entrancing and able to impose his will. “He was an enlightened being who was cruel,” she recalled. “That’s a strange combination.” Midway through the summer, Jobs was almost killed when his red Fiat caught fire. He was driving on Skyline Boulevard in the Santa Cruz Mountains with a high school friend, Tim Brown, who looked back, saw flames coming from the engine, and casually said to Jobs, “Pull over, your car is on fire.”","Jobs did. His father, despite their arguments, drove out to the hills to tow the Fiat home. In order to find a way to make money for a new car, Jobs got Wozniak to drive him to De Anza College to look on the help-wanted bulletin board. They discovered that the Westgate Shopping Center in San Jose was seeking college students who could dress up in costumes and amuse the kids. So for $3 an hour, Jobs, Wozniak, and Brennan donned heavy full-body costumes and headgear to play Alice in Wonderland, the Mad Hatter, and the White Rabbit. Wozniak, in his earnest and sweet way, found it fun. “I said, ‘I want to do it, it’s"],["was cruel,” she recalled. “That’s a strange combination.” Midway through the summer, Jobs was almost killed when his $$$ caught fire. He was driving on Skyline Boulevard in the Santa Cruz Mountains with a high school friend, Tim Brown, who looked back, saw flames coming from the engine, and casually said to Jobs, “Pull over, your car is on fire.” Jobs did. His father, despite their arguments, drove out to the hills to tow the Fiat home. In order to find a way to make money for a new car, Jobs got Wozniak to drive him to De Anza College to look on the help-wanted bulletin board. They discovered that the Westgate Shopping Center in San Jose was seeking college students who could dress up in costumes and amuse the kids.","So for $3 an hour, Jobs, Wozniak, and Brennan donned heavy full-body costumes and headgear to play Alice in Wonderland, the Mad Hatter, and the White Rabbit. Wozniak, in his afen it out. That’s what ‘Heartbreak Hotel’ did to me. It was the first time I’d heard something so stark. Then I had to go back to what this cat had done before. Luckily I caught his name. The Radio Luxembourg signal came back in. Around 1959, when I was fifteen, Doris bought me my first guitar. I was already playing, when I could get one, but you can only tinker when you haven’t got one of your own. It was a Rosetti. And it was about ten quid."],["job. I started where every good guitar player should start—down there on acoustic, on gut strings.","You can get to $$$ later on. Anyway, I couldn’t afford an electric. But I found just playing that Spanish, an old workman, and starting from there, it gave me something to build on. And then you got to steel strings and then finally, wow! Electricity! I mean, probably if I had been born a few years later, I would have leapt on the electric guitar. But if you want to get to the top, you’ve got to start at the bottom, same with anything. Same with running a whorehouse. I would just play every spare moment I got. People describe me then as being oblivious to my surroundings—I’d sit in a corner of a room when a party was going on or a family gathering, and be playing. Some indication of my love of my new instrument is Aunt Marje telling me that when Doris went to hospital and I stayed with Gus for a while, I was never parted from my guitar. I took it everywhere and I went to sleep with my arm laid across it."],["45 rpm. The first entry: ‘Title: Peggy Sue Got Married, Artiste(s): Buddy Holly.’","Underneath that, in a less neat scrawl, are the encircled names of $$$. Mary (crossed out), Jenny (ticked), Janet, Marilyn, Veronica. And so on. ‘Long Players’ are The Buddy Holly Story, A Date with Elvis, Wilde about Marty, The ‘Chirping’ Crickets. The lists include the usuals—Ricky Nelson, Eddie Cochran, Everly Brothers, Cliff Richard—but also Johnny Restivo, ‘The Fickle Chicken’ by the Atmospheres, ‘Always’ by Sammy Turner—forgotten jewels. These were the record lists of the Awakening—the birth of rock and roll on UK shores. Elvis dominated the landscape at this point. He had a section in the notebook all to himself. The very first album I bought. ‘Mystery Train,’ ‘Money Honey,’ ‘Blue Suede Shoes,’ ‘I’m Left, You’re Right, She’s Gone.’ The crème de la crème of his Sun stuff. I slowly acquired a few more, but that was my baby. As impressed as I was with Elvis, I was even more impressed by Scotty Moore and the band."],["another, natural exuberance and seemingly effortless delivery. There was a beautiful flippancy, it seemed to me.","But I had other preoccupations. One of the best things that happened to me at that time, believe it or not, was $$$. Its leader, Baden-Powell, a genuinely nice man who was well tuned in to what small boys liked doing, did believe that without the scouts the empire would collapse. This is where I came in, as a member of the Seventh Dartford Scouts, Beaver Patrol, although the empire was showing signs of collapsing anyway for reasons that had nothing to do with character and tying knots. I think my foray into scouting must have happened just before the guitar really set in—or maybe before I owned one—because when I really started playing the guitar, that was my other world. Scouting was a separate thing from music. I wanted to know how to survive, and I’d read all of Baden-Powell’s books. And now I’ve got to learn all these tricks. I want to know how to find my way around and how to make things work when there’s nobody there to do it for you."]]};

$("#closeBook").onclick=()=>{
 if(state.armingView){state.armingView=false;session.h2g2Mode="FORCE";saveSession();}
 show("library");
};
$("#closeContents").onclick=()=>show("library");

const searchOverlay=$("#searchOverlay");
const searchDock=$("#contentsSearchDock");
const searchForm=$("#searchForm");
const searchInput=$("#searchInput");
const searchCancel=$("#searchCancel");
const searchClear=$("#searchClear");

function syncClear(){
 searchClear.classList.toggle("show",!!searchInput.value);
}
function openSearchOverlay(){
 // Search is theatrically used on H2G2. Keep the ordinary reader control on every Contents page,
 // but route the search state to H2G2 so the arming path is always stable.
 state.book="h2g2";
 searchInput.value="";
 $("#searchResults").innerHTML="";
 syncClear();
 searchOverlay.classList.add("on");
 searchOverlay.setAttribute("aria-hidden","false");
 setTimeout(()=>searchInput.focus(),80);
}
function closeSearchOverlay(){
 searchOverlay.classList.remove("on");
 searchOverlay.setAttribute("aria-hidden","true");
 searchInput.blur();
}

searchDock.onclick=e=>{
 e.preventDefault();
 e.stopPropagation();
 openSearchOverlay();
};
searchCancel.onclick=e=>{
 e.preventDefault();
 closeSearchOverlay();
};
searchClear.onclick=e=>{
 e.preventDefault();
 searchInput.value="";
 $("#searchResults").innerHTML="";
 syncClear();
 searchInput.focus();
};
searchInput.addEventListener("input",syncClear);

searchForm.addEventListener("submit",e=>{
 e.preventDefault();
 const w=searchInput.value.trim();
 if(!w)return;
 setForce(w);
 searchInput.value="improbability";
 syncClear();
 searchInput.blur();
 $("#searchResults").innerHTML=`
   <div class="search-result-group">
     <div class="search-result-bookline"><span>♧ THE HITCHHIKER’S GUIDE</span><span class="search-result-count">3</span></div>
     <div class="search-result-section">Chapter 10</div>
     <button type="button" class="result"><span class="result-page">Page 62</span><span class="result-snippet">…the Infinite <strong>Improbability</strong> Drive, a remarkable new method of crossing vast interstellar distances…</span></button>
     <button type="button" class="result"><span class="result-page">Page 63</span><span class="result-snippet">…as soon as the ship’s drive reaches Infinite <strong>Improbability</strong>, it passes through every conceivable point…</span></button>
     <button type="button" class="result"><span class="result-page">Page 64</span><span class="result-snippet">…the <strong>improbability</strong> factor rapidly reaches one to one and normality is restored…</span></button>
   </div>`;
 $("#searchResults").querySelectorAll(".result").forEach((bt,i)=>bt.onclick=()=>{
   closeSearchOverlay();
   state.book="h2g2";
   state.armingView=true;
   state.armingPage=i;
   render();
   show("reading");
 });
});
$("#reset").onclick=()=>{$("#resetPrompt").classList.add("on");$("#resetPrompt").setAttribute("aria-hidden","false");toast("RESET?",700)};
$("#resetCancel").onclick=()=>{$("#resetPrompt").classList.remove("on");$("#resetPrompt").setAttribute("aria-hidden","true")};
$("#resetConfirm").onclick=()=>{$("#resetPrompt").classList.remove("on");$("#resetPrompt").setAttribute("aria-hidden","true");resetAll()};
