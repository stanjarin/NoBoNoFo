<body>
<section id="library" class="screen on real-library">
  <img src="assets/LIBRARY.png" class="library-art" alt="">
  <div id="libraryHits" class="library-hits" aria-label="Library books"></div>
  <div id="debug" class="force-debug">FORCE: (none)</div><div class="version-tag">v0.66</div>
</section>

<section id="coverScreen" class="screen cover-screen">
  <img id="fullCover" class="full-cover" alt="">
</section>

<section id="contents" class="screen">
  <div class="contents-head">
    <div id="cthumb" class="thumb"></div>
    <div id="ctitle" class="contents-title"></div>
    <button class="close" id="closeContents">×</button>
  </div>
  <div id="chapterList" class="contents-list"></div>

  <button id="contentsSearchDock" class="reader-search-dock" aria-label="Search book"></button>
</section>

<section id="reading" class="screen">
  <div class="reader">
    <div class="readerbar">
      <button class="iconbtn" id="backContents">◉ <span id="chapterNo">1</span></button>
      <div id="barTitle" class="centre"></div>
      <button class="iconbtn right" id="closeBook">×</button>
    </div>
    <div id="slidewrap" class="slidewrap"><div id="slide" class="slide"></div></div>
  </div>
</section>


<div id="searchOverlay" class="search-overlay" aria-hidden="true">
  <div class="search-surface">
    <form id="searchForm" class="search-topbar" autocomplete="off">
      <div class="search-field-shell">
        <input id="searchInput" type="search" placeholder="Search Book" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" aria-label="Search Book">
        <button id="searchClear" class="search-clear" type="button" aria-label="Clear search">×</button>
      </div>
      <button id="searchCancel" class="search-cancel" type="button">Cancel</button>
    </form>
    <div id="searchResults" class="search-results-stage"></div>
  </div>
</div>

<button id="reset" aria-label="reset"></button>

<script>
(()=>{
const $=s=>document.querySelector(s), screens=[...document.querySelectorAll('.screen')];
const lorem=[
"Curabitur ultrices nonummy lacus. Morbi ipsum ipsum, adipiscing eget, tincidunt vitae, pharetra at, tellus. Nulla gravida, arcu eget dictum eleifend, velit ligula suscipit nibh, sagittis imperdiet metus nunc non pede.",
"Aenean congue pede in nisi tristique interdum. Sed commodo, ipsum ac dignissim ullamcorper, odio nulla venenatis nisi, in porta dolor neque venenatis lacus. Pellentesque fermentum.",
"Mauris sit amet ligula ut tellus gravida mattis. Vestibulum ante ipsum primis in faucibus orci luctus et ultrices posuere cubilia Curae; Vestibulum semper enim non eros.",
"Sed vitae arcu. Aliquam erat volutpat. Praesent odio nisl, suscipit at, rhoncus sit amet, porttitor sit amet, leo. Aenean hendrerit est. Etiam ac augue.",
"Morbi tincidunt neque ut lacus. Duis vulputate cursus orci. Mauris justo lorem, scelerisque sit amet, placerat sed, condimentum in, leo."
];
const titles=[
["h2g2","The Hitchhiker’s Guide to the Galaxy","Douglas Adams","#202020"],
["guitar","Guitar King","David Dann","#c9b17d"],
["jobs","Steve Jobs","Walter Isaacson","#ececec"],
["life","Life","Keith Richards","#333"],
["campaign","Fear and Loathing on the Campaign Trail ’72","Hunter S. Thompson","#e5d2a5"],
["arms","A Farewell to Arms","Ernest Hemingway","#d7d0bd"],
["jeeves","The Jeeves Omnibus","P. G. Wodehouse","#d5b568"],
["sot","The Sot-Weed Factor","John Barth","#b9c3aa"],
["huck","Adventures of Huckleberry Finn","Mark Twain","#b7a47c"]
];
const BOOKS={};
const ASSET={
  jeeves:"JEEVES.png", sot:"SOTWEED.png", arms:"ERNEST.png",
  life:"KEEF.png", guitar:"BLOOMERS.png", h2g2:"H2G2.png",
  campaign:"HST.png", huck:"HUCK.png", jobs:"JOBS.png"
};
const LIBRARY_ORDER=["jeeves","sot","arms","life","guitar","h2g2","campaign","huck","jobs"];
titles.forEach((x,bi)=>{
 const chapters=[];
 for(let c=1;c<=8;c++){
   const pages=[];
   for(let p=0;p<5;p++){
     let paras=[lorem[(p+c)%lorem.length],lorem[(p+c+1)%lorem.length],lorem[(p+c+2)%lorem.length]];
     // LOCKED SOCKET RULE:
     // $$$ must occur in the FIRST COMPLETE sentence on any armed page.
     // A carried-over sentence tail may precede it for the "No, the first complete sentence" beat.
     paras[0] = "isn’t what she thought. It was $$$.";
     pages.push(paras);
   }
   chapters.push({id:c,title:`Chapter ${c}${c===3?": The Good Bit":""}`,start:6+(c-1)*27,pages});
 }
 BOOKS[x[0]]={id:x[0],title:x[1],author:x[2],colour:x[3],chapters};
});
let state={force:localStorage.getItem("nobonofoForceWord")||"",book:null,chapter:1,page:0};
let touchX=0;
function show(id){screens.forEach(s=>s.classList.toggle("on",s.id===id));scrollTo(0,0)}
function subst(t){return t.split("$$$").join(state.force||"$$$")}
function setForce(w){state.force=w;localStorage.setItem("nobonofoForceWord",w);debug()}
function debug(){$("#debug").textContent="FORCE: "+(state.force||"(none)")}
function shelf(){
 const el=$("#libraryHits"); el.replaceChildren();
 LIBRARY_ORDER.forEach(id=>{
   const bt=document.createElement("button"); bt.type="button"; bt.className="library-hit"; bt.dataset.book=id;
   bt.setAttribute("aria-label",BOOKS[id].title);
   bt.onclick=e=>{e.preventDefault();};
   el.append(bt);
 });
}

$("#libraryHits").addEventListener("click",e=>{
  // Robust iPhone path: map tap coordinates directly onto the 3x3 cover grid.
  // Prevent child-button bubbling from opening twice.
  e.preventDefault();
  e.stopPropagation();
  const r=$("#libraryHits").getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width;
  const y=(e.clientY-r.top)/r.height;

  const cols=[[0.045,0.331],[0.355,0.641],[0.665,0.951]];
  const rows=[[0.193,0.473],[0.488,0.724],[0.740,0.990]];
  let c=-1, rr=-1;
  cols.forEach((a,i)=>{if(x>=a[0]&&x<=a[1])c=i});
  rows.forEach((a,i)=>{if(y>=a[0]&&y<=a[1])rr=i});
  if(c<0||rr<0)return;
  const id=LIBRARY_ORDER[rr*3+c];
  if(id) openCover(id);
});
let coverTimer=null;
function finishCoverTransition(){
 const cs=$("#coverScreen");
 cs.classList.add("slide-off");
 setTimeout(()=>{
   openContents(state.book);
   cs.classList.remove("slide-off");
 },320);
}
function openCover(id){
 state.book=id;
 const cs=$("#coverScreen");
 cs.classList.remove("slide-off");
 $("#fullCover").src="assets/"+ASSET[id];
 show("coverScreen");
 clearTimeout(coverTimer);
 coverTimer=setTimeout(finishCoverTransition,900);
}
$("#fullCover").onclick=()=>{clearTimeout(coverTimer);finishCoverTransition()};
function openContents(id){
 if($("#searchOverlay")){ $("#searchOverlay").classList.remove("on"); $("#searchOverlay").setAttribute("aria-hidden","true"); }
  if($("#searchInput")) $("#searchInput").value="";
 if($("#searchResults")) $("#searchResults").innerHTML="";

 clearTimeout(coverTimer);
 state.book=id; const b=BOOKS[id];
 $("#contents").classList.toggle("h2g2-contents",id==="h2g2");
 $("#ctitle").textContent=b.title; $("#cthumb").textContent="";
 $("#cthumb").style.background=`url("assets/${ASSET[id]}") center/cover no-repeat`;
 const list=$("#chapterList"); list.replaceChildren();
 b.chapters.forEach(ch=>{
  const r=document.createElement("button");r.className="chapterrow";
  r.innerHTML=`<span>${ch.title}</span><span>${ch.start}</span>`;
  r.onclick=()=>{state.chapter=ch.id;state.page=0;render();show("reading")}; list.append(r);
 });
 show("contents");
}
function render(){
 const b=BOOKS[state.book],ch=b.chapters[state.chapter-1],paras=ch.pages[state.page];
 $("#barTitle").textContent=b.title;$("#chapterNo").textContent=ch.id;
 const first=state.page===0;
 $("#slide").innerHTML=`<div class="page ${first?"chapter-opening":"follower"}">${first?`<div class="chapter-title">Chapter ${ch.id}</div>`:""}<div class="body">${paras.map(p=>`<p>${subst(p)}</p>`).join("")}</div><div class="pageno">${ch.start+state.page}</div><div class="menu">☷</div></div>`;
}
function move(d){
 const ch=BOOKS[state.book].chapters[state.chapter-1], n=state.page+d;
 if(n<0||n>=ch.pages.length)return;
 $("#slide").style.transform=`translateX(${d>0?-35:35}px)`;
 setTimeout(()=>{state.page=n;render();$("#slide").style.transform="translateX(0)"},120);
}
$("#slidewrap").addEventListener("touchstart",e=>touchX=e.changedTouches[0].clientX,{passive:true});
$("#slidewrap").addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)move(dx<0?1:-1)},{passive:true});
$("#backContents").onclick=()=>openContents(state.book);
$("#closeBook").onclick=()=>show("library");
$("#closeContents").onclick=()=>show("library");

const searchOverlay=$("#searchOverlay");
const searchDock=$("#contentsSearchDock");
const searchForm=$("#searchForm");
const searchInput=$("#searchInput");
const searchCancel=$("#searchCancel");
const searchClear=$("#searchClear");

function syncClear(){
 searchClear.classList.toggle("show",!!searchInput.value);
}
function openSearchOverlay(){
 // Search is theatrically used on H2G2. Keep the ordinary reader control on every Contents page,
 // but route the search state to H2G2 so the arming path is always stable.
 state.book="h2g2";
 searchInput.value="";
 $("#searchResults").innerHTML="";
 syncClear();
 searchOverlay.classList.add("on");
 searchOverlay.setAttribute("aria-hidden","false");
 setTimeout(()=>searchInput.focus(),80);
}
function closeSearchOverlay(){
 searchOverlay.classList.remove("on");
 searchOverlay.setAttribute("aria-hidden","true");
 searchInput.blur();
}

searchDock.onclick=e=>{
 e.preventDefault();
 e.stopPropagation();
 openSearchOverlay();
};
searchCancel.onclick=e=>{
 e.preventDefault();
 closeSearchOverlay();
};
searchClear.onclick=e=>{
 e.preventDefault();
 searchInput.value="";
 $("#searchResults").innerHTML="";
 syncClear();
 searchInput.focus();
};
searchInput.addEventListener("input",syncClear);

searchForm.addEventListener("submit",e=>{
 e.preventDefault();
 const w=searchInput.value.trim();
 if(!w)return;
 setForce(w);
 searchInput.value="improbability";
 syncClear();
 searchInput.blur();
 $("#searchResults").innerHTML=`
   <div class="search-result-group">
     <div class="search-result-bookline"><span>♧ THE HITCHHIKER’S GUIDE</span><span class="search-result-count">3</span></div>
     <div class="search-result-section">Chapter 10</div>
     <button type="button" class="result"><span class="result-page">Page 62</span><span class="result-snippet">…the Infinite <strong>Improbability</strong> Drive, a remarkable new method of crossing vast interstellar distances…</span></button>
     <button type="button" class="result"><span class="result-page">Page 63</span><span class="result-snippet">…as soon as the ship’s drive reaches Infinite <strong>Improbability</strong>, it passes through every conceivable point…</span></button>
     <button type="button" class="result"><span class="result-page">Page 64</span><span class="result-snippet">…the <strong>improbability</strong> factor rapidly reaches one to one and normality is restored…</span></button>
   </div>`;
 $("#searchResults").querySelectorAll(".result").forEach(bt=>bt.onclick=()=>{
   closeSearchOverlay();
   state.book="h2g2";
   state.chapter=3;
   state.page=0;
   render();
   show("reading");
 });
});
$("#reset").onclick=()=>{state.force="";localStorage.removeItem("nobonofoForceWord");debug()};
shelf();debug();
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
