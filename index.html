<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>NoBoNoFo 0.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit}
.screen{display:none;min-height:100vh;background:#fff}
.screen.on{display:block}
.library{padding:20px 18px 40px;background:#f5f5f7}
.library h1{font-size:34px;margin:10px 0 18px}
.debug{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#777;margin-bottom:12px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px}
.book{border:0;background:none;padding:0;text-align:left}
.cover{aspect-ratio:2/3;border-radius:3px;box-shadow:0 3px 9px #0003;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;background:#ddd}
.cover strong{font-size:13px;line-height:1.05}
.label{font-size:11px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader{width:100%;min-height:100vh;background:white;position:relative;padding:0 20px 34px}
.readerbar{height:72px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;font-size:14px;color:#6e6e73}
.readerbar .centre{text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:none;padding:10px 0;font-size:17px}
.iconbtn.right{text-align:right}
.contents-head{display:grid;grid-template-columns:62px 1fr 46px;gap:12px;align-items:start;padding:18px 18px 26px}
.thumb{aspect-ratio:2/3;background:#ddd;box-shadow:0 2px 7px #0003;padding:5px;font-size:8px}
.contents-title{font-size:24px;font-weight:700;line-height:1.18;padding-top:4px}
.close{justify-self:end;border:0;background:#f0f0f2;border-radius:50%;width:38px;height:38px;font-size:25px;color:#777}
.contents-list{border-top:1px solid #ddd}
.chapterrow{width:100%;border:0;border-bottom:1px solid #ddd;background:white;display:grid;grid-template-columns:1fr auto;gap:12px;text-align:left;padding:19px 20px;font-weight:700;font-size:18px}
.chapterrow span:last-child{font-weight:400;color:#6e6e73}
.page{min-height:calc(100vh - 72px);position:relative;padding:0 28px 58px;overflow:hidden}
.chapter-opening .chapter-title{font-family:"Times New Roman",Times,serif;font-size:15pt;font-weight:700;margin:18px 0 0}
.chapter-opening .body{margin-top:104px}
.body{font-family:"Times New Roman",Times,serif;font-size:13pt;line-height:16pt;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.body p{margin:0;text-indent:1.2em}
.body p:first-child{ text-indent:0 }
.follower .body{padding-top:10px}
.pageno{position:absolute;bottom:15px;left:0;right:0;text-align:center;color:#eee;font:13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.menu{position:absolute;right:27px;bottom:12px;color:#777;background:#f1f1f3;border-radius:6px;width:23px;height:23px;display:grid;place-items:center;font-size:13px}
.slidewrap{overflow:hidden;touch-action:pan-y}
.slide{transition:transform .16s ease}
.searchbox{padding:18px}
.searchpanel{border-radius:16px;background:#f3f3f5;padding:18px;box-shadow:0 5px 20px #0002}
.searchpanel input{width:100%;font-size:18px;border:0;border-radius:10px;padding:12px;background:white}
.searchresult{padding:14px 4px;border-bottom:1px solid #ddd}
.searchresult b{display:block}
.small{font-size:12px;color:#777}
#reset{position:fixed;left:0;bottom:0;width:18px;height:18px;opacity:.02;border:0}
</style>
</head>
<body>
<section id="library" class="screen on library">
  <h1>Library</h1>
  <div class="debug" id="debug">FORCE: (none)</div>
  <div id="shelf" class="shelf"></div>
</section>

<section id="contents" class="screen">
  <div class="contents-head">
    <div id="cthumb" class="thumb"></div>
    <div id="ctitle" class="contents-title"></div>
    <button class="close" id="closeContents">×</button>
  </div>
  <div id="chapterList" class="contents-list"></div>
</section>

<section id="reading" class="screen">
  <div class="reader">
    <div class="readerbar">
      <button class="iconbtn" id="backContents">◉ <span id="chapterNo">1</span></button>
      <div id="barTitle" class="centre"></div>
      <button class="iconbtn right" id="closeBook">×</button>
    </div>
    <div id="slidewrap" class="slidewrap"><div id="slide" class="slide"></div></div>
  </div>
</section>

<section id="search" class="screen">
 <div class="reader">
  <div class="readerbar"><button class="iconbtn" id="searchBack">‹</button><div class="centre">Search</div><button class="iconbtn right" id="searchClose">×</button></div>
  <div class="searchbox"><div class="searchpanel">
   <input id="searchInput" placeholder="Search this book" autocomplete="off" spellcheck="false">
   <div id="searchResults"></div>
  </div></div>
 </div>
</section>
<button id="reset" aria-label="reset"></button>

<script>
(()=>{
const $=s=>document.querySelector(s), screens=[...document.querySelectorAll('.screen')];
const lorem=[
"Curabitur ultrices nonummy lacus. Morbi ipsum ipsum, adipiscing eget, tincidunt vitae, pharetra at, tellus. Nulla gravida, arcu eget dictum eleifend, velit ligula suscipit nibh, sagittis imperdiet metus nunc non pede.",
"Aenean congue pede in nisi tristique interdum. Sed commodo, ipsum ac dignissim ullamcorper, odio nulla venenatis nisi, in porta dolor neque venenatis lacus. Pellentesque fermentum.",
"Mauris sit amet ligula ut tellus gravida mattis. Vestibulum ante ipsum primis in faucibus orci luctus et ultrices posuere cubilia Curae; Vestibulum semper enim non eros.",
"Sed vitae arcu. Aliquam erat volutpat. Praesent odio nisl, suscipit at, rhoncus sit amet, porttitor sit amet, leo. Aenean hendrerit est. Etiam ac augue.",
"Morbi tincidunt neque ut lacus. Duis vulputate cursus orci. Mauris justo lorem, scelerisque sit amet, placerat sed, condimentum in, leo."
];
const titles=[
["h2g2","The Hitchhiker’s Guide to the Galaxy","Douglas Adams","#202020"],
["guitar","Guitar King","David Dann","#c9b17d"],
["jobs","Steve Jobs","Walter Isaacson","#ececec"],
["life","Life","Keith Richards","#333"],
["campaign","Fear and Loathing on the Campaign Trail ’72","Hunter S. Thompson","#e5d2a5"],
["arms","A Farewell to Arms","Ernest Hemingway","#d7d0bd"],
["jeeves","The Jeeves Omnibus","P. G. Wodehouse","#d5b568"],
["sot","The Sot-Weed Factor","John Barth","#b9c3aa"],
["huck","Adventures of Huckleberry Finn","Mark Twain","#b7a47c"]
];
const BOOKS={};
titles.forEach((x,bi)=>{
 const chapters=[];
 for(let c=1;c<=8;c++){
   const pages=[];
   for(let p=0;p<5;p++){
     let paras=[lorem[(p+c)%lorem.length],lorem[(p+c+1)%lorem.length],lorem[(p+c+2)%lorem.length]];
     if(bi>0) paras[1]=paras[1].replace("venenatis lacus","$$$ lacus");
     pages.push(paras);
   }
   chapters.push({id:c,title:`Chapter ${c}${c===3?": The Good Bit":""}`,start:6+(c-1)*27,pages});
 }
 BOOKS[x[0]]={id:x[0],title:x[1],author:x[2],colour:x[3],chapters};
});
let state={force:localStorage.getItem("nobonofoForceWord")||"",book:null,chapter:1,page:0};
let touchX=0;
function show(id){screens.forEach(s=>s.classList.toggle("on",s.id===id));scrollTo(0,0)}
function subst(t){return t.split("$$$").join(state.force||"$$$")}
function debug(){$("#debug").textContent="FORCE: "+(state.force||"(none)")}
function shelf(){
 const el=$("#shelf"); el.replaceChildren();
 Object.values(BOOKS).forEach(b=>{
  const bt=document.createElement("button");bt.className="book";
  bt.innerHTML=`<div class="cover" style="background:${b.colour};color:${b.id==="h2g2"||b.id==="life"?"white":"#111"}"><strong>${b.title}</strong><span>${b.author}</span></div><div class="label">${b.title}</div>`;
  bt.onclick=()=>openContents(b.id); el.append(bt);
 });
}
function openContents(id){
 state.book=id; const b=BOOKS[id];
 $("#ctitle").textContent=b.title; $("#cthumb").textContent=b.title;
 $("#cthumb").style.background=b.colour;
 const list=$("#chapterList"); list.replaceChildren();
 b.chapters.forEach(ch=>{
  const r=document.createElement("button");r.className="chapterrow";
  r.innerHTML=`<span>${ch.title}</span><span>${ch.start}</span>`;
  r.onclick=()=>{state.chapter=ch.id;state.page=0;render();show("reading")}; list.append(r);
 });
 show("contents");
}
function render(){
 const b=BOOKS[state.book],ch=b.chapters[state.chapter-1],paras=ch.pages[state.page];
 $("#barTitle").textContent=b.title;$("#chapterNo").textContent=ch.id;
 const first=state.page===0;
 $("#slide").innerHTML=`<div class="page ${first?"chapter-opening":"follower"}">${first?`<div class="chapter-title">Chapter ${ch.id}</div>`:""}<div class="body">${paras.map(p=>`<p>${subst(p)}</p>`).join("")}</div><div class="pageno">${ch.start+state.page}</div><div class="menu">☷</div></div>`;
}
function move(d){
 const ch=BOOKS[state.book].chapters[state.chapter-1], n=state.page+d;
 if(n<0||n>=ch.pages.length)return;
 $("#slide").style.transform=`translateX(${d>0?-35:35}px)`;
 setTimeout(()=>{state.page=n;render();$("#slide").style.transform="translateX(0)"},120);
}
$("#slidewrap").addEventListener("touchstart",e=>touchX=e.changedTouches[0].clientX,{passive:true});
$("#slidewrap").addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)move(dx<0?1:-1)},{passive:true});
$("#backContents").onclick=()=>openContents(state.book);
$("#closeBook").onclick=()=>show("library");
$("#closeContents").onclick=()=>show("library");
$("#searchClose").onclick=()=>show("library");
$("#searchBack").onclick=()=>openContents("h2g2");

// Temporary H2G2 arming: long-press its cover -> fake search.
let timer;
$("#shelf").addEventListener("touchstart",e=>{
 const bt=e.target.closest(".book"); if(!bt)return;
 const all=[...$("#shelf").children], idx=all.indexOf(bt);
 if(idx!==0)return;
 timer=setTimeout(()=>{state.book="h2g2";$("#searchInput").value="";$("#searchResults").innerHTML="";show("search");$("#searchInput").focus()},550);
},{passive:true});
$("#shelf").addEventListener("touchend",()=>clearTimeout(timer),{passive:true});

$("#searchInput").addEventListener("keydown",e=>{
 if(e.key!=="Enter")return;
 const typed=e.target.value.trim();
 if(typed){state.force=typed;localStorage.setItem("nobonofoForceWord",typed)}
 e.target.value="improbability";
 $("#searchResults").innerHTML=`<div class="searchresult"><b>Infinite Improbability Drive</b><span class="small">…the principle of generating finite improbability…</span></div><div class="searchresult"><b>Chapter 10</b><span class="small">…improbability was treated as an engineering problem…</span></div>`;
 debug();
});
$("#searchResults").onclick=()=>{state.book="h2g2";state.chapter=3;state.page=0;render();show("reading")};

$("#reset").onclick=()=>{state.force="";localStorage.removeItem("nobonofoForceWord");debug()};
shelf();debug();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
