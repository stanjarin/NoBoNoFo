d of amazing.”"]],"campaign":[["The society columnists had nothing to say about $$$. It was shortly after dawn as I recall when I struggled into Washington just ahead of the rush hour government worker car pool traffic boiling up from the Maryland suburbs—humping along in the slow lane on U.S. Interstate 70S like a crippled steel-piss-ant dragging a massive orange U-Haul trailer full of books and important papers. Feeling painfully slow & helpless because the Volvo was never made for this kind of work. It’s a quick little beast and one of the best ever built for rough road mud & snow driving—but not even the new six-cylinder super Volvo is up to hauling 2000 pounds of heavy stuff across the country from Woody Creek Colorado to Washington D.C.","The odometer read 2155 when I crossed the Maryland line at the sun came up over Hagerstown … still confused after getting lost in a hamlet called Breezewood in Pennsylvania. I’d stopped there to ponder the drug quest on with two freaks I met on the Turnpike. They had blown a tire east of Everett but nobody would stop to lend them a jack. They had a spare tire—and a jack too for that matter—but no jack handle, no way to crank the car up and put the spare on. They had gone out to Cleveland from Baltimore—to take advantage of the brutally depressed used-car"],["quite believe what I thought I’d just seen. Here I was all alone on the Pennsylvania Turnpike on a fast downhill grade—running easily, for a change—when suddenly out of the darkness in a corner of my right eye I glimpsed what appeared to be a $$$ running towards the road. I hit the brakes and pulled over. What the fuck was that? I had noticed a disabled car as I crested the hill, but the turnpikes & freeways are full of abandoned junkers these days … and you don’t really notice them, in your brain, until you start to zoom past one and suddenly have to swerve left to avoid killing a big furry white animal, lunging into the road on its hind legs.","A white bear? A giant’s o rd coffee and $$$ and I explained, winefully, how we did not do the things we wanted to do; we never did such things. We two were talking while the others argued. I had wanted to go to Abruzzi. I had gone to no place where the roads were frozen and hard as iron, where it was clear cold and dry and the snow was dry and powdery and hare-tracks in the snow and the peasants took off their hats and called you Lord and there was good hunting. I had gone to no such place but to the smoke of cafés and nights when the room whirled and you needed to look at the wall to make it stop, nights in bed, drunk, when you knew that that was all there was, and the strange excitement of waking and not knowing who it was with you, and the world all unreal in the dark and so exciting that you must resume again unknowing and not caring in the night, sure that this was all and all and all and not caring.","Suddenly to care very much and to sleep to wake with it sometimes morning and all that had been there gone and everything sharp and hard and clear and sometimes a dispute about the cost. Sometimes still pleasant and fond and warm and breakfast and lunch. Sometimes all niceness gone and glad"]],"h2g2":[["O n this particular Thursday, something was moving quietly through the ionosphere many miles above the surface of the planet; several somethings in fact, several dozen huge yellow chunky slablike somethings, huge as office blocks, silent as birds. They soared with ease, basking in electromagnetic rays from the star Sol, biding their time, grouping, preparing. The planet beneath them was almost perfectly oblivious of their presence, which was just how they wanted it for the moment. The huge yellow something went unnoticed at Goon-hilly, they passed over Cape Canaveral without a blip, Woomera and Jodrell Bank looked straight through them, which was a pity because it was exactly the sort of thing they’d been looking for all these years.","The only place they registered at all was on a small b an, Everly Brothers, Cliff Richard—but also Johnny Restivo, ‘The Fickle Chicken’ by the Atmospheres, ‘Always’ by Sammy Turner—forgotten jewels. These were the record lists of the Awakening—the birth of rock and roll on UK shores. Elvis dominated the landscape at this point. He had a section in the notebook all to himself. The very first album I bought. ‘Mystery Train,’ ‘Money Honey,’ ‘Blue Suede Shoes,’ ‘I’m Left, You’re Right, She’s Gone.’ The crème de la crème of his Sun stuff. I slowly acquired a few more, but that was my baby. As impressed as I was with Elvis, I was even more impressed by Scotty Moore and the band."],["another, natural exuberance and seemingly effortless delivery. There was a beautiful flippancy, it seemed to me.","But I had other preoccupations. One of the best things that happened to me at that time, believe it or not, was $$$. Its leader, Baden-Powell, a genuinely nice man who was well tuned in to what small boys liked doing, did believe that without the scouts the empire would collapse. This is where I came in, as a member of the Seventh Dartford Scouts, Beaver Patrol, although the empire was showing signs of collapsing anyway for reasons that had nothing to do with character and tying knots. I think my foray into scouting must have happened just before the guitar really set in—or maybe before I owned one—because when I really started playing the guitar, that was my other world. Scouting was a separate thing from music. I wanted to know how to survive, and I’d read all of Baden-Powell’s books. And now I’ve got to learn all these tricks. I want to know how to find my way around and how to make things work when there’s nobody there to do it for you."]]};

const searchOverlay=$("#searchOverlay");
const searchDock=$("#contentsSearchDock");
const searchForm=$("#searchForm");
const searchInput=$("#searchInput");
const searchCancel=$("#searchCancel");
const searchClear=$("#searchClear");

function syncClear(){
 searchClear.classList.toggle("show",!!searchInput.value);
}
function openSearchOverlay(){
 // Search is theatrically used on H2G2. Keep the ordinary reader control on every Contents page,
 // but route the search state to H2G2 so the arming path is always stable.
 state.book="h2g2";
 searchInput.value="";
 $("#searchResults").innerHTML="";
 syncClear();
 searchOverlay.classList.add("on");
 searchOverlay.setAttribute("aria-hidden","false");
 setTimeout(()=>searchInput.focus(),80);
}
function closeSearchOverlay(){
 searchOverlay.classList.remove("on");
 searchOverlay.setAttribute("aria-hidden","true");
 searchInput.blur();
}

searchDock.onclick=e=>{
 e.preventDefault();
 e.stopPropagation();
 openSearchOverlay();
};
searchCancel.onclick=e=>{
 e.preventDefault();
 closeSearchOverlay();
};
searchClear.onclick=e=>{
 e.preventDefault();
 searchInput.value="";
 $("#searchResults").innerHTML="";
 syncClear();
 searchInput.focus();
};
searchInput.addEventListener("input",syncClear);

searchForm.addEventListener("submit",e=>{
 e.preventDefault();
 const w=searchInput.value.trim();
 if(!w)return;
 setForce(w);
 searchInput.value="improbability";
 syncClear();
 searchInput.blur();
 $("#searchResults").innerHTML=`
   <div class="search-result-group">
     <div class="search-result-bookline"><span>♧ THE HITCHHIKER’S GUIDE</span><span class="search-result-count">3</span></div>
     <div class="search-result-section">Chapter 10</div>
     <button type="button" class="result"><span class="result-page">Page 62</span><span class="result-snippet">…the Infinite <strong>Improbability</strong> Drive, a remarkable new method of crossing vast interstellar distances…</span></button>
     <button type="button" class="result"><span class="result-page">Page 63</span><span class="result-snippet">…as soon as the ship’s drive reaches Infinite <strong>Improbability</strong>, it passes through every conceivable point…</span></button>
     <button type="button" class="result"><span class="result-page">Page 64</span><span class="result-snippet">…the <strong>improbability</strong> factor rapidly reaches one to one and normality is restored…</span></button>
   </div>`;
 $("#searchResults").querySelectorAll(".result").forEach(bt=>bt.onclick=()=>{
   closeSearchOverlay();
   state.book="h2g2";
   state.chapter=3;
   state.page=0;
   render();
   show("reading");
 });
});
$("#reset").onclick=()=>{state.force="";localStorage.removeItem("nobonofoForceWord");debug()};
shelf();debug();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
